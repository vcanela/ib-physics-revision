<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resistor Network Trainer</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#15150f;--panel:#232316;--border:#48482a;--text:#eeeedd;--muted:#b3b389;--bright:#fbfbf0;--wire:#facc15;--currentc:#fb923c;--correct:#34d399;--incorrect:#f87171;--accent:#ca8a04;--accentBg:#3b3407;--accentTxt:#fde047}
  body{font-family:'IBM Plex Sans','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:22px 18px;min-height:100vh}
  .container{max-width:1150px;margin:0 auto}
  .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.05em;padding:3px 10px;border-radius:6px;background:var(--accentBg);color:var(--accentTxt);margin-bottom:8px}
  h2{font-size:22px;font-weight:700;color:var(--bright);margin-bottom:4px}
  .subtitle{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .tab.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
  .controls{background:var(--panel);border-radius:12px;padding:16px;border:1px solid var(--border)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
  .btn-group{display:flex;flex-wrap:wrap;gap:4px}
  .dir-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .dir-btn.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .quiz-prompt{font-size:14px;font-weight:600;margin-bottom:10px}
  .quiz-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .opt-btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;min-width:96px;text-align:center;transition:all .15s}
  .opt-btn.selected{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .opt-btn.correct{border-color:var(--correct);background:#064e3b;color:var(--correct);font-weight:700}
  .opt-btn.wrong{border-color:var(--incorrect);background:#7f1d1d;color:var(--incorrect);font-weight:700}
  .opt-btn.locked{cursor:default}
  .check-btn{padding:8px 24px;border-radius:8px;border:none;background:var(--accent);color:#241d02;font-weight:700;font-size:14px;cursor:pointer}
  .check-btn:disabled{background:#48482a;color:#8a8a5c;cursor:default}
  .result-text{font-size:15px;font-weight:700;margin-bottom:6px}
  .result-text.correct{color:var(--correct)}
  .result-text.wrong{color:var(--incorrect)}
  .hint-text{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .next-row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .score{font-size:13px;color:var(--muted)}
  .score strong{color:var(--correct)}
  .pedagogy{margin-top:16px;padding:14px 16px;background:#1b1b11;border-radius:10px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.65}
  .pedagogy strong{color:var(--bright)}
  .section-title{font-size:15px;font-weight:700;color:var(--bright);margin-bottom:8px}
  .section-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .readout{margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.8}
  .readout .m{color:var(--muted)}
  .eq{display:block;white-space:nowrap}
  svg{display:block;border-radius:12px;width:100%;height:auto}
</style>
</head>
<body>
<div class="container">
  <span class="chip">THEME B · MATTER · B5 CURRENT AND CIRCUITS</span>
  <h2>Resistor Network Trainer</h2>
  <p class="subtitle">Series: same current, p.d. shares as R. &nbsp;|&nbsp; Parallel: same p.d., current shares as 1/R.</p>

  <div class="tabs">
    <button class="tab active" id="tabExplore" onclick="switchMode('explore')">Explore Networks</button>
    <button class="tab" id="tabQuiz" onclick="switchMode('quiz')">Quiz Me</button>
    <button class="tab" id="tabRatio" onclick="switchMode('ratio')">The Ratio Game</button>
  </div>

  <div class="main">
    <div id="svgContainer"></div>
    <div id="controlsContainer"></div>
  </div>
  <div class="pedagogy" id="pedagogy"></div>
</div>

<script>
// ============================================================
// Three preset families, EMF 12 V, ideal battery.
// series:   Req = R1 + R2           (same I; V shares as R)
// parallel: Req = R1 R2/(R1 + R2)   (same V; I shares as 1/R)
// combo:    R1 in series with (R2 parallel R3)
// ============================================================

const W=800,H=420,EMF=12;
const RVALS=[10,20,30,60];

let mode="explore";
let fam="combo";
let vals={r1:20,r2:30,r3:60};
let quizQ=null,quizGuess=null,quizResult=null;
let score={correct:0,total:0};
let ratioR2=40;

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(x){return Number.isInteger(x)?String(x):Number(x.toFixed(2)).toString();}

function solve(f,v){ // returns {req,i1,i2,i3,v1,v2,v3}
  if(f==="series"){
    const req=v.r1+v.r2,i=EMF/req;
    return{req,i1:i,i2:i,v1:i*v.r1,v2:i*v.r2};
  }
  if(f==="parallel"){
    const req=v.r1*v.r2/(v.r1+v.r2);
    return{req,i1:EMF/v.r1,i2:EMF/v.r2,v1:EMF,v2:EMF};
  }
  const rp=v.r2*v.r3/(v.r2+v.r3);
  const req=v.r1+rp,i=EMF/req;
  const vp=i*rp;
  return{req,i1:i,i2:vp/v.r2,i3:vp/v.r3,v1:i*v.r1,v2:vp,v3:vp};
}
function newVals(){
  vals={r1:pick(RVALS),r2:pick(RVALS),r3:pick(RVALS)};
  render();
}
function setFam(f){fam=f;render();}

// ---- drawing ----
function resistor(x,y,horiz,label,sub,color){
  color=color||"#facc15";
  let s="";
  const L=64,amp=7,n=6;
  if(horiz){
    let d="M "+(x)+" "+y;
    const seg=L/(n+1);
    for(let i=1;i<=n;i++)d+=" L "+(x+seg*i)+" "+(y+(i%2?-amp:amp));
    d+=" L "+(x+L)+" "+y;
    s+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
    s+=`<text x="${x+L/2}" y="${y-14}" fill="${color}" font-size="12" font-weight="700" text-anchor="middle">${label}</text>`;
    if(sub)s+=`<text x="${x+L/2}" y="${y+26}" fill="#b3b389" font-size="11" text-anchor="middle">${sub}</text>`;
  }else{
    let d="M "+x+" "+y;
    const seg=L/(n+1);
    for(let i=1;i<=n;i++)d+=" L "+(x+(i%2?-amp:amp))+" "+(y+seg*i);
    d+=" L "+x+" "+(y+L);
    s+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
    s+=`<text x="${x+16}" y="${y+L/2-2}" fill="${color}" font-size="12" font-weight="700">${label}</text>`;
    if(sub)s+=`<text x="${x+16}" y="${y+L/2+14}" fill="#b3b389" font-size="11">${sub}</text>`;
  }
  return s;
}
function battery(x,y){
  return`<line x1="${x-14}" y1="${y}" x2="${x+14}" y2="${y}" stroke="#eeeedd" stroke-width="0"/>
  <line x1="${x}" y1="${y-16}" x2="${x}" y2="${y-4}" stroke="#eeeedd" stroke-width="3"/>
  <line x1="${x-9}" y1="${y-4}" x2="${x+9}" y2="${y-4}" stroke="#eeeedd" stroke-width="3"/>
  <line x1="${x-4}" y1="${y+4}" x2="${x+4}" y2="${y+4}" stroke="#eeeedd" stroke-width="3"/>
  <line x1="${x}" y1="${y+4}" x2="${x}" y2="${y+16}" stroke="#eeeedd" stroke-width="3"/>
  <text x="${x+14}" y="${y-8}" fill="#eeeedd" font-size="11">${EMF} V</text>`;
}
function wire(pts){
  let d="M "+pts[0][0]+" "+pts[0][1];
  for(let i=1;i<pts.length;i++)d+=" L "+pts[i][0]+" "+pts[i][1];
  return`<path d="${d}" fill="none" stroke="#8a8a5c" stroke-width="2"/>`;
}
function iArrow(x,y,dx,dy,i,label){
  const len=18+i*22;
  return`<g><line x1="${x}" y1="${y}" x2="${x+dx*len}" y2="${y+dy*len}" stroke="#fb923c" stroke-width="3"/><polygon points="${x+dx*(len+9)},${y+dy*(len+9)} ${x+dx*len-dy*5},${y+dy*len+dx*5} ${x+dx*len+dy*5},${y+dy*len-dx*5}" fill="#fb923c"/><text x="${x+dx*len/2-dy*16}" y="${y+dy*len/2+dx*16+4}" fill="#fb923c" font-size="11" font-weight="700">${label}</text></g>`;
}
function renderCircuit(f,v,showAnswers){
  const s=solve(f,v);
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#101008;border-radius:12px;display:block">`;
  const info=(x,y,txt,col)=>`<text x="${x}" y="${y}" fill="${col||'#b3b389'}" font-size="11" text-anchor="middle">${txt}</text>`;
  if(f==="series"){
    svg+=wire([[140,300],[140,120],[280,120]]);
    svg+=resistor(280,120,true,"R₁ = "+v.r1+" Ω",showAnswers?fmt(s.v1)+" V":"" );
    svg+=wire([[344,120],[430,120]]);
    svg+=resistor(430,120,true,"R₂ = "+v.r2+" Ω",showAnswers?fmt(s.v2)+" V":"" );
    svg+=wire([[494,120],[640,120],[640,300],[140,300]]);
    svg+=battery(390,300);
    if(showAnswers)svg+=iArrow(180,120,1,0,s.i1/1.2,"I = "+fmt(s.i1)+" A");
    svg+=info(390,360,"series: one path, one current; the p.d. splits in proportion to R");
  }else if(f==="parallel"){
    svg+=wire([[140,300],[140,110],[300,110]]);
    svg+=wire([[300,110],[300,150],[340,150]]);
    svg+=wire([[300,110],[300,70],[340,70]]);
    svg+=resistor(340,70,true,"R₁ = "+v.r1+" Ω",showAnswers?fmt(s.i1)+" A":"");
    svg+=resistor(340,150,true,"R₂ = "+v.r2+" Ω",showAnswers?fmt(s.i2)+" A":"");
    svg+=wire([[404,70],[470,70],[470,110]]);
    svg+=wire([[404,150],[470,150],[470,110]]);
    svg+=wire([[470,110],[640,110],[640,300],[140,300]]);
    svg+=battery(390,300);
    if(showAnswers){
      svg+=iArrow(190,110,1,0,(s.i1+s.i2)/1.6,"I = "+fmt(s.i1+s.i2)+" A");
    }
    svg+=info(390,360,"parallel: both branches feel the full "+EMF+" V; current splits inversely with R");
  }else{
    svg+=wire([[140,300],[140,110],[230,110]]);
    svg+=resistor(230,110,true,"R₁ = "+v.r1+" Ω",showAnswers?fmt(s.v1)+" V":"");
    svg+=wire([[294,110],[380,110]]);
    svg+=wire([[380,110],[380,150],[420,150]]);
    svg+=wire([[380,110],[380,70],[420,70]]);
    svg+=resistor(420,70,true,"R₂ = "+v.r2+" Ω",showAnswers?fmt(s.i2)+" A":"");
    svg+=resistor(420,150,true,"R₃ = "+v.r3+" Ω",showAnswers?fmt(s.i3)+" A":"");
    svg+=wire([[484,70],[550,70],[550,110]]);
    svg+=wire([[484,150],[550,150],[550,110]]);
    svg+=wire([[550,110],[660,110],[660,300],[140,300]]);
    svg+=battery(400,300);
    if(showAnswers)svg+=iArrow(170,110,1,0,s.i1/1.2,"I = "+fmt(s.i1)+" A");
    svg+=info(400,360,"combination: reduce the parallel pair first, then add the series resistor");
  }
  return svg+"</svg>";
}

// ---- quiz ----
const CONCEPT_ITEMS=[
  {q:"Resistors connected in series always share the same...",ans:"current",opts:["current","potential difference","power","resistance"],hint:"One path: the same charge flows through each in turn, so the current is identical. The p.d. is what divides between them."},
  {q:"Resistors connected in parallel always share the same...",ans:"potential difference",opts:["potential difference","current","power","charge per second"],hint:"Both ends of each branch sit at the same two potentials, so the p.d. is identical. The current is what divides between them."},
  {q:"Adding another resistor in parallel with an existing one makes the combined resistance...",ans:"smaller",opts:["smaller","larger","unchanged","zero"],hint:"A new branch is a new path for current: more total current for the same p.d. means less resistance. The combined value is always below the smallest branch."},
  {q:"Two equal resistors R in parallel have combined resistance...",ans:"R/2",opts:["R/2","2R","R","R/4"],hint:"Equal branches carry equal currents, doubling the total current: half the resistance. For n equal resistors in parallel it is R/n."}
];
function generateQuiz(){
  const roll=Math.random();
  if(roll<0.4){
    // equivalent resistance, numeric
    const f=pick(["series","parallel","combo"]);
    const v={r1:pick(RVALS),r2:pick(RVALS),r3:pick(RVALS)};
    const s=solve(f,v);
    const wrongs=f==="series"?[v.r1*v.r2/(v.r1+v.r2),Math.abs(v.r1-v.r2)||v.r1,(v.r1+v.r2)/2]
      :f==="parallel"?[v.r1+v.r2,(v.r1+v.r2)/2,Math.min(v.r1,v.r2)]
      :[v.r1+v.r2+v.r3,v.r1+(v.r2+v.r3)/2,v.r2*v.r3/(v.r2+v.r3)];
    const opts=[...new Set([s.req,...wrongs].map(x=>fmt(x)))].slice(0,4).map(x=>x+" Ω");
    quizQ={type:"req",fam:f,vals:v,answer:fmt(s.req)+" Ω",options:shuffle(opts),
      prompt:"What is the equivalent resistance of this network?",
      hint:f==="series"?"Series: just add. R = "+v.r1+" + "+v.r2+" = "+fmt(s.req)+" Ω."
      :f==="parallel"?"Parallel: product over sum, "+v.r1+"×"+v.r2+"/("+v.r1+"+"+v.r2+") = "+fmt(s.req)+" Ω. Adding them is the series formula in the wrong place."
      :"Reduce the parallel pair first: "+v.r2+"∥"+v.r3+" = "+fmt(v.r2*v.r3/(v.r2+v.r3))+" Ω, then add "+v.r1+" in series: "+fmt(s.req)+" Ω."};
  }else if(roll<0.75){
    // ratio question
    const parallel=Math.random()<0.5;
    let r1,r2;
    do{r1=pick(RVALS);r2=pick(RVALS);}while(r1===r2);
    const v={r1,r2};
    const correct=parallel?fmt(r2/r1):fmt(r1/r2);
    const inverted=parallel?fmt(r1/r2):fmt(r2/r1);
    const opts=[...new Set([correct,inverted,"1",fmt((r1/r2)*(r1/r2))])].slice(0,4);
    quizQ={type:"ratio",fam:parallel?"parallel":"series",vals:v,answer:correct,options:shuffle(opts),
      prompt:parallel?"R₁ and R₂ are in parallel. What is the ratio I₁/I₂ of the currents through them?"
      :"R₁ and R₂ are in series. What is the ratio V₁/V₂ of the potential differences across them?",
      hint:parallel?"Parallel means the same V, so I = V/R and I₁/I₂ = R₂/R₁ = "+correct+". The ratio inverts: the smaller resistor takes the larger current."
      :"Series means the same I, so V = IR and V₁/V₂ = R₁/R₂ = "+correct+". Direct ratio here; it is the parallel current ratio that inverts."};
  }else{
    const item=pick(CONCEPT_ITEMS);
    quizQ={type:"concept",prompt:item.q,answer:item.ans,options:shuffle(item.opts.slice()),hint:item.hint};
  }
  quizGuess=null;quizResult=null;
}
function selectGuess(k){if(!quizResult){quizGuess=k;render();}}
function checkAnswer(){
  if(!quizGuess||!quizQ)return;
  const ok=quizGuess===quizQ.answer;
  quizResult=ok?"correct":"incorrect";
  score.total++;if(ok)score.correct++;
  render();
}
function nextQuestion(){generateQuiz();render();}

// ---- ratio game tab ----
function setRatioR2(v){ratioR2=v;render();}
function renderRatioScene(){
  const r1=20,r2=ratioR2;
  const i1=EMF/r1,i2=EMF/r2;
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#101008;border-radius:12px;display:block">`;
  svg+=wire([[140,300],[140,110],[300,110],[300,70],[340,70]]);
  svg+=wire([[300,110],[300,150],[340,150]]);
  svg+=resistor(340,70,true,"R₁ = "+r1+" Ω",fmt(i1)+" A");
  svg+=resistor(340,150,true,"R₂ = "+r2+" Ω",fmt(i2)+" A");
  svg+=wire([[404,70],[470,70],[470,110],[640,110],[640,300],[140,300]]);
  svg+=wire([[404,150],[470,150],[470,110]]);
  svg+=battery(390,300);
  // current bars
  const bx=120,bw=560;
  svg+=`<text x="${bx}" y="352" fill="#b3b389" font-size="12">current bars (same p.d. across both):</text>`;
  svg+=`<rect x="${bx}" y="362" width="${i1/1.2*bw/2}" height="14" rx="3" fill="#fb923c"/>`;
  svg+=`<text x="${bx+i1/1.2*bw/2+8}" y="374" fill="#fb923c" font-size="11">I₁ = ${fmt(i1)} A</text>`;
  svg+=`<rect x="${bx}" y="384" width="${i2/1.2*bw/2}" height="14" rx="3" fill="#facc15"/>`;
  svg+=`<text x="${bx+i2/1.2*bw/2+8}" y="396" fill="#facc15" font-size="11">I₂ = ${fmt(i2)} A</text>`;
  return svg+"</svg>";
}

// ---- main render ----
function render(){
  const svgEl=document.getElementById("svgContainer");
  const ctrlEl=document.getElementById("controlsContainer");
  const pedEl=document.getElementById("pedagogy");

  if(mode==="explore"){
    const s=solve(fam,vals);
    svgEl.innerHTML=renderCircuit(fam,vals,true);
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="section-desc">Three families cover nearly every Paper 1 network. All values shown are computed from the ${EMF} V supply; press "new values" and predict every number before reading it.</p>
        <div class="label">Family</div>
        <div class="btn-group" style="margin-bottom:8px">
          <button class="dir-btn${fam==="series"?' active':''}" onclick="setFam('series')">series</button>
          <button class="dir-btn${fam==="parallel"?' active':''}" onclick="setFam('parallel')">parallel</button>
          <button class="dir-btn${fam==="combo"?' active':''}" onclick="setFam('combo')">series + parallel</button>
        </div>
        <div class="btn-group"><button class="dir-btn" onclick="newVals()">🎲 new values</button></div>
        <div class="readout">
          <span class="eq"><span class="m">R_eq =</span> <strong>${fmt(s.req)} Ω</strong></span>
          <span class="eq"><span class="m">Battery current I = ${EMF}/${fmt(s.req)} =</span> <strong>${fmt(EMF/s.req)} A</strong></span>
          ${fam==="combo"?`<span class="eq"><span class="m">Parallel pair first: ${vals.r2}∥${vals.r3} =</span> <strong>${fmt(vals.r2*vals.r3/(vals.r2+vals.r3))} Ω</strong></span>`:""}
        </div>
      </div>`;
    pedEl.innerHTML=`<strong>The two sentences that solve every network:</strong> series elements share the current, and split the p.d. in proportion to resistance; parallel elements share the p.d., and split the current in inverse proportion to resistance. Every mistake on this topic is one of those two sentences applied to the wrong geometry.`;

  } else if(mode==="quiz"){
    if(!quizQ)generateQuiz();
    svgEl.innerHTML=quizQ.type==="concept"?renderCircuit("combo",vals,false)
      :renderCircuit(quizQ.fam,quizQ.type==="ratio"?{r1:quizQ.vals.r1,r2:quizQ.vals.r2,r3:30}:quizQ.vals,false);
    let optsHtml=quizQ.options.map(k=>{
      let cls="opt-btn";
      if(quizResult)cls+=" locked";
      if(quizGuess===k&&!quizResult)cls+=" selected";
      if(quizGuess===k&&quizResult==="correct")cls+=" correct";
      if(quizGuess===k&&quizResult==="incorrect")cls+=" wrong";
      return`<button class="${cls}" onclick="selectGuess('${k}')">${k}</button>`;
    }).join("");
    let resultHtml="";
    if(quizResult){
      if(quizResult==="correct")resultHtml=`<div class="result-text correct">Correct!</div>`;
      else resultHtml=`<div class="result-text wrong">Not quite — the answer is ${quizQ.answer}</div><p class="hint-text">${quizQ.hint}</p>`;
      resultHtml+=`<div class="next-row">
        <button class="check-btn" onclick="nextQuestion()">Next Question</button>
        <span class="score">Score: <strong>${score.correct}</strong> / ${score.total}</span>
      </div>`;
    }
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="quiz-prompt">${quizQ.prompt}</p>
        <div class="quiz-opts">${optsHtml}</div>
        ${!quizResult?`<button class="check-btn" ${!quizGuess?'disabled':''} onclick="checkAnswer()">Check Answer</button>`:''}
        ${resultHtml}
      </div>`;
    pedEl.innerHTML=`<strong>Traps in play:</strong> using the series formula on a parallel pair (or vice versa), and the inverted ratio: in parallel the currents divide as R₂:R₁, not R₁:R₂. When in doubt, sanity-check the direction: the smaller resistor always takes the bigger current, and a parallel combination is always smaller than its smallest member.`;

  } else {
    svgEl.innerHTML=renderRatioScene();
    ctrlEl.innerHTML=`
      <div class="controls">
        <div class="section-title">Same p.d., inverse currents</div>
        <p class="section-desc">R₁ is fixed at 20 Ω. Step R₂ through the values and watch the current bars: the ratio I₁/I₂ always equals R₂/R₁, the inverse of what intuition first offers.</p>
        <div class="label">R₂</div>
        <div class="btn-group">${[10,20,40,60].map(v=>`<button class="dir-btn${v===ratioR2?' active':''}" onclick="setRatioR2(${v})">${v} Ω</button>`).join("")}</div>
        <div class="readout">
          <span class="eq"><span class="m">I₁/I₂ = R₂/R₁ = ${ratioR2}/20 =</span> <strong>${fmt(ratioR2/20)}</strong></span>
          <span class="eq"><span class="m">Combined resistance = ${fmt(20*ratioR2/(20+ratioR2))} Ω, below both branches</span></span>
        </div>
      </div>`;
    pedEl.innerHTML=`<strong>Why the inversion:</strong> in parallel both resistors feel the same push (V), so the branch with less opposition carries more current: I = V/R. Writing I₁/I₂ = R₁/R₂ feels symmetric and is exactly wrong; the banked Paper 1 data shows this inverted ratio is one of the commonest circuit distractors.`;
  }
}

render();
</script>
</body>
