<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lenz's Law and Electromagnetic Induction</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#1a140e;--panel:#282014;--border:#4a3a24;--text:#f0e7da;--muted:#bda98c;--bright:#fdf8f0;--copper:#e58e3a;--bfield:#60a5fa;--current:#facc15;--force:#f43f5e;--correct:#34d399;--incorrect:#f87171;--accent:#d97706;--accentBg:#452c0b;--accentTxt:#fbbf24}
  body{font-family:'IBM Plex Sans','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:22px 18px;min-height:100vh}
  .container{max-width:1150px;margin:0 auto}
  .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.05em;padding:3px 10px;border-radius:6px;background:var(--accentBg);color:var(--accentTxt);margin-bottom:8px}
  h2{font-size:22px;font-weight:700;color:var(--bright);margin-bottom:4px}
  .subtitle{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .subtitle strong,.subtitle em{color:var(--text)}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .tab.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .tab:hover{border-color:#6b5433}
  .main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
  .controls{background:var(--panel);border-radius:12px;padding:16px;border:1px solid var(--border)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
  .btn-group{display:flex;flex-wrap:wrap;gap:4px}
  .dir-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .dir-btn.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .dir-btn:hover{border-color:#6b5433}
  .quiz-info{font-size:14px;margin-bottom:6px}
  .quiz-prompt{font-size:14px;font-weight:600;margin-bottom:10px}
  .quiz-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .opt-btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;min-width:110px;text-align:center;transition:all .15s}
  .opt-btn.selected{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .opt-btn.correct{border-color:var(--correct);background:#064e3b;color:var(--correct);font-weight:700}
  .opt-btn.wrong{border-color:var(--incorrect);background:#7f1d1d;color:var(--incorrect);font-weight:700}
  .opt-btn.locked{cursor:default}
  .check-btn{padding:8px 24px;border-radius:8px;border:none;background:var(--accent);color:#2a1703;font-weight:700;font-size:14px;cursor:pointer}
  .check-btn:disabled{background:#4a3a24;color:#8a7355;cursor:default}
  .result-text{font-size:15px;font-weight:700;margin-bottom:6px}
  .result-text.correct{color:var(--correct)}
  .result-text.wrong{color:var(--incorrect)}
  .hint-text{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .next-row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .score{font-size:13px;color:var(--muted)}
  .score strong{color:var(--correct)}
  .pedagogy{margin-top:16px;padding:14px 16px;background:#221a10;border-radius:10px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.65}
  .pedagogy strong{color:var(--bright)}
  .section-title{font-size:15px;font-weight:700;color:var(--bright);margin-bottom:8px}
  .section-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .slider-wrap{margin-top:8px}
  .slider-wrap input[type=range]{width:100%;margin-top:6px;accent-color:var(--accent)}
  .readout{margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.8}
  .readout .m{color:var(--muted)}
  .eq{display:block;white-space:nowrap}
  .step{display:block;margin-bottom:2px}
  .step .n{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--accentBg);color:var(--accentTxt);font-size:11px;font-weight:700;text-align:center;line-height:18px;margin-right:7px}
  svg{display:block;border-radius:12px;width:100%;height:auto}
</style>
</head>
<body>
<div class="container">
  <span class="chip">THEME D · FIELDS · D4 INDUCTION</span>
  <h2>Lenz's Law and Electromagnetic Induction</h2>
  <p class="subtitle">ε = −N ΔΦ/Δt &nbsp;|&nbsp; Φ = BA cos θ &nbsp;|&nbsp; The induced current always opposes the <em>change</em> that made it</p>

  <div class="tabs">
    <button class="tab active" id="tabExplore" onclick="switchMode('explore')">Magnet &amp; Coil</button>
    <button class="tab" id="tabQuiz" onclick="switchMode('quiz')">Quiz Me</button>
    <button class="tab" id="tabFlux" onclick="switchMode('flux')">Flux &amp; emf</button>
  </div>

  <div class="main">
    <div id="svgContainer"></div>
    <div id="controlsContainer"></div>
  </div>
  <div class="pedagogy" id="pedagogy"></div>
</div>

<script>
// ============================================================
// Direction convention: the observer stands at the magnet,
// looking along the axis toward the coil.
// s = +1 if the facing pole is N (flux from observer toward coil)
// c = +1 approaching, -1 receding, 0 still
// Induced current is ANTICLOCKWISE (seen by that observer) iff s*c > 0.
// Anticlockwise seen from the magnet <=> near coil face acts as N.
// Loop in a field region (viewed normally): s = +1 B into page,
// c = +1 flux increasing; anticlockwise iff s*c > 0.
// ============================================================

const W=800,H=420;

let mode="explore";
let pole="N",motion="in";
let animT=0,lastTs=null,rafId=null;
let quizQ=null,quizGuess=null,quizResult=null;
let score={correct:0,total:0};
let fluxX=100; // loop left edge position in the flux tab

function senseOf(s,c){ // returns "anticlockwise" | "clockwise" | "none"
  if(c===0)return"none";
  return s*c>0?"anticlockwise":"clockwise";
}
function magnetSense(){
  const s=pole==="N"?1:-1;
  const c=motion==="in"?1:motion==="out"?-1:0;
  return senseOf(s,c);
}

function switchMode(m){
  mode=m;
  document.getElementById("tabExplore").className="tab"+(m==="explore"?" active":"");
  document.getElementById("tabQuiz").className="tab"+(m==="quiz"?" active":"");
  document.getElementById("tabFlux").className="tab"+(m==="flux"?" active":"");
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  lastTs=null;
  if(m==="quiz"){score={correct:0,total:0};generateQuiz();}
  render();
  if(m==="explore")rafId=requestAnimationFrame(tick);
}
function setPole(p){pole=p;render();}
function setMotion(m){motion=m;render();}

function tick(ts){
  if(mode!=="explore"){rafId=null;return;}
  if(lastTs===null)lastTs=ts;
  const dt=Math.min(0.05,(ts-lastTs)/1000);
  lastTs=ts;
  animT=(animT+dt)%2.0;
  document.getElementById("svgContainer").innerHTML=renderExploreScene(animT);
  rafId=requestAnimationFrame(tick);
}

// ---- svg helpers ----
function arrow(x1,y1,x2,y2,color,sw,op){
  sw=sw||2.5;op=op===undefined?1:op;
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
  if(len<2)return"";
  const ux=dx/len,uy=dy/len,h=Math.min(12,len*0.45),hw=h*0.45;
  const bx=x2-ux*h,by=y2-uy*h;
  return`<g opacity="${op}"><line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${color}" stroke-width="${sw}"/><polygon points="${x2},${y2} ${bx-uy*hw},${by+ux*hw} ${bx+uy*hw},${by-ux*hw}" fill="${color}"/></g>`;
}
function crossSym(cx,cy,r,color,op){
  op=op===undefined?1:op;const d=r*0.55;
  return`<g opacity="${op}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="2"/><line x1="${cx-d}" y1="${cy-d}" x2="${cx+d}" y2="${cy+d}" stroke="${color}" stroke-width="2"/><line x1="${cx+d}" y1="${cy-d}" x2="${cx-d}" y2="${cy+d}" stroke="${color}" stroke-width="2"/></g>`;
}
function dotSym(cx,cy,r,color,op){
  op=op===undefined?1:op;
  return`<g opacity="${op}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${r*0.22}" fill="${color}"/></g>`;
}
function magnetGlyph(x,y,wd,ht,facing){ // facing: pole on the RIGHT end (toward coil)
  const half=wd/2;
  const nFirst=facing==="N"?false:true; // right half is the facing pole
  let s=`<rect x="${x}" y="${y}" width="${half}" height="${ht}" rx="3" fill="${nFirst?'#b91c1c':'#1d4ed8'}"/>`;
  s+=`<rect x="${x+half}" y="${y}" width="${half}" height="${ht}" rx="3" fill="${nFirst?'#1d4ed8':'#b91c1c'}"/>`;
  s+=`<text x="${x+half/2}" y="${y+ht/2+5}" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">${facing==="N"?"S":"N"}</text>`;
  s+=`<text x="${x+wd-half/2}" y="${y+ht/2+5}" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">${facing==="N"?"N":"S"}</text>`;
  return s;
}
function circArrows(cx,cy,r,sense,color){
  // circular arrows viewed face-on; sense: "anticlockwise"|"clockwise"|"none"
  if(sense==="none")return`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#6b5433" stroke-width="2.5" stroke-dasharray="5,5"/><text x="${cx}" y="${cy+4}" fill="#8a7355" font-size="11" text-anchor="middle">no current</text>`;
  let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
  // arrowheads at 4 points; anticlockwise on screen = counter-clockwise (standard orientation, y down: visual anticlockwise)
  for(let k=0;k<4;k++){
    const a=k*Math.PI/2+Math.PI/4;
    const px=cx+r*Math.cos(a),py=cy+r*Math.sin(a);
    // tangent direction: anticlockwise visually means decreasing screen angle
    const tsign=sense==="anticlockwise"?-1:1;
    const tx=-Math.sin(a)*tsign,ty=Math.cos(a)*tsign;
    s+=`<polygon points="${px+tx*9},${py+ty*9} ${px-ty*4.5-tx*3},${py+tx*4.5-ty*3} ${px+ty*4.5-tx*3},${py-tx*4.5-ty*3}" fill="${color}"/>`;
  }
  return s;
}

// ---- explore scene ----
function renderExploreScene(t){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#140f08;border-radius:12px;display:block">`;
  // axis
  svg+=`<line x1="40" y1="200" x2="620" y2="200" stroke="#4a3a24" stroke-width="1" stroke-dasharray="4,5" opacity="0.6"/>`;
  // magnet position
  let prog=0;
  if(motion==="in")prog=Math.min(1,(t%2)/1.2);
  else if(motion==="out")prog=1-Math.min(1,(t%2)/1.2);
  else prog=0.55;
  const magX=90+prog*150;
  svg+=magnetGlyph(magX-130,178,130,44,pole);
  // motion arrow on the magnet
  if(motion!=="still"){
    const mx=magX-65;
    svg+=arrow(mx-(motion==="in"?40:-40)+0,150,mx+(motion==="in"?40:-40),150,"#f0e7da",3);
    svg+=`<text x="${mx}" y="136" fill="#f0e7da" font-size="12" font-weight="600" text-anchor="middle">${motion==="in"?"pushed toward coil":"pulled away"}</text>`;
  }else{
    svg+=`<text x="${magX-65}" y="146" fill="#8a7355" font-size="12" font-weight="600" text-anchor="middle">held still</text>`;
  }
  // coil: five turns, side view
  const sense=magnetSense();
  for(let i=0;i<5;i++){
    const cx=430+i*28;
    svg+=`<ellipse cx="${cx}" cy="200" rx="12" ry="58" fill="none" stroke="#e58e3a" stroke-width="4" opacity="0.9"/>`;
    if(sense!=="none"){
      // front edge current marker: anticlockwise from magnet (observer at left, axis toward +x):
      // anticlockwise seen from the left means current up the front (near-viewer) side? Side view: show dot/cross at top of each turn.
      // From the left-observer's anticlockwise: at the TOP of the coil the current flows toward the viewer of our side view for anticlockwise.
      const topOut=sense==="anticlockwise";
      svg+=topOut?dotSym(cx,132,7,"#facc15"):crossSym(cx,132,7,"#facc15");
      svg+=topOut?crossSym(cx,268,7,"#facc15"):dotSym(cx,268,7,"#facc15");
    }
  }
  svg+=`<text x="486" y="300" fill="#e58e3a" font-size="12" font-weight="600" text-anchor="middle">coil (5 turns)</text>`;
  if(sense!=="none"){
    svg+=`<text x="486" y="112" fill="#facc15" font-size="11" text-anchor="middle">current markers on each turn (top and bottom)</text>`;
    // near-face pole label
    const face=sense==="anticlockwise"?"N":"S";
    svg+=`<text x="410" y="330" fill="#f0e7da" font-size="13" font-weight="700" text-anchor="middle">near face acts as ${face}</text>`;
    svg+=`<text x="410" y="348" fill="#bda98c" font-size="11" text-anchor="middle">${motion==="in"?"repels the incoming magnet":"attracts the departing magnet"}</text>`;
  }else{
    svg+=`<text x="410" y="330" fill="#8a7355" font-size="13" text-anchor="middle">no flux change, no induced current</text>`;
  }
  // face-on inset: view from the magnet
  svg+=`<rect x="648" y="60" width="130" height="290" rx="10" fill="#1a140e" stroke="#4a3a24"/>`;
  svg+=`<text x="713" y="84" fill="#bda98c" font-size="11" font-weight="600" text-anchor="middle">view from the</text>`;
  svg+=`<text x="713" y="98" fill="#bda98c" font-size="11" font-weight="600" text-anchor="middle">magnet's side</text>`;
  svg+=circArrows(713,190,46,sense,"#facc15");
  if(sense!=="none")svg+=`<text x="713" y="270" fill="#facc15" font-size="12" font-weight="700" text-anchor="middle">${sense}</text>`;
  svg+=`</svg>`;
  return svg;
}
function exploreReadout(){
  const sense=magnetSense();
  if(sense==="none")return`
    <span class="step"><span class="n">1</span>The magnet is still: the flux through the coil is not changing.</span>
    <span class="step"><span class="n">2</span>ε = −N ΔΦ/Δt = 0. No change, no emf, no current.</span>
    <span class="step"><span class="n">3</span>A big flux on its own induces nothing: only its <strong>change</strong> does.</span>`;
  const s=pole==="N"?1:-1;
  const growing=motion==="in";
  const fluxDir=s>0?"from the magnet toward the coil":"from the coil toward the magnet";
  const face=sense==="anticlockwise"?"N":"S";
  return`
    <span class="step"><span class="n">1</span>Flux through the coil points ${fluxDir} and is <strong>${growing?"increasing":"decreasing"}</strong>.</span>
    <span class="step"><span class="n">2</span>Lenz: the induced current opposes that <strong>change</strong>.</span>
    <span class="step"><span class="n">3</span>So the coil's near face becomes <strong>${face}</strong>: it ${growing?"repels the approaching":"attracts the retreating"} magnet.</span>
    <span class="step"><span class="n">4</span>Right-hand grip: seen from the magnet, the current flows <strong style="color:var(--current)">${sense}</strong>.</span>`;
}

// ---- quiz ----
function generateQuiz(){
  if(Math.random()<0.55){
    const p=Math.random()<0.5?"N":"S";
    const roll=Math.random();
    const mo=roll<0.4?"in":roll<0.8?"out":"still";
    const s=p==="N"?1:-1,c=mo==="in"?1:mo==="out"?-1:0;
    const ans=senseOf(s,c)==="none"?"no current":senseOf(s,c);
    quizQ={kind:"magnet",pole:p,motion:mo,answer:ans,
      options:["anticlockwise","clockwise","no current"],
      prompt:"Viewed from the magnet's side, which way does the induced current flow in the coil?",
      hint:mo==="still"?"The magnet is not moving, so the flux is constant: no change, no induced current, however strong the field is."
      :`Chain it: ${p} pole ${mo==="in"?"approaching":"receding"} → flux ${p==="N"?"toward the coil":"toward the magnet"} ${mo==="in"?"increasing":"decreasing"} → oppose the change → near face ${senseOf(s,c)==="anticlockwise"?"N":"S"} → ${senseOf(s,c)} seen from the magnet.`};
  }else{
    const bIn=Math.random()<0.5;
    const roll=Math.random();
    const st=roll<0.4?"entering":roll<0.8?"leaving":"fully inside";
    const s=bIn?1:-1,c=st==="entering"?1:st==="leaving"?-1:0;
    const ans=senseOf(s,c)==="none"?"no current":senseOf(s,c);
    quizQ={kind:"loop",bIn,state:st,answer:ans,
      options:["anticlockwise","clockwise","no current"],
      prompt:"The loop moves to the right at constant speed. Which way does the induced current flow?",
      hint:st==="fully inside"?"Inside the region the flux through the loop is large but constant: ΔΦ = 0, so no current. Flux itself induces nothing; only changing flux does."
      :`Flux ${bIn?"into":"out of"} the page is ${st==="entering"?"increasing":"decreasing"} → the induced current makes flux ${(s*c>0)?(bIn?"out of":"into"):(bIn?"into":"out of")} the page inside the loop → ${senseOf(s,c)}.`};
  }
  quizGuess=null;quizResult=null;
}
function selectGuess(k){if(!quizResult){quizGuess=k;render();}}
function checkAnswer(){
  if(!quizGuess||!quizQ)return;
  const ok=quizGuess===quizQ.answer;
  quizResult=ok?"correct":"incorrect";
  score.total++;if(ok)score.correct++;
  render();
}
function nextQuestion(){generateQuiz();render();}

function renderQuizScene(){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#140f08;border-radius:12px;display:block">`;
  if(quizQ.kind==="magnet"){
    svg+=`<line x1="60" y1="210" x2="560" y2="210" stroke="#4a3a24" stroke-width="1" stroke-dasharray="4,5" opacity="0.6"/>`;
    svg+=magnetGlyph(100,188,130,44,quizQ.pole);
    if(quizQ.motion!=="still"){
      svg+=arrow(165-(quizQ.motion==="in"?45:-45),158,165+(quizQ.motion==="in"?45:-45),158,"#f0e7da",3);
      svg+=`<text x="165" y="142" fill="#f0e7da" font-size="12" font-weight="600" text-anchor="middle">${quizQ.motion==="in"?"moving toward coil":"moving away from coil"}</text>`;
    }else{
      svg+=`<text x="165" y="150" fill="#8a7355" font-size="12" font-weight="600" text-anchor="middle">held still</text>`;
    }
    for(let i=0;i<5;i++){
      svg+=`<ellipse cx="${400+i*28}" cy="210" rx="12" ry="58" fill="none" stroke="#e58e3a" stroke-width="4" opacity="0.9"/>`;
    }
    svg+=`<text x="456" y="300" fill="#e58e3a" font-size="12" font-weight="600" text-anchor="middle">coil</text>`;
    if(quizResult){
      const sense=quizQ.answer==="no current"?"none":quizQ.answer;
      svg+=`<rect x="612" y="90" width="150" height="240" rx="10" fill="#1a140e" stroke="#4a3a24"/>`;
      svg+=`<text x="687" y="114" fill="#bda98c" font-size="11" font-weight="600" text-anchor="middle">from the magnet's side</text>`;
      svg+=circArrows(687,210,48,sense,"#facc15");
      if(sense!=="none")svg+=`<text x="687" y="292" fill="#facc15" font-size="12" font-weight="700" text-anchor="middle">${sense}</text>`;
    }
  }else{
    // field region with loop
    const rx0=290,rx1=560,ry0=80,ry1=330;
    svg+=`<rect x="${rx0}" y="${ry0}" width="${rx1-rx0}" height="${ry1-ry0}" fill="#1a2436" opacity="0.7"/>`;
    for(let i=0;i<5;i++)for(let j=0;j<5;j++){
      const px=rx0+27+i*54,py=ry0+25+j*50;
      svg+=quizQ.bIn?crossSym(px,py,8,"#60a5fa",0.5):dotSym(px,py,8,"#60a5fa",0.5);
    }
    svg+=`<text x="${(rx0+rx1)/2}" y="${ry0-12}" fill="#60a5fa" font-size="12" font-weight="600" text-anchor="middle">uniform B ${quizQ.bIn?"into":"out of"} the page</text>`;
    const lw=140,lh=110;
    const lx=quizQ.state==="entering"?rx0-lw*0.55:quizQ.state==="leaving"?rx1-lw*0.45:(rx0+rx1)/2-lw/2;
    svg+=`<rect x="${lx}" y="${205-lh/2}" width="${lw}" height="${lh}" rx="4" fill="none" stroke="#e58e3a" stroke-width="4"/>`;
    svg+=arrow(lx+lw+16,205,lx+lw+70,205,"#f0e7da",3);
    svg+=`<text x="${lx+lw+43}" y="${188}" fill="#f0e7da" font-size="12" font-weight="600" text-anchor="middle">v</text>`;
    if(quizResult&&quizQ.answer!=="no current"){
      const sense=quizQ.answer;
      // arrows on the loop edges
      const acw=sense==="anticlockwise";
      svg+=arrow(lx+lw*0.3,205-lh/2,lx+lw*(acw?0.15:0.85)+(acw?0:0),205-lh/2,"#facc15",3); // top edge
      svg+=arrow(lx+lw*0.7,205+lh/2,lx+lw*(acw?0.85:0.15),205+lh/2,"#facc15",3); // bottom edge
      svg+=`<text x="${lx+lw/2}" y="${205+lh/2+26}" fill="#facc15" font-size="12" font-weight="700" text-anchor="middle">${sense}</text>`;
    }
  }
  svg+=`</svg>`;
  return svg;
}

// ---- flux & emf tab ----
const FX0=60,FX1=740;             // graph x range in px
const REG0=260,REG1=420,LOOPW=80; // scene coordinates (same units as slider)
function overlapOf(x){return Math.max(0,Math.min(x+LOOPW,REG1)-Math.max(x,REG0));}
function emfOf(x){ // -dPhi/dx (constant speed): entering negative, leaving positive
  const d=1;
  return-(overlapOf(x+d)-overlapOf(x-d))/(2*d);
}
function fluxSense(x){
  const e=emfOf(x);
  if(Math.abs(e)<1e-9)return"none";
  return e<0?"anticlockwise":"clockwise"; // B into page: entering -> anticlockwise
}
function renderFluxScene(x){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#140f08;border-radius:12px;display:block">`;
  // scene strip on top
  const sy0=28,sy1=138;
  const sx=v=>FX0+(v-60)/(480-60)*(FX1-FX0);
  svg+=`<rect x="${sx(REG0)}" y="${sy0}" width="${sx(REG1)-sx(REG0)}" height="${sy1-sy0}" fill="#1a2436" opacity="0.7"/>`;
  for(let i=0;i<4;i++)for(let j=0;j<2;j++){
    svg+=crossSym(sx(REG0)+30+i*62,sy0+30+j*50,7,"#60a5fa",0.5);
  }
  svg+=`<text x="${(sx(REG0)+sx(REG1))/2}" y="${sy0-8}" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle">B into page</text>`;
  svg+=`<rect x="${sx(x)}" y="${sy0+18}" width="${sx(x+LOOPW)-sx(x)}" height="${sy1-sy0-36}" rx="3" fill="none" stroke="#e58e3a" stroke-width="3.5"/>`;
  const sense=fluxSense(x);
  svg+=`<text x="${sx(x+LOOPW/2)}" y="${sy1+18}" fill="${sense==="none"?"#8a7355":"#facc15"}" font-size="11" font-weight="700" text-anchor="middle">${sense==="none"?"no current":"induced: "+sense}</text>`;
  // graphs
  function graph(gy,gh,fn,label,color){
    let s=`<line x1="${FX0}" y1="${gy+gh}" x2="${FX1}" y2="${gy+gh}" stroke="#4a3a24" stroke-width="1"/>`;
    s+=`<text x="${FX0-6}" y="${gy+12}" fill="#bda98c" font-size="11" text-anchor="end">${label}</text>`;
    let path="";
    let maxV=0;
    for(let v=60;v<=480;v+=2)maxV=Math.max(maxV,Math.abs(fn(v)));
    for(let v=60;v<=480;v+=2){
      const px=sx(v),py=gy+gh-fn(v)/maxV*(gh-8);
      path+=(v===60?"M":"L")+px.toFixed(1)+","+py.toFixed(1);
    }
    s+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
    const mx=sx(x),my=gy+gh-fn(x)/maxV*(gh-8);
    s+=`<circle cx="${mx}" cy="${my}" r="5.5" fill="${color}"/>`;
    s+=`<line x1="${mx}" y1="${gy+gh}" x2="${mx}" y2="${my}" stroke="${color}" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>`;
    return s;
  }
  // flux graph (always >= 0); emf graph needs a centred axis
  svg+=graph(180,90,overlapOf,"Φ","#60a5fa");
  // emf graph centred
  const gy=300,gh=100,mid=gy+gh/2;
  svg+=`<line x1="${FX0}" y1="${mid}" x2="${FX1}" y2="${mid}" stroke="#4a3a24" stroke-width="1"/>`;
  svg+=`<text x="${FX0-6}" y="${gy+12}" fill="#bda98c" font-size="11" text-anchor="end">ε</text>`;
  let maxE=0;
  for(let v=60;v<=480;v+=2)maxE=Math.max(maxE,Math.abs(emfOf(v)));
  let path="";
  for(let v=60;v<=480;v+=2){
    const px=sx(v),py=mid-emfOf(v)/maxE*(gh/2-6);
    path+=(v===60?"M":"L")+px.toFixed(1)+","+py.toFixed(1);
  }
  svg+=`<path d="${path}" fill="none" stroke="#facc15" stroke-width="2.5"/>`;
  const mx=sx(x),my=mid-emfOf(x)/maxE*(gh/2-6);
  svg+=`<circle cx="${mx}" cy="${my}" r="5.5" fill="#facc15"/>`;
  svg+=`<text x="${FX1}" y="${mid+16}" fill="#8a7355" font-size="10" text-anchor="end">loop position →</text>`;
  svg+=`</svg>`;
  return svg;
}
function fluxReadoutHtml(x){
  const ov=overlapOf(x),e=emfOf(x);
  const state=ov===0?"outside the field":ov===LOOPW?"fully inside":emfOf(x)<0?"entering":"leaving";
  return`<span class="eq"><span class="m">Loop is</span> <strong>${state}</strong><span class="m">; overlap = ${Math.round(ov/LOOPW*100)}% of the loop area</span></span>
  <span class="eq"><span class="m">Φ = BA<sub>overlap</sub>:</span> <strong>${ov===0?"zero":ov===LOOPW?"maximum, constant":"changing"}</strong></span>
  <span class="eq"><span class="m">ε = −ΔΦ/Δt:</span> <strong>${Math.abs(e)<1e-9?"zero":"nonzero, "+(e<0?"one sense":"opposite sense")}</strong></span>
  <span class="eq"><span class="m">Note where Φ is biggest: ε is zero exactly there.</span></span>`;
}
function setFluxX(v){
  fluxX=Number(v);
  document.getElementById("svgContainer").innerHTML=renderFluxScene(fluxX);
  document.getElementById("fluxReadout").innerHTML=fluxReadoutHtml(fluxX);
}

// ---- main render ----
function render(){
  const svgEl=document.getElementById("svgContainer");
  const ctrlEl=document.getElementById("controlsContainer");
  const pedEl=document.getElementById("pedagogy");

  if(mode==="explore"){
    svgEl.innerHTML=renderExploreScene(animT);
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="section-desc">Choose the pole facing the coil and what the magnet is doing. Follow the four-step chain in the readout: it is the same chain for every induction question you will ever meet.</p>
        <div class="grid2">
          <div>
            <label class="label">Pole facing the coil</label>
            <div class="btn-group">
              <button class="dir-btn${pole==="N"?' active':''}" onclick="setPole('N')">N pole</button>
              <button class="dir-btn${pole==="S"?' active':''}" onclick="setPole('S')">S pole</button>
            </div>
          </div>
          <div>
            <label class="label">Motion</label>
            <div class="btn-group">
              <button class="dir-btn${motion==="in"?' active':''}" onclick="setMotion('in')">push in</button>
              <button class="dir-btn${motion==="still"?' active':''}" onclick="setMotion('still')">hold still</button>
              <button class="dir-btn${motion==="out"?' active':''}" onclick="setMotion('out')">pull out</button>
            </div>
          </div>
        </div>
        <div class="readout">${exploreReadout()}</div>
      </div>`;
    pedEl.innerHTML=`<strong>Lenz's law is energy conservation in disguise:</strong> the induced current must oppose the change, because if it helped it, you would get acceleration and electrical energy for free. That is why you always feel a drag when pushing a magnet into a coil: you are the one paying for the induced current.
    <br><br><strong>The classic sign-error</strong> is answering with the current that <em>follows</em> the flux instead of opposing its change. Say the chain out loud, step 1 to 4, every single time; the answer falls out at step 4.`;

  } else if(mode==="quiz"){
    if(!quizQ)generateQuiz();
    svgEl.innerHTML=renderQuizScene();
    let optsHtml=quizQ.options.map(k=>{
      let cls="opt-btn";
      if(quizResult)cls+=" locked";
      if(quizGuess===k&&!quizResult)cls+=" selected";
      if(quizGuess===k&&quizResult==="correct")cls+=" correct";
      if(quizGuess===k&&quizResult==="incorrect")cls+=" wrong";
      return`<button class="${cls}" onclick="selectGuess('${k}')">${k}</button>`;
    }).join("");
    let resultHtml="";
    if(quizResult){
      if(quizResult==="correct")resultHtml=`<div class="result-text correct">Correct!</div>`;
      else resultHtml=`<div class="result-text wrong">Not quite — the answer is ${quizQ.answer}</div><p class="hint-text">${quizQ.hint}</p>`;
      resultHtml+=`<div class="next-row">
        <button class="check-btn" onclick="nextQuestion()">Next Question</button>
        <span class="score">Score: <strong>${score.correct}</strong> / ${score.total}</span>
      </div>`;
    }
    ctrlEl.innerHTML=`
      <div class="controls">
        ${quizQ.kind==="magnet"?`<div class="quiz-info">A magnet with its <strong style="color:var(--bright)">${quizQ.pole} pole</strong> facing the coil is <strong style="color:var(--bright)">${quizQ.motion==="in"?"moving toward it":quizQ.motion==="out"?"moving away from it":"held still"}</strong>.</div>`
        :`<div class="quiz-info">A conducting loop moves right at constant speed; it is <strong style="color:var(--bright)">${quizQ.state}</strong> a region of uniform field pointing <strong style="color:var(--bright)">${quizQ.bIn?"into":"out of"} the page</strong>.</div>`}
        <p class="quiz-prompt">${quizQ.prompt}</p>
        <div class="quiz-opts">${optsHtml}</div>
        ${!quizResult?`<button class="check-btn" ${!quizGuess?'disabled':''} onclick="checkAnswer()">Check Answer</button>`:''}
        ${resultHtml}
      </div>`;
    pedEl.innerHTML=`<strong>Method, always the same:</strong> name the flux direction; say whether it is increasing, decreasing or constant; constant means <em>no current</em>, full stop; otherwise the induced current creates flux opposing the change, and the right-hand grip converts that into a direction. The "held still" and "fully inside" cases are in this quiz on purpose: flux alone, however large, induces nothing.`;

  } else {
    svgEl.innerHTML=renderFluxScene(fluxX);
    ctrlEl.innerHTML=`
      <div class="controls">
        <div class="section-title">Flux and emf are different animals</div>
        <p class="section-desc">Drag the loop through the field region at constant speed. The flux Φ is a trapezoid; the emf is its negative gradient: two opposite pulses and <em>zero in the middle</em>, exactly where the flux is biggest.</p>
        <div class="slider-wrap">
          <label class="label">loop position</label>
          <input type="range" min="60" max="480" step="2" value="${fluxX}" oninput="setFluxX(this.value)">
        </div>
        <div class="readout" id="fluxReadout">${fluxReadoutHtml(fluxX)}</div>
      </div>`;
    pedEl.innerHTML=`<strong>The definition-confusion this view kills:</strong> flux is not emf. Φ = BA cos θ measures how much field threads the loop; ε = −N ΔΦ/Δt measures how fast that is changing. Maximum flux with zero emf (loop fully inside) and zero flux with maximum emf (loop just entering) both happen in this one animation. On graph questions, the emf is always the negative gradient of the flux graph.`;
  }
}

render();
if(mode==="explore")rafId=requestAnimationFrame(tick);
</script>
</body>
</html>
