<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Photoelectric Effect</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#101426;--panel:#1a2038;--border:#333d63;--text:#e6eaf8;--muted:#98a4cd;--bright:#f5f7ff;--photon:#eab308;--electron:#38bdf8;--correct:#34d399;--incorrect:#f87171;--accent:#eab308;--accentBg:#3d3305;--accentTxt:#fde047}
  body{font-family:'IBM Plex Sans','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:22px 18px;min-height:100vh}
  .container{max-width:1150px;margin:0 auto}
  .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.05em;padding:3px 10px;border-radius:6px;background:var(--accentBg);color:var(--accentTxt);margin-bottom:8px}
  h2{font-size:22px;font-weight:700;color:var(--bright);margin-bottom:4px}
  .subtitle{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .tab.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
  .controls{background:var(--panel);border-radius:12px;padding:16px;border:1px solid var(--border)}
  .label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
  .btn-group{display:flex;flex-wrap:wrap;gap:4px}
  .dir-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .dir-btn.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .quiz-prompt{font-size:14px;font-weight:600;margin-bottom:10px}
  .quiz-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .opt-btn{padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;text-align:left;transition:all .15s}
  .opt-btn.selected{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .opt-btn.correct{border-color:var(--correct);background:#064e3b;color:var(--correct);font-weight:700}
  .opt-btn.wrong{border-color:var(--incorrect);background:#7f1d1d;color:var(--incorrect);font-weight:700}
  .opt-btn.locked{cursor:default}
  .check-btn{padding:8px 24px;border-radius:8px;border:none;background:var(--accent);color:#292104;font-weight:700;font-size:14px;cursor:pointer}
  .check-btn:disabled{background:#333d63;color:#6f7ba8;cursor:default}
  .result-text{font-size:15px;font-weight:700;margin-bottom:6px}
  .result-text.correct{color:var(--correct)}
  .result-text.wrong{color:var(--incorrect)}
  .hint-text{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .next-row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .score{font-size:13px;color:var(--muted)}
  .score strong{color:var(--correct)}
  .pedagogy{margin-top:16px;padding:14px 16px;background:#141a2e;border-radius:10px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.65}
  .pedagogy strong{color:var(--bright)}
  .section-title{font-size:15px;font-weight:700;color:var(--bright);margin-bottom:8px}
  .section-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .slider-wrap{margin-top:8px}
  .slider-wrap input[type=range]{width:100%;margin-top:6px;accent-color:var(--accent)}
  .readout{margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.8}
  .readout .m{color:var(--muted)}
  .eq{display:block;white-space:nowrap}
  svg{display:block;border-radius:12px;width:100%;height:auto}
</style>
</head>
<body>
<div class="container">
  <span class="chip">THEME E · NUCLEAR &amp; QUANTUM · E2 QUANTUM PHYSICS (HL)</span>
  <h2>The Photoelectric Effect</h2>
  <p class="subtitle">One photon, one electron: <strong>KE<sub>max</sub> = hf − φ</strong>. Frequency decides the energy; intensity decides only how many.</p>

  <div class="tabs">
    <button class="tab active" id="tabExplore" onclick="switchMode('explore')">Explore</button>
    <button class="tab" id="tabQuiz" onclick="switchMode('quiz')">Quiz Me</button>
    <button class="tab" id="tabGraph" onclick="switchMode('graph')">The Einstein Line</button>
  </div>

  <div class="main">
    <div id="svgContainer"></div>
    <div id="controlsContainer"></div>
  </div>
  <div class="pedagogy" id="pedagogy"></div>
</div>

<script>
// ============================================================
// E_photon(eV) = 0.4136 x f, with f in units of 10^14 Hz.
// KE_max = hf - phi (eV); electrons ejected only if hf > phi.
// Stopping potential: eVs = KE_max, so Vs (volts) = KE_max (eV).
// ============================================================

const W=800,H=420;
const HFEV=0.4136; // eV per 10^14 Hz
const METALS={cs:{name:"caesium",phi:1.9},na:{name:"sodium",phi:2.3},zn:{name:"zinc",phi:4.3}};

let mode="explore";
let metal="na",freq=8,inten=3;
let simT=0,lastTs=null,rafId=null;
let quizQ=null,quizGuess=null,quizResult=null;
let score={correct:0,total:0};
let gFreq=9;

const ePhoton=f=>HFEV*f;
const keMax=(f,m)=>Math.max(0,ePhoton(f)-METALS[m].phi);
const ejects=(f,m)=>ePhoton(f)>METALS[m].phi;
const f0=m=>METALS[m].phi/HFEV;

function switchMode(m){
  mode=m;
  document.getElementById("tabExplore").className="tab"+(m==="explore"?" active":"");
  document.getElementById("tabQuiz").className="tab"+(m==="quiz"?" active":"");
  document.getElementById("tabGraph").className="tab"+(m==="graph"?" active":"");
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  lastTs=null;
  if(m==="quiz"){score={correct:0,total:0};generateQuiz();}
  render();
  if(m==="explore")rafId=requestAnimationFrame(tick);
}
function setMetal(m){metal=m;render();}
function setFreq(v){
  freq=Number(v);
  updateExploreReadout();
}
function setInten(v){
  inten=Number(v);
  updateExploreReadout();
}
function updateExploreReadout(){
  const el=document.getElementById("peReadout");
  if(el)el.innerHTML=exploreReadoutHtml();
  const fl=document.getElementById("freqLabel");
  if(fl)fl.textContent=freq.toFixed(1)+" × 10¹⁴ Hz";
  const il=document.getElementById("intenLabel");
  if(il)il.textContent=String(inten);
}
function tick(ts){
  if(mode!=="explore"){rafId=null;return;}
  if(lastTs===null)lastTs=ts;
  const dt=Math.min(0.05,(ts-lastTs)/1000);
  lastTs=ts;
  simT+=dt;
  document.getElementById("svgContainer").innerHTML=renderExploreScene(simT);
  rafId=requestAnimationFrame(tick);
}

// photon colour from frequency (visible band roughly 4 to 7.5 x10^14)
function photonColor(f){
  if(f<4)return"#b91c1c";
  if(f<5)return"#f97316";
  if(f<5.2)return"#eab308";
  if(f<6.1)return"#22c55e";
  if(f<6.7)return"#3b82f6";
  if(f<7.5)return"#7c3aed";
  return"#c4b5fd";
}
function renderExploreScene(t){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#0b0f1e;border-radius:12px;display:block">`;
  // metal plate
  svg+=`<rect x="70" y="120" width="26" height="220" rx="4" fill="#4a5578"/>`;
  svg+=`<text x="83" y="360" fill="#98a4cd" font-size="12" text-anchor="middle">${METALS[metal].name}</text>`;
  svg+=`<text x="83" y="376" fill="#6f7ba8" font-size="11" text-anchor="middle">φ = ${METALS[metal].phi} eV</text>`;
  const col=photonColor(freq);
  const ej=ejects(freq,metal);
  // photons: inten streams at staggered phases, travelling right-to-left toward plate
  for(let i=0;i<inten;i++){
    const phase=((t*1.1+i/inten)%1);
    const px=700-phase*580;
    const py=150+i*40;
    // wavy photon
    let d="M "+px+" "+py;
    for(let k=1;k<=24;k++){
      d+=" L "+(px+k*2.2)+" "+(py-Math.sin(k/24*6*Math.PI)*4);
    }
    svg+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2"/>`;
    svg+=`<polygon points="${px-8},${py} ${px},${py-4} ${px},${py+4}" fill="${col}"/>`;
    // electron ejected when photon reaches plate
    if(ej&&phase>0.93){
      const ex=100+(phase-0.93)*900*keMax(freq,metal);
      svg+=`<circle cx="${ex}" cy="${py+16}" r="5" fill="#38bdf8"/>`;
    }
  }
  if(ej){
    const v=keMax(freq,metal);
    svg+=`<text x="420" y="70" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">electrons out, KE_max = ${ePhoton(freq).toFixed(2)} − ${METALS[metal].phi} = ${v.toFixed(2)} eV</text>`;
  }else{
    svg+=`<text x="420" y="70" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle">below threshold: no electrons, however bright the light</text>`;
  }
  return svg+"</svg>";
}
function exploreReadoutHtml(){
  const E=ePhoton(freq);
  return`<span class="eq"><span class="m">photon energy E = hf =</span> <strong>${E.toFixed(2)} eV</strong></span>
  <span class="eq"><span class="m">work function φ =</span> <strong>${METALS[metal].phi.toFixed(1)} eV</strong> <span class="m">threshold f₀ = φ/h = ${f0(metal).toFixed(1)} × 10¹⁴ Hz</span></span>
  <span class="eq"><span class="m">KE_max = hf − φ =</span> <strong>${ejects(freq,metal)?keMax(freq,metal).toFixed(2)+" eV":"no emission"}</strong></span>
  <span class="eq"><span class="m">stopping potential V_s =</span> <strong>${ejects(freq,metal)?keMax(freq,metal).toFixed(2)+" V":"—"}</strong></span>`;
}

// ---- quiz ----
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const ROLE_ITEMS=[
  {q:"Light above the threshold frequency falls on a metal. The intensity is doubled with frequency unchanged. What happens?",ans:"twice as many electrons per second, same maximum KE",opts:["twice as many electrons per second, same maximum KE","the same number of electrons, each with more KE","twice as many electrons, each with more KE","no change at all"],hint:"Intensity means more photons per second, and one photon ejects one electron: more electrons, same energy each. KE_max depends only on f. Sorting these two roles is the whole exam question."},
  {q:"Light below the threshold frequency falls on a metal. The intensity is increased enormously. What happens?",ans:"still no electrons are emitted",opts:["still no electrons are emitted","electrons are eventually emitted after a delay","a few electrons with tiny KE emerge","the metal charges positive"],hint:"Each photon individually lacks the energy φ, and electrons absorb photons one at a time: no accumulation, no delay, no emission. This is the observation that killed the wave model."},
  {q:"The frequency of the light is increased (still above threshold), intensity unchanged. What happens?",ans:"same number of electrons per second, higher maximum KE",opts:["same number of electrons per second, higher maximum KE","more electrons per second, same KE","more electrons per second, higher KE","fewer electrons, higher KE"],hint:"Each photon now carries more energy (higher KE_max = hf − φ) but the photon arrival rate at fixed intensity is essentially the story the IB wants: frequency controls energy, not the count."},
  {q:"Why does the photoelectric effect support the photon model of light?",ans:"emission is instantaneous and has a threshold frequency, however low the intensity",opts:["emission is instantaneous and has a threshold frequency, however low the intensity","electrons are only emitted by bright light","the electron energy grows with intensity","light diffracts through slits"],hint:"A wave would deliver energy continuously to the whole surface: any frequency would eventually eject electrons, with a delay at low intensity. Instead there is a sharp f₀ and no delay: energy arrives in lumps of hf."}
];
function generateQuiz(){
  const roll=Math.random();
  if(roll<0.5){
    const item=pick(ROLE_ITEMS);
    quizQ={prompt:item.q,answer:item.ans,options:shuffle(item.opts.slice()),hint:item.hint};
  }else{
    // numeric KE / Vs
    const phi=pick([1.9,2.3,4.3]);
    const E=pick([3,4,5,6]);
    if(E<=phi){generateQuiz();return;}
    const ke=Number((E-phi).toFixed(1));
    const asVs=Math.random()<0.4;
    const opts=[...new Set([ke,Number((E+phi).toFixed(1)),E,phi])].slice(0,4).map(x=>x+(asVs?" V":" eV"));
    quizQ={answer:ke+(asVs?" V":" eV"),options:shuffle(opts),
      prompt:asVs?"Photons of "+E+" eV strike a metal with work function "+phi+" eV. What stopping potential just prevents any electron arriving at the collector?"
      :"Photons of "+E+" eV strike a metal with work function "+phi+" eV. What is the maximum kinetic energy of the emitted electrons?",
      hint:"KE_max = hf − φ = "+E+" − "+phi+" = "+ke+" eV"+(asVs?", and eV_s = KE_max, so V_s = "+ke+" V. The electron-volt makes the arithmetic one subtraction.":". Adding instead of subtracting is the standard slip: the work function is the exit toll, not a bonus.")};
  }
  quizGuess=null;quizResult=null;
}
function selectGuess(k){if(!quizResult){quizGuess=k;render();}}
function checkAnswer(){
  if(!quizGuess||!quizQ)return;
  const ok=quizGuess===quizQ.answer;
  quizResult=ok?"correct":"incorrect";
  score.total++;if(ok)score.correct++;
  render();
}
function nextQuestion(){generateQuiz();render();}

// ---- Einstein line ----
function renderGraphScene(){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#0b0f1e;border-radius:12px;display:block">`;
  const gx=110,gy=44,gw=600,gh=300;
  const FMAX=16,KMAX=4.5;
  const px=f=>gx+f/FMAX*gw;
  const py=k=>gy+gh-k/KMAX*gh;
  svg+=`<line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy+gh}" stroke="#333d63" stroke-width="1.5"/>`;
  svg+=`<line x1="${gx}" y1="${gy+gh}" x2="${gx+gw}" y2="${gy+gh}" stroke="#333d63" stroke-width="1.5"/>`;
  svg+=`<text x="${gx+gw/2}" y="${gy+gh+34}" fill="#98a4cd" text-anchor="middle" font-size="12">frequency f (× 10¹⁴ Hz)</text>`;
  svg+=`<text x="${gx-10}" y="${gy-12}" fill="#98a4cd" font-size="12">KE_max (eV)</text>`;
  for(let f=2;f<=16;f+=2){
    svg+=`<line x1="${px(f)}" y1="${gy+gh}" x2="${px(f)}" y2="${gy+gh+5}" stroke="#333d63"/>`;
    svg+=`<text x="${px(f)}" y="${gy+gh+18}" fill="#6f7ba8" text-anchor="middle" font-size="10">${f}</text>`;
  }
  for(let k=1;k<=4;k++)svg+=`<text x="${gx-8}" y="${py(k)+4}" fill="#6f7ba8" text-anchor="end" font-size="10">${k}</text>`;
  // all three metals' lines (same slope h)
  Object.keys(METALS).forEach(m=>{
    const isSel=m===metal;
    const f00=f0(m);
    const x1=px(f00),y1=py(0);
    const fEnd=FMAX,yEnd=py(Math.min(KMAX,HFEV*fEnd-METALS[m].phi));
    const fClip=Math.min(fEnd,(KMAX+METALS[m].phi)/HFEV);
    svg+=`<line x1="${x1}" y1="${y1}" x2="${px(fClip)}" y2="${py(HFEV*fClip-METALS[m].phi)}" stroke="${isSel?'#fde047':'#4a5578'}" stroke-width="${isSel?3:1.6}"/>`;
    svg+=`<circle cx="${x1}" cy="${y1}" r="${isSel?5:3.5}" fill="${isSel?'#fde047':'#4a5578'}"/>`;
    svg+=`<text x="${x1}" y="${y1+18}" fill="${isSel?'#fde047':'#6f7ba8'}" font-size="10" text-anchor="middle">f₀ ${METALS[m].name}</text>`;
  });
  // marker at gFreq on selected metal
  const ke=keMax(gFreq,metal);
  if(ePhoton(gFreq)>METALS[metal].phi){
    svg+=`<circle cx="${px(gFreq)}" cy="${py(Math.min(KMAX,ke))}" r="6" fill="#38bdf8"/>`;
  }else{
    svg+=`<circle cx="${px(gFreq)}" cy="${py(0)}" r="6" fill="#f87171"/>`;
  }
  svg+=`<text x="${gx+gw-6}" y="${gy+16}" fill="#98a4cd" font-size="11" text-anchor="end">every line has the same gradient: h</text>`;
  return svg+"</svg>";
}
function graphReadoutHtml(){
  const E=ePhoton(gFreq),ke=keMax(gFreq,metal);
  return`<span class="eq"><span class="m">KE_max = hf − φ: gradient =</span> <strong>h</strong><span class="m">, y-intercept = −φ, x-intercept = f₀</span></span>
  <span class="eq"><span class="m">at f = ${gFreq.toFixed(1)}: E_photon = ${E.toFixed(2)} eV →</span> <strong>${E>METALS[metal].phi?"KE_max = "+ke.toFixed(2)+" eV":"below f₀, no emission"}</strong></span>
  <span class="eq"><span class="m">changing metal slides the line sideways; nothing can change its slope.</span></span>`;
}
function setGFreq(v){
  gFreq=Number(v);
  document.getElementById("svgContainer").innerHTML=renderGraphScene();
  document.getElementById("gReadout").innerHTML=graphReadoutHtml();
  document.getElementById("gLabel").textContent=gFreq.toFixed(1)+" × 10¹⁴ Hz";
}
function setGMetal(m){metal=m;render();}

// ---- main render ----
function render(){
  const svgEl=document.getElementById("svgContainer");
  const ctrlEl=document.getElementById("controlsContainer");
  const pedEl=document.getElementById("pedagogy");

  if(mode==="explore"){
    svgEl.innerHTML=renderExploreScene(simT);
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="section-desc">Two sliders, two completely different jobs. Drag the frequency through the threshold and watch emission switch on; then crank the intensity and notice what does and does not change.</p>
        <div class="label">Metal</div>
        <div class="btn-group" style="margin-bottom:8px">
          ${Object.keys(METALS).map(m=>`<button class="dir-btn${m===metal?' active':''}" onclick="setMetal('${m}')">${METALS[m].name} (${METALS[m].phi} eV)</button>`).join("")}
        </div>
        <div class="slider-wrap">
          <label class="label">frequency f: <span id="freqLabel" style="color:var(--bright)">${freq.toFixed(1)} × 10¹⁴ Hz</span></label>
          <input type="range" min="3" max="15" step="0.1" value="${freq}" oninput="setFreq(this.value)">
        </div>
        <div class="slider-wrap">
          <label class="label">intensity (photons per second): <span id="intenLabel" style="color:var(--bright)">${inten}</span></label>
          <input type="range" min="1" max="5" step="1" value="${inten}" oninput="setInten(this.value)">
        </div>
        <div class="readout" id="peReadout">${exploreReadoutHtml()}</div>
      </div>`;
    pedEl.innerHTML=`<strong>The role-confusion this sim attacks:</strong> intensity is photons per second; frequency is energy per photon. One photon gives all its energy to one electron, which spends φ escaping and keeps the rest: KE_max = hf − φ. So intensity sets the electron <em>count</em>, frequency sets the electron <em>energy</em>, and below f₀ = φ/h nothing comes out at any brightness.`;

  } else if(mode==="quiz"){
    if(!quizQ)generateQuiz();
    svgEl.innerHTML=renderExploreScene(0.4);
    let optsHtml=quizQ.options.map(k=>{
      let cls="opt-btn";
      if(quizResult)cls+=" locked";
      if(quizGuess===k&&!quizResult)cls+=" selected";
      if(quizGuess===k&&quizResult==="correct")cls+=" correct";
      if(quizGuess===k&&quizResult==="incorrect")cls+=" wrong";
      return`<button class="${cls}" onclick="selectGuess('${k}')">${k}</button>`;
    }).join("");
    let resultHtml="";
    if(quizResult){
      if(quizResult==="correct")resultHtml=`<div class="result-text correct">Correct!</div>`;
      else resultHtml=`<div class="result-text wrong">Not quite — the answer is: ${quizQ.answer}</div><p class="hint-text">${quizQ.hint}</p>`;
      resultHtml+=`<div class="next-row">
        <button class="check-btn" onclick="nextQuestion()">Next Question</button>
        <span class="score">Score: <strong>${score.correct}</strong> / ${score.total}</span>
      </div>`;
    }
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="quiz-prompt">${quizQ.prompt}</p>
        <div class="quiz-opts">${optsHtml}</div>
        ${!quizResult?`<button class="check-btn" ${!quizGuess?'disabled':''} onclick="checkAnswer()">Check Answer</button>`:''}
        ${resultHtml}
      </div>`;
    pedEl.innerHTML=`<strong>Before choosing, ask two questions:</strong> is this about the number of electrons (then think photons per second, intensity) or about their energy (then think hf − φ, frequency)? Nearly every option set here contains one answer that mixes the roles: that is the distractor.`;

  } else {
    svgEl.innerHTML=renderGraphScene();
    ctrlEl.innerHTML=`
      <div class="controls">
        <div class="section-title">KE_max against frequency</div>
        <p class="section-desc">Three metals, three parallel lines. The gradient is Planck's constant for every metal in the universe; only the intercepts move. This graph is how h was first measured.</p>
        <div class="label">Metal</div>
        <div class="btn-group" style="margin-bottom:8px">
          ${Object.keys(METALS).map(m=>`<button class="dir-btn${m===metal?' active':''}" onclick="setGMetal('${m}')">${METALS[m].name}</button>`).join("")}
        </div>
        <div class="slider-wrap">
          <label class="label">frequency: <span id="gLabel" style="color:var(--bright)">${gFreq.toFixed(1)} × 10¹⁴ Hz</span></label>
          <input type="range" min="3" max="15" step="0.1" value="${gFreq}" oninput="setGFreq(this.value)">
        </div>
        <div class="readout" id="gReadout">${graphReadoutHtml()}</div>
      </div>`;
    pedEl.innerHTML=`<strong>Reading the Einstein line in exams:</strong> gradient = h (same for all metals), x-intercept = threshold frequency f₀, and extending the line backwards gives the y-intercept −φ. Given any two of φ, f₀ and a data point, you can find the third: that is the standard structure of every photoelectric graph question.`;
  }
}

render();
if(mode==="explore")rafId=requestAnimationFrame(tick);
</script>
</body>
</html>
