<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standing Waves in Strings and Pipes</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#081a1f;--panel:#0f2b33;--border:#1e4d5b;--text:#dcf0f5;--muted:#8dbcc9;--bright:#f0fafc;--wave:#22d3ee;--node:#f43f5e;--anti:#fbbf24;--correct:#34d399;--incorrect:#f87171;--accent:#06b6d4;--accentBg:#083d4a;--accentTxt:#67e8f9}
  body{font-family:'IBM Plex Sans','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:22px 18px;min-height:100vh}
  .container{max-width:1150px;margin:0 auto}
  .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.05em;padding:3px 10px;border-radius:6px;background:var(--accentBg);color:var(--accentTxt);margin-bottom:8px}
  h2{font-size:22px;font-weight:700;color:var(--bright);margin-bottom:4px}
  .subtitle{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .tab.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
  .controls{background:var(--panel);border-radius:12px;padding:16px;border:1px solid var(--border)}
  .label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
  .btn-group{display:flex;flex-wrap:wrap;gap:4px}
  .dir-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .dir-btn.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .dir-btn:disabled{opacity:0.3;cursor:default}
  .quiz-prompt{font-size:14px;font-weight:600;margin-bottom:10px}
  .quiz-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .opt-btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;min-width:92px;text-align:center;transition:all .15s}
  .opt-btn.selected{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .opt-btn.correct{border-color:var(--correct);background:#064e3b;color:var(--correct);font-weight:700}
  .opt-btn.wrong{border-color:var(--incorrect);background:#7f1d1d;color:var(--incorrect);font-weight:700}
  .opt-btn.locked{cursor:default}
  .check-btn{padding:8px 24px;border-radius:8px;border:none;background:var(--accent);color:#01262e;font-weight:700;font-size:14px;cursor:pointer}
  .check-btn:disabled{background:#1e4d5b;color:#5d8b98;cursor:default}
  .result-text{font-size:15px;font-weight:700;margin-bottom:6px}
  .result-text.correct{color:var(--correct)}
  .result-text.wrong{color:var(--incorrect)}
  .hint-text{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .next-row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .score{font-size:13px;color:var(--muted)}
  .score strong{color:var(--correct)}
  .pedagogy{margin-top:16px;padding:14px 16px;background:#0b222a;border-radius:10px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.65}
  .pedagogy strong{color:var(--bright)}
  .section-title{font-size:15px;font-weight:700;color:var(--bright);margin-bottom:8px}
  .section-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .readout{margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.8}
  .readout .m{color:var(--muted)}
  .eq{display:block;white-space:nowrap}
  svg{display:block;border-radius:12px;width:100%;height:auto}
</style>
</head>
<body>
<div class="container">
  <span class="chip">THEME C · WAVE BEHAVIOUR · C4 STANDING WAVES AND RESONANCE</span>
  <h2>Standing Waves in Strings and Pipes</h2>
  <p class="subtitle">String / open pipe: f<sub>n</sub> = n·v/2L, all n. &nbsp;|&nbsp; Closed pipe: f<sub>n</sub> = n·v/4L, odd n only.</p>

  <div class="tabs">
    <button class="tab active" id="tabExplore" onclick="switchMode('explore')">Explore Harmonics</button>
    <button class="tab" id="tabQuiz" onclick="switchMode('quiz')">Quiz Me</button>
    <button class="tab" id="tabLadder" onclick="switchMode('ladder')">The Harmonic Ladder</button>
  </div>

  <div class="main">
    <div id="svgContainer"></div>
    <div id="controlsContainer"></div>
  </div>
  <div class="pedagogy" id="pedagogy"></div>
</div>

<script>
// ============================================================
// String fixed both ends / pipe open both ends: L = n lambda/2, all n.
// Pipe closed one end: L = n lambda/4, n odd only.
// Displacement pattern drawn; nodes red, antinodes gold.
// Closed end: node. Open end / free reflection point: antinode.
// ============================================================

const W=800,H=420;
const MEDIA={
  string:{name:"string, fixed both ends",denom:2,odds:false,leftNode:true,rightNode:true},
  open:{name:"pipe, open both ends",denom:2,odds:false,leftNode:false,rightNode:false},
  closed:{name:"pipe, closed one end",denom:4,odds:true,leftNode:true,rightNode:false}
};
let mode="explore";
let medium="string",harm=1;
let simT=0,lastTs=null,rafId=null;
let quizQ=null,quizGuess=null,quizResult=null;
let score={correct:0,total:0};

function allowedHarmonics(m){return MEDIA[m].odds?[1,3,5,7]:[1,2,3,4,5];}
// shape: displacement amplitude profile along the tube/string
function shapeFn(m,n){
  const M=MEDIA[m];
  // number of quarter wavelengths in L: string/open: n halves = 2n quarters; closed: n quarters
  if(m==="string")return u=>Math.sin(n*Math.PI*u);           // node both ends
  if(m==="open")return u=>Math.cos(n*Math.PI*u);              // antinode both ends
  return u=>Math.sin(n*Math.PI/2*u);                          // closed at u=0 (node), open at u=1 (antinode), n odd
}
function lambdaOf(m,n,L){return MEDIA[m].denom*L/n;}
function freqOf(m,n){return n;} // in units of the family's base v/(denom L)

function switchMode(m){
  mode=m;
  document.getElementById("tabExplore").className="tab"+(m==="explore"?" active":"");
  document.getElementById("tabQuiz").className="tab"+(m==="quiz"?" active":"");
  document.getElementById("tabLadder").className="tab"+(m==="ladder"?" active":"");
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  lastTs=null;
  if(m==="quiz"){score={correct:0,total:0};generateQuiz();}
  render();
  if(m==="explore")rafId=requestAnimationFrame(tick);
}
function setMedium(m){
  medium=m;
  if(!allowedHarmonics(m).includes(harm))harm=allowedHarmonics(m)[0];
  render();
}
function setHarm(n){harm=n;render();}
function tick(ts){
  if(mode!=="explore"){rafId=null;return;}
  if(lastTs===null)lastTs=ts;
  const dt=Math.min(0.05,(ts-lastTs)/1000);
  lastTs=ts;
  simT+=dt;
  document.getElementById("svgContainer").innerHTML=renderExploreScene(simT);
  rafId=requestAnimationFrame(tick);
}

// ---- scene ----
function renderPattern(m,n,t,x0,x1,ymid,amp,withMarks){
  const f=shapeFn(m,n);
  const osc=t===null?1:Math.cos(2*Math.PI*t*0.8);
  let s="";
  // envelope
  for(const sign of[1,-1]){
    let d="";
    for(let i=0;i<=200;i++){
      const u=i/200;
      d+=(i===0?"M":"L")+(x0+u*(x1-x0)).toFixed(1)+","+(ymid-sign*Math.abs(f(u))*amp).toFixed(1);
    }
    s+=`<path d="${d}" fill="none" stroke="#1e4d5b" stroke-width="1.2" stroke-dasharray="4,4"/>`;
  }
  // instantaneous shape
  let d="";
  for(let i=0;i<=200;i++){
    const u=i/200;
    d+=(i===0?"M":"L")+(x0+u*(x1-x0)).toFixed(1)+","+(ymid-f(u)*osc*amp).toFixed(1);
  }
  s+=`<path d="${d}" fill="none" stroke="#22d3ee" stroke-width="3"/>`;
  if(withMarks){
    // nodes where |f(u)| ~ 0, antinodes where |f| = 1
    for(let i=0;i<=400;i++){
      const u=i/400;
      const fv=Math.abs(f(u));
      const fprev=i>0?Math.abs(f((i-1)/400)):fv;
      const fnext=i<400?Math.abs(f((i+1)/400)):fv;
      if(fv<0.012){
        s+=`<circle cx="${x0+u*(x1-x0)}" cy="${ymid}" r="5" fill="#f43f5e"/>`;
      }else if(fv>0.9995&&fv>=fprev&&fv>=fnext){
        s+=`<circle cx="${x0+u*(x1-x0)}" cy="${ymid}" r="5" fill="none" stroke="#fbbf24" stroke-width="2.5"/>`;
      }
    }
  }
  return s;
}
function renderBoundaries(m,x0,x1,ymid){
  let s="";
  if(m==="string"){
    s+=`<line x1="${x0}" y1="${ymid-70}" x2="${x0}" y2="${ymid+70}" stroke="#8dbcc9" stroke-width="5"/>`;
    s+=`<line x1="${x1}" y1="${ymid-70}" x2="${x1}" y2="${ymid+70}" stroke="#8dbcc9" stroke-width="5"/>`;
  }else{
    // pipe walls
    s+=`<line x1="${x0}" y1="${ymid-62}" x2="${x1}" y2="${ymid-62}" stroke="#8dbcc9" stroke-width="3"/>`;
    s+=`<line x1="${x0}" y1="${ymid+62}" x2="${x1}" y2="${ymid+62}" stroke="#8dbcc9" stroke-width="3"/>`;
    if(m==="closed")s+=`<line x1="${x0}" y1="${ymid-62}" x2="${x0}" y2="${ymid+62}" stroke="#8dbcc9" stroke-width="5"/>`;
  }
  return s;
}
function renderExploreScene(t){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#051317;border-radius:12px;display:block">`;
  const x0=110,x1=690,ymid=190;
  svg+=renderBoundaries(medium,x0,x1,ymid);
  svg+=renderPattern(medium,harm,t,x0,x1,ymid,54,true);
  svg+=`<text x="${(x0+x1)/2}" y="60" fill="#dcf0f5" font-size="14" font-weight="700" text-anchor="middle">${MEDIA[medium].name}: harmonic n = ${harm}</text>`;
  // legend
  svg+=`<circle cx="140" cy="330" r="5" fill="#f43f5e"/><text x="152" y="334" fill="#8dbcc9" font-size="11">node (never moves)</text>`;
  svg+=`<circle cx="330" cy="330" r="5" fill="none" stroke="#fbbf24" stroke-width="2.5"/><text x="342" y="334" fill="#8dbcc9" font-size="11">antinode (maximum swing)</text>`;
  if(medium!=="string")svg+=`<text x="${(x0+x1)/2}" y="370" fill="#5d8b98" font-size="11" text-anchor="middle">pipes: the curve shows air displacement; closed end forces a node, open end an antinode</text>`;
  return svg+"</svg>";
}

// ---- quiz ----
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function generateQuiz(){
  const roll=Math.random();
  if(roll<0.35){
    // closed pipe next harmonic (the trap)
    const f1=pick([100,110,150,200]);
    const closed=Math.random()<0.6;
    if(closed){
      quizQ={type:"next",medium:"closed",harm:1,answer:3*f1+" Hz",
        options:shuffle([3*f1+" Hz",2*f1+" Hz",1.5*f1+" Hz",4*f1+" Hz"]),
        prompt:"A pipe closed at one end has fundamental frequency "+f1+" Hz. What is the frequency of the next harmonic it can produce?",
        hint:"Closed pipes support odd harmonics only: f₁, 3f₁, 5f₁... The next one is 3×"+f1+" = "+3*f1+" Hz. The 2f₁ answer is the open-pipe ladder applied to the wrong pipe."};
    }else{
      quizQ={type:"next",medium:"open",harm:1,answer:2*f1+" Hz",
        options:shuffle([2*f1+" Hz",3*f1+" Hz",1.5*f1+" Hz",4*f1+" Hz"]),
        prompt:"A pipe open at both ends has fundamental frequency "+f1+" Hz. What is the frequency of the next harmonic it can produce?",
        hint:"Open pipes (like strings) support every harmonic: f₁, 2f₁, 3f₁... so the next is "+2*f1+" Hz."};
    }
  }else if(roll<0.7){
    // wavelength from loops on a string
    const n=pick([2,3,4,5]);
    const L=1.2;
    const lam=2*L/n;
    const opts=[...new Set([lam,L/n,2*L*n,L*n/2].map(x=>Number(x.toFixed(2))))].slice(0,4).map(x=>x+" m");
    quizQ={type:"lam",medium:"string",harm:n,answer:Number(lam.toFixed(2))+" m",options:shuffle(opts),
      prompt:"The string is "+L+" m long and vibrates in the pattern shown ("+n+" loops). What is the wavelength?",
      hint:"Each loop is half a wavelength, so L = n·λ/2 and λ = 2L/n = 2×"+L+"/"+n+" = "+Number(lam.toFixed(2))+" m."};
  }else{
    // count nodes or antinodes
    const m=pick(["string","open","closed"]);
    const n=pick(allowedHarmonics(m).slice(0,3));
    const countNodes=Math.random()<0.5;
    // string: nodes n+1, antinodes n. open: nodes n, antinodes n+1. closed (n odd): nodes (n+1)/2, antinodes (n+1)/2.
    let nodes,antis;
    if(m==="string"){nodes=n+1;antis=n;}
    else if(m==="open"){nodes=n;antis=n+1;}
    else{nodes=(n+1)/2;antis=(n+1)/2;}
    const correct=countNodes?nodes:antis;
    const opts=[...new Set([correct,correct+1,correct-1||correct+2,n])].slice(0,4).map(String);
    quizQ={type:"count",medium:m,harm:n,answer:String(correct),options:shuffle(opts),
      prompt:"For the pattern shown ("+MEDIA[m].name+", n = "+n+"), how many "+(countNodes?"nodes":"antinodes")+" are there?",
      hint:"Count them on the diagram: red dots are nodes, gold rings are antinodes. Fixed/closed ends are always nodes; open ends are always antinodes."};
  }
  quizGuess=null;quizResult=null;
}
function selectGuess(k){if(!quizResult){quizGuess=k;render();}}
function checkAnswer(){
  if(!quizGuess||!quizQ)return;
  const ok=quizGuess===quizQ.answer;
  quizResult=ok?"correct":"incorrect";
  score.total++;if(ok)score.correct++;
  render();
}
function nextQuestion(){generateQuiz();render();}
function renderQuizScene(){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#051317;border-radius:12px;display:block">`;
  const x0=110,x1=690,ymid=200;
  svg+=renderBoundaries(quizQ.medium,x0,x1,ymid);
  svg+=renderPattern(quizQ.medium,quizQ.harm,null,x0,x1,ymid,54,quizQ.type==="count"?!!quizResult:true);
  svg+=`<text x="${(x0+x1)/2}" y="70" fill="#dcf0f5" font-size="13" font-weight="700" text-anchor="middle">${MEDIA[quizQ.medium].name}</text>`;
  return svg+"</svg>";
}

// ---- ladder tab ----
function renderLadderScene(){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#051317;border-radius:12px;display:block">`;
  // frequency axis: units of v/4L (closed pipe base), so open f1 = 2 units
  const fx=f=>90+f/10*620;
  svg+=`<line x1="90" y1="340" x2="730" y2="340" stroke="#1e4d5b" stroke-width="1.5"/>`;
  for(let f=1;f<=10;f++){
    svg+=`<line x1="${fx(f)}" y1="340" x2="${fx(f)}" y2="346" stroke="#1e4d5b"/>`;
    svg+=`<text x="${fx(f)}" y="360" fill="#5d8b98" text-anchor="middle" font-size="10">${f}</text>`;
  }
  svg+=`<text x="730" y="378" fill="#5d8b98" font-size="10" text-anchor="end">frequency in units of v/4L (same L for both pipes)</text>`;
  // open pipe: f = 2,4,6,8,10 units ; closed: 1,3,5,7,9
  svg+=`<text x="90" y="120" fill="#67e8f9" font-size="13" font-weight="700">OPEN pipe: every harmonic, f₁ = v/2L = 2 units</text>`;
  [2,4,6,8,10].forEach((f,i)=>{
    svg+=`<line x1="${fx(f)}" y1="140" x2="${fx(f)}" y2="200" stroke="#67e8f9" stroke-width="5"/>`;
    svg+=`<text x="${fx(f)}" y="132" fill="#67e8f9" font-size="10" text-anchor="middle">${i+1}f₁</text>`;
  });
  svg+=`<text x="90" y="240" fill="#fbbf24" font-size="13" font-weight="700">CLOSED pipe: odd harmonics only, f₁ = v/4L = 1 unit</text>`;
  [1,3,5,7,9].forEach((f,i)=>{
    svg+=`<line x1="${fx(f)}" y1="260" x2="${fx(f)}" y2="320" stroke="#fbbf24" stroke-width="5"/>`;
    svg+=`<text x="${fx(f)}" y="252" fill="#fbbf24" font-size="10" text-anchor="middle">${2*i+1}f₁</text>`;
  });
  return svg+"</svg>";
}

// ---- main render ----
function render(){
  const svgEl=document.getElementById("svgContainer");
  const ctrlEl=document.getElementById("controlsContainer");
  const pedEl=document.getElementById("pedagogy");

  if(mode==="explore"){
    svgEl.innerHTML=renderExploreScene(simT);
    const L=1.0;
    const lam=lambdaOf(medium,harm,L);
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="section-desc">Pick a medium and step through its harmonics. In the closed pipe the even buttons are dead: that is not a bug, it is the physics.</p>
        <div class="label">Medium</div>
        <div class="btn-group" style="margin-bottom:8px">
          ${Object.keys(MEDIA).map(m=>`<button class="dir-btn${m===medium?' active':''}" onclick="setMedium('${m}')">${MEDIA[m].name}</button>`).join("")}
        </div>
        <div class="label">Harmonic n</div>
        <div class="btn-group">
          ${[1,2,3,4,5,6,7].map(n=>{
            const ok=allowedHarmonics(medium).includes(n);
            return`<button class="dir-btn${n===harm?' active':''}" ${ok?`onclick="setHarm(${n})"`:"disabled"}>${n}</button>`;
          }).join("")}
        </div>
        <div class="readout">
          <span class="eq"><span class="m">λ = ${MEDIA[medium].denom}L/n = ${MEDIA[medium].denom}×L/${harm} =</span> <strong>${lam.toFixed(2)} L</strong></span>
          <span class="eq"><span class="m">f = ${harm} × f₁ where f₁ = v/${MEDIA[medium].denom}L</span></span>
          <span class="eq"><span class="m">${MEDIA[medium].odds?"Only odd n fit: one end must be a node, the other an antinode.":"All n fit: matching ends, whole half-wavelengths."}</span></span>
        </div>
      </div>`;
    pedEl.innerHTML=`<strong>Boundary conditions are the whole game:</strong> a fixed string end or a closed pipe end forces a node; an open pipe end forces an antinode. Matching ends (node-node or antinode-antinode) fit whole half-wavelengths, so every harmonic exists. Mismatched ends (closed pipe) fit odd quarter-wavelengths, so only odd harmonics exist. Derive it from the ends every time and the odd-only rule stops being a memory item.`;

  } else if(mode==="quiz"){
    if(!quizQ)generateQuiz();
    svgEl.innerHTML=renderQuizScene();
    let optsHtml=quizQ.options.map(k=>{
      let cls="opt-btn";
      if(quizResult)cls+=" locked";
      if(quizGuess===k&&!quizResult)cls+=" selected";
      if(quizGuess===k&&quizResult==="correct")cls+=" correct";
      if(quizGuess===k&&quizResult==="incorrect")cls+=" wrong";
      return`<button class="${cls}" onclick="selectGuess('${k}')">${k}</button>`;
    }).join("");
    let resultHtml="";
    if(quizResult){
      if(quizResult==="correct")resultHtml=`<div class="result-text correct">Correct!</div>`;
      else resultHtml=`<div class="result-text wrong">Not quite — the answer is ${quizQ.answer}</div><p class="hint-text">${quizQ.hint}</p>`;
      resultHtml+=`<div class="next-row">
        <button class="check-btn" onclick="nextQuestion()">Next Question</button>
        <span class="score">Score: <strong>${score.correct}</strong> / ${score.total}</span>
      </div>`;
    }
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="quiz-prompt">${quizQ.prompt}</p>
        <div class="quiz-opts">${optsHtml}</div>
        ${!quizResult?`<button class="check-btn" ${!quizGuess?'disabled':''} onclick="checkAnswer()">Check Answer</button>`:''}
        ${resultHtml}
      </div>`;
    pedEl.innerHTML=`<strong>The named trap here:</strong> closed pipe, odd harmonics only, and the distractor is always the open-pipe formula. Say the pipe type out loud before touching any formula. For strings: loops are half-wavelengths, L = nλ/2, and nodes outnumber antinodes by exactly one.`;

  } else {
    svgEl.innerHTML=renderLadderScene();
    ctrlEl.innerHTML=`
      <div class="controls">
        <div class="section-title">Two pipes, same length, different ladders</div>
        <p class="section-desc">Same L, same speed of sound. The open pipe's fundamental is an octave above the closed pipe's, and its ladder has twice as many rungs. The closed pipe's rungs sit only on the odd multiples.</p>
        <div class="readout">
          <span class="eq"><span class="m">Open: f₁ = v/2L, then 2f₁, 3f₁, 4f₁...</span></span>
          <span class="eq"><span class="m">Closed: f₁ = v/4L, then 3f₁, 5f₁, 7f₁...</span></span>
          <span class="eq"><span class="m">Same absolute frequencies appear in both ladders: check the picture.</span></span>
        </div>
      </div>`;
    pedEl.innerHTML=`<strong>Exam use of this picture:</strong> "a closed pipe and an open pipe have the same fundamental; compare their lengths" (the closed one is half as long), and "which frequencies are missing from the closed pipe's spectrum" (the even multiples). Both fall out of the ladder instantly.`;
  }
}

render();
if(mode==="explore")rafId=requestAnimationFrame(tick);
</script>
</body>
</html>
