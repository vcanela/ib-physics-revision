<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radioactive Decay: the N-Z Board</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#131711;--panel:#20261c;--border:#40503a;--text:#e8f0e3;--muted:#a4bb99;--bright:#f5faf2;--alpha:#fb923c;--betam:#38bdf8;--betap:#f472b6;--gam:#a78bfa;--correct:#34d399;--incorrect:#f87171;--accent:#65a30d;--accentBg:#2a3a10;--accentTxt:#bef264}
  body{font-family:'IBM Plex Sans','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:22px 18px;min-height:100vh}
  .container{max-width:1150px;margin:0 auto}
  .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.05em;padding:3px 10px;border-radius:6px;background:var(--accentBg);color:var(--accentTxt);margin-bottom:8px}
  h2{font-size:22px;font-weight:700;color:var(--bright);margin-bottom:4px}
  .subtitle{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .tab.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
  .controls{background:var(--panel);border-radius:12px;padding:16px;border:1px solid var(--border)}
  .label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
  .btn-group{display:flex;flex-wrap:wrap;gap:4px}
  .dir-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .dir-btn.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .quiz-prompt{font-size:14px;font-weight:600;margin-bottom:10px}
  .quiz-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .opt-btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;min-width:96px;text-align:center;transition:all .15s}
  .opt-btn.selected{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .opt-btn.correct{border-color:var(--correct);background:#064e3b;color:var(--correct);font-weight:700}
  .opt-btn.wrong{border-color:var(--incorrect);background:#7f1d1d;color:var(--incorrect);font-weight:700}
  .opt-btn.locked{cursor:default}
  .check-btn{padding:8px 24px;border-radius:8px;border:none;background:var(--accent);color:#16220a;font-weight:700;font-size:14px;cursor:pointer}
  .check-btn:disabled{background:#40503a;color:#7d9370;cursor:default}
  .result-text{font-size:15px;font-weight:700;margin-bottom:6px}
  .result-text.correct{color:var(--correct)}
  .result-text.wrong{color:var(--incorrect)}
  .hint-text{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .next-row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .score{font-size:13px;color:var(--muted)}
  .score strong{color:var(--correct)}
  .pedagogy{margin-top:16px;padding:14px 16px;background:#191e15;border-radius:10px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.65}
  .pedagogy strong{color:var(--bright)}
  .section-title{font-size:15px;font-weight:700;color:var(--bright);margin-bottom:8px}
  .section-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .slider-wrap{margin-top:8px}
  .slider-wrap input[type=range]{width:100%;margin-top:6px;accent-color:var(--accent)}
  .readout{margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.8}
  .readout .m{color:var(--muted)}
  .eq{display:block;white-space:nowrap}
  svg{display:block;border-radius:12px;width:100%;height:auto}
</style>
</head>
<body>
<div class="container">
  <span class="chip">THEME E · NUCLEAR &amp; QUANTUM · E3 RADIOACTIVE DECAY</span>
  <h2>Radioactive Decay: the N-Z Board</h2>
  <p class="subtitle">α: lose 2p + 2n. &nbsp; β⁻: n → p (Z up one). &nbsp; β⁺: p → n (Z down one). &nbsp; γ: nothing moves, energy leaves.</p>

  <div class="tabs">
    <button class="tab active" id="tabExplore" onclick="switchMode('explore')">Walk the Board</button>
    <button class="tab" id="tabQuiz" onclick="switchMode('quiz')">Quiz Me</button>
    <button class="tab" id="tabCurve" onclick="switchMode('curve')">Half-Life Curve</button>
  </div>

  <div class="main">
    <div id="svgContainer"></div>
    <div id="controlsContainer"></div>
  </div>
  <div class="pedagogy" id="pedagogy"></div>
</div>

<script>
// ============================================================
// Moves on the N-Z board:
// alpha:  Z-2, N-2 (A-4)     beta-:  Z+1, N-1 (A same)
// beta+:  Z-1, N+1 (A same)  gamma:  no move
// ============================================================

const W=800,H=420;
const SYM=["","H","He","Li","Be","B","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar","K","Ca","Sc","Ti","V","Cr","Mn","Fe","Co","Ni","Cu","Zn","Ga","Ge","As","Se","Br","Kr","Rb","Sr","Y","Zr","Nb","Mo","Tc","Ru","Rh","Pd","Ag","Cd","In","Sn","Sb","Te","I","Xe","Cs","Ba","La","Ce","Pr","Nd","Pm","Sm","Eu","Gd","Tb","Dy","Ho","Er","Tm","Yb","Lu","Hf","Ta","W","Re","Os","Ir","Pt","Au","Hg","Tl","Pb","Bi","Po","At","Rn","Fr","Ra","Ac","Th","Pa","U"];
const MOVES={
  alpha:{dz:-2,dn:-2,label:"α",color:"#fb923c",eq:"emits ⁴₂He"},
  betam:{dz:1,dn:-1,label:"β⁻",color:"#38bdf8",eq:"n → p + e⁻ + ν̄"},
  betap:{dz:-1,dn:1,label:"β⁺",color:"#f472b6",eq:"p → n + e⁺ + ν"},
  gamma:{dz:0,dn:0,label:"γ",color:"#a78bfa",eq:"photon only"}
};
const PRESETS={
  u238:{name:"²³⁸U",Z:92,N:146},
  ra226:{name:"²²⁶Ra",Z:88,N:138},
  c14:{name:"¹⁴C",Z:6,N:8},
  na22:{name:"²²Na",Z:11,N:11}
};

let mode="explore";
let cur={Z:92,N:146};
let trail=[{Z:92,N:146,move:null}];
let lastMove=null;
let quizQ=null,quizGuess=null,quizResult=null;
let score={correct:0,total:0};
let hlT=1.0,hlHalf=4;

function nuclideName(Z,N){
  const sym=SYM[Z]||("Z="+Z);
  return{sym,A:Z+N};
}
function applyMove(k){
  const m=MOVES[k];
  const nz=cur.Z+m.dz,nn=cur.N+m.dn;
  if(nz<1||nn<0)return;
  cur={Z:nz,N:nn};
  lastMove=k;
  trail.push({Z:nz,N:nn,move:k});
  if(trail.length>8)trail.shift();
  render();
}
function setPreset(k){
  cur={Z:PRESETS[k].Z,N:PRESETS[k].N};
  trail=[{Z:cur.Z,N:cur.N,move:null}];
  lastMove=null;
  render();
}
function switchMode(m){
  mode=m;
  document.getElementById("tabExplore").className="tab"+(m==="explore"?" active":"");
  document.getElementById("tabQuiz").className="tab"+(m==="quiz"?" active":"");
  document.getElementById("tabCurve").className="tab"+(m==="curve"?" active":"");
  if(m==="quiz"){score={correct:0,total:0};generateQuiz();}
  render();
}

// ---- board ----
function renderBoard(){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#0e120c;border-radius:12px;display:block">`;
  // window centred on current nuclide
  const n0=cur.N-5,z0=cur.Z-4;
  const cell=42;
  const bx=n=>150+(n-n0)*cell;
  const by=z=>330-(z-z0)*cell;
  // grid
  for(let i=0;i<=10;i++){
    svg+=`<line x1="${bx(n0+i)-cell/2}" y1="${by(z0+8)+cell/2}" x2="${bx(n0+i)-cell/2}" y2="${by(z0)+cell/2}" stroke="#20261c" stroke-width="1"/>`;
  }
  for(let j=0;j<=8;j++){
    svg+=`<line x1="${bx(n0)-cell/2}" y1="${by(z0+j)+cell/2}" x2="${bx(n0+10)-cell/2}" y2="${by(z0+j)+cell/2}" stroke="#20261c" stroke-width="1"/>`;
  }
  svg+=`<text x="${bx(n0+5)}" y="404" fill="#a4bb99" font-size="12" text-anchor="middle">N (neutrons) →</text>`;
  svg+=`<text x="52" y="${by(z0+4)}" fill="#a4bb99" font-size="12">Z ↑</text>`;
  // axis numbers
  for(let i=0;i<10;i+=2)svg+=`<text x="${bx(n0+i)}" y="382" fill="#7d9370" font-size="10" text-anchor="middle">${n0+i}</text>`;
  for(let j=0;j<8;j+=2)svg+=`<text x="${bx(n0)-cell}" y="${by(z0+j)+4}" fill="#7d9370" font-size="10" text-anchor="middle">${z0+j}</text>`;
  // trail
  for(let i=1;i<trail.length;i++){
    const a=trail[i-1],b=trail[i],m=MOVES[b.move];
    if(bx(a.N)>100&&bx(b.N)>100&&bx(a.N)<760&&bx(b.N)<760){
      svg+=`<line x1="${bx(a.N)}" y1="${by(a.Z)}" x2="${bx(b.N)}" y2="${by(b.Z)}" stroke="${m.color}" stroke-width="2.5" opacity="0.8"/>`;
      svg+=`<circle cx="${bx(a.N)}" cy="${by(a.Z)}" r="6" fill="${m.color}" opacity="0.5"/>`;
      svg+=`<text x="${(bx(a.N)+bx(b.N))/2+10}" y="${(by(a.Z)+by(b.Z))/2-6}" fill="${m.color}" font-size="12" font-weight="700">${m.label}</text>`;
    }
  }
  // current nuclide
  const nm=nuclideName(cur.Z,cur.N);
  svg+=`<circle cx="${bx(cur.N)}" cy="${by(cur.Z)}" r="15" fill="#bef264"/>`;
  svg+=`<text x="${bx(cur.N)}" y="${by(cur.Z)+4}" fill="#16220a" font-size="10" font-weight="700" text-anchor="middle">${nm.sym}</text>`;
  svg+=`<text x="${bx(cur.N)}" y="${by(cur.Z)-24}" fill="#f5faf2" font-size="13" font-weight="700" text-anchor="middle">${nm.sym}-${nm.A} (Z=${cur.Z}, N=${cur.N})</text>`;
  return svg+"</svg>";
}
function exploreReadout(){
  const nm=nuclideName(cur.Z,cur.N);
  let eq="";
  if(lastMove){
    const prev=trail[trail.length-2];
    const pn=nuclideName(prev.Z,prev.N);
    const m=MOVES[lastMove];
    eq=`<span class="eq"><span class="m">Last step:</span> <strong>${pn.sym}-${pn.A} → ${nm.sym}-${nm.A}</strong> <span class="m">(${m.label}: ${m.eq})</span></span>
    <span class="eq"><span class="m">Bookkeeping: A ${m.dz+m.dn===0?"unchanged":(m.dz+m.dn>0?"+":"")+(m.dz+m.dn===-4||m.dz+m.dn===0?m.dz+m.dn:m.dz+m.dn)}, Z ${m.dz>=0?"+"+m.dz:m.dz}: both sides of the equation must balance.</span></span>`;
  }
  return`<span class="eq"><span class="m">Current nuclide:</span> <strong>${nm.sym}-${nm.A}</strong> <span class="m">(Z = ${cur.Z} protons, N = ${cur.N} neutrons)</span></span>${eq}`;
}

// ---- quiz ----
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const QUIZ_PARENTS=[{Z:92,N:146},{Z:88,N:138},{Z:90,N:144},{Z:84,N:126},{Z:6,N:8},{Z:19,N:21},{Z:11,N:11},{Z:83,N:127}];
function nucStr(Z,N){const n=nuclideName(Z,N);return n.sym+"-"+n.A+" (Z="+Z+")";}
function generateQuiz(){
  const roll=Math.random();
  if(roll<0.45){
    // daughter identification
    const p=pick(QUIZ_PARENTS);
    const mk=pick(["alpha","betam","betap"]);
    const m=MOVES[mk];
    const dZ=p.Z+m.dz,dN=p.N+m.dn;
    const correct=nucStr(dZ,dN);
    const wrongs=mk==="alpha"?[nucStr(p.Z-2,p.N-2+0)+""===correct?nucStr(p.Z-4,p.N):nucStr(p.Z+2,p.N-6),nucStr(p.Z-2,p.N),nucStr(p.Z-1,p.N-3)]
      :mk==="betam"?[nucStr(p.Z-1,p.N+1),nucStr(p.Z+1,p.N),nucStr(p.Z,p.N-1)]
      :[nucStr(p.Z+1,p.N-1),nucStr(p.Z-1,p.N),nucStr(p.Z,p.N+1)];
    const opts=[...new Set([correct,...wrongs])].slice(0,4);
    quizQ={type:"daughter",answer:correct,options:shuffle(opts),
      prompt:nucStr(p.Z,p.N)+" undergoes "+m.label+" decay. What is the daughter nuclide?",
      hint:mk==="alpha"?"α removes 2 protons and 2 neutrons: A drops by 4, Z by 2."
      :mk==="betam"?"β⁻: a neutron becomes a proton, so Z goes UP by one and A stays the same. The emitted electron leaving does not lower Z: that is the classic charge bookkeeping error."
      :"β⁺: a proton becomes a neutron, so Z goes DOWN by one and A stays the same."};
  }else if(roll<0.75){
    // identify the emission
    const p=pick(QUIZ_PARENTS);
    const mk=pick(["alpha","betam","betap","gamma"]);
    const m=MOVES[mk];
    quizQ={type:"emission",answer:m.label,options:["α","β⁻","β⁺","γ"],
      prompt:nucStr(p.Z,p.N)+" decays to "+nucStr(p.Z+m.dz,p.N+m.dn)+(mk==="gamma"?" with only a photon emitted":"")+". What was emitted?",
      hint:"Compare A and Z across the arrow: A down 4 and Z down 2 is α; A same and Z up 1 is β⁻; A same and Z down 1 is β⁺; nothing moves for γ."};
  }else{
    // half-life numeric
    const T=pick([3,5,8]);
    const n=pick([2,3,4]);
    const frac=Math.pow(2,n);
    const opts=[...new Set(["1/"+frac,"1/"+(2*n),"1/"+(frac*2),"1/"+(n*n)])].slice(0,4);
    quizQ={type:"half",answer:"1/"+frac,options:shuffle(opts),
      prompt:"A nuclide has half-life "+T+" days. What fraction of the original sample remains after "+(n*T)+" days?",
      hint:(n*T)+" days is "+n+" half-lives: halve "+n+" times, giving (1/2)^"+n+" = 1/"+frac+". Dividing by 2n instead of halving n times is the classic slip."};
  }
  quizGuess=null;quizResult=null;
}
function selectGuess(k){if(!quizResult){quizGuess=k;render();}}
function checkAnswer(){
  if(!quizGuess||!quizQ)return;
  const ok=quizGuess===quizQ.answer;
  quizResult=ok?"correct":"incorrect";
  score.total++;if(ok)score.correct++;
  render();
}
function nextQuestion(){generateQuiz();render();}

// ---- half-life curve ----
function renderCurveScene(){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#0e120c;border-radius:12px;display:block">`;
  const gx=100,gy=44,gw=620,gh=300;
  const TW=4; // half-lives shown
  const px=t=>gx+t/(TW*hlHalf)*gw;
  const py=f=>gy+gh-f*gh;
  svg+=`<line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy+gh}" stroke="#40503a" stroke-width="1.5"/>`;
  svg+=`<line x1="${gx}" y1="${gy+gh}" x2="${gx+gw}" y2="${gy+gh}" stroke="#40503a" stroke-width="1.5"/>`;
  svg+=`<text x="${gx+gw/2}" y="${gy+gh+34}" fill="#a4bb99" text-anchor="middle" font-size="12">time (days)</text>`;
  svg+=`<text x="${gx-10}" y="${gy-12}" fill="#a4bb99" font-size="12">fraction remaining</text>`;
  // gridlines at 1/2,1/4,1/8
  [[0.5,"1/2"],[0.25,"1/4"],[0.125,"1/8"],[0.0625,"1/16"]].forEach(([f,lab])=>{
    svg+=`<line x1="${gx}" y1="${py(f)}" x2="${gx+gw}" y2="${py(f)}" stroke="#20261c" stroke-width="1" stroke-dasharray="4,4"/>`;
    svg+=`<text x="${gx-8}" y="${py(f)+4}" fill="#7d9370" text-anchor="end" font-size="10">${lab}</text>`;
  });
  svg+=`<text x="${gx-8}" y="${py(1)+4}" fill="#7d9370" text-anchor="end" font-size="10">1</text>`;
  for(let k=0;k<=TW;k++){
    svg+=`<line x1="${px(k*hlHalf)}" y1="${gy+gh}" x2="${px(k*hlHalf)}" y2="${gy+gh+5}" stroke="#40503a"/>`;
    svg+=`<text x="${px(k*hlHalf)}" y="${gy+gh+18}" fill="#7d9370" text-anchor="middle" font-size="10">${k*hlHalf}</text>`;
  }
  // curve
  let d="";
  for(let i=0;i<=300;i++){
    const t=i/300*TW*hlHalf;
    d+=(i===0?"M":"L")+px(t).toFixed(1)+","+py(Math.pow(0.5,t/hlHalf)).toFixed(1);
  }
  svg+=`<path d="${d}" fill="none" stroke="#bef264" stroke-width="2.5"/>`;
  // marker
  const t=hlT*hlHalf;
  const f=Math.pow(0.5,hlT);
  svg+=`<line x1="${px(t)}" y1="${gy+gh}" x2="${px(t)}" y2="${py(f)}" stroke="#65a30d" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  svg+=`<line x1="${gx}" y1="${py(f)}" x2="${px(t)}" y2="${py(f)}" stroke="#65a30d" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  svg+=`<circle cx="${px(t)}" cy="${py(f)}" r="6" fill="#bef264"/>`;
  return svg+"</svg>";
}
function curveReadoutHtml(){
  const f=Math.pow(0.5,hlT);
  return`<span class="eq"><span class="m">t =</span> <strong>${(hlT*hlHalf).toFixed(1)} days</strong> <span class="m">= ${hlT.toFixed(2)} half-lives</span></span>
  <span class="eq"><span class="m">fraction remaining = (1/2)^${hlT.toFixed(2)} =</span> <strong>${(f*100).toFixed(1)}%</strong></span>
  <span class="eq"><span class="m">fraction decayed =</span> <strong>${((1-f)*100).toFixed(1)}%</strong> <span class="m">(a favourite twist: they ask for the decayed part)</span></span>`;
}
function setHlT(v){
  hlT=Number(v);
  document.getElementById("svgContainer").innerHTML=renderCurveScene();
  document.getElementById("hlReadout").innerHTML=curveReadoutHtml();
  document.getElementById("hlLabel").textContent=(hlT*hlHalf).toFixed(1)+" days";
}
function setHlHalf(v){hlHalf=v;render();}

// ---- main render ----
function render(){
  const svgEl=document.getElementById("svgContainer");
  const ctrlEl=document.getElementById("controlsContainer");
  const pedEl=document.getElementById("pedagogy");

  if(mode==="explore"){
    svgEl.innerHTML=renderBoard();
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="section-desc">Every decay is a move on this board. Pick a starting nuclide, then walk a chain and watch the bookkeeping: α moves diagonally down-left by two; the betas slide along the same diagonal of constant A.</p>
        <div class="label">Start from</div>
        <div class="btn-group" style="margin-bottom:10px">
          ${Object.keys(PRESETS).map(k=>`<button class="dir-btn" onclick="setPreset('${k}')">${PRESETS[k].name}</button>`).join("")}
        </div>
        <div class="label">Apply a decay</div>
        <div class="btn-group">
          <button class="dir-btn" style="border-color:var(--alpha);color:var(--alpha)" onclick="applyMove('alpha')">α</button>
          <button class="dir-btn" style="border-color:var(--betam);color:var(--betam)" onclick="applyMove('betam')">β⁻</button>
          <button class="dir-btn" style="border-color:var(--betap);color:var(--betap)" onclick="applyMove('betap')">β⁺</button>
          <button class="dir-btn" style="border-color:var(--gam);color:var(--gam)" onclick="applyMove('gamma')">γ</button>
        </div>
        <div class="readout">${exploreReadout()}</div>
      </div>`;
    pedEl.innerHTML=`<strong>The β⁻ trap, once and for all:</strong> the nucleus emits an electron, and the proton number goes <em>up</em>. A neutron has turned into a proton; the departing electron carries away the balancing negative charge. Check any equation both ways: top numbers (A) must sum equally, bottom numbers (Z) must sum equally, counting the electron as −1 at the bottom.
    <br><br><strong>Note the diagonals:</strong> both betas move along a line of constant A. Real decay chains (try ²³⁸U: α, then β⁻, β⁻, then α...) zigzag down the board toward stability.`;

  } else if(mode==="quiz"){
    if(!quizQ)generateQuiz();
    svgEl.innerHTML=renderBoard();
    let optsHtml=quizQ.options.map(k=>{
      let cls="opt-btn";
      if(quizResult)cls+=" locked";
      if(quizGuess===k&&!quizResult)cls+=" selected";
      if(quizGuess===k&&quizResult==="correct")cls+=" correct";
      if(quizGuess===k&&quizResult==="incorrect")cls+=" wrong";
      return`<button class="${cls}" onclick="selectGuess('${k}')">${k}</button>`;
    }).join("");
    let resultHtml="";
    if(quizResult){
      if(quizResult==="correct")resultHtml=`<div class="result-text correct">Correct!</div>`;
      else resultHtml=`<div class="result-text wrong">Not quite — the answer is ${quizQ.answer}</div><p class="hint-text">${quizQ.hint}</p>`;
      resultHtml+=`<div class="next-row">
        <button class="check-btn" onclick="nextQuestion()">Next Question</button>
        <span class="score">Score: <strong>${score.correct}</strong> / ${score.total}</span>
      </div>`;
    }
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="quiz-prompt">${quizQ.prompt}</p>
        <div class="quiz-opts">${optsHtml}</div>
        ${!quizResult?`<button class="check-btn" ${!quizGuess?'disabled':''} onclick="checkAnswer()">Check Answer</button>`:''}
        ${resultHtml}
      </div>`;
    pedEl.innerHTML=`<strong>Method:</strong> for daughter questions, apply the move (α: A−4, Z−2; β⁻: Z+1; β⁺: Z−1) and only then look up the symbol. For "what was emitted", difference the two sides. For half-life fractions, count half-lives first, then halve that many times: never divide by the number of half-lives.`;

  } else {
    svgEl.innerHTML=renderCurveScene();
    ctrlEl.innerHTML=`
      <div class="controls">
        <div class="section-title">Exponential decay</div>
        <p class="section-desc">Slide time along the curve. Every half-life, whatever is left halves again: the curve never reaches zero, and equal time steps always cut the same fraction.</p>
        <div class="label">half-life</div>
        <div class="btn-group" style="margin-bottom:8px">${[2,4,8].map(v=>`<button class="dir-btn${v===hlHalf?' active':''}" onclick="setHlHalf(${v})">${v} days</button>`).join("")}</div>
        <div class="slider-wrap">
          <label class="label">time: <span id="hlLabel" style="color:var(--bright);font-size:15px">${(hlT*hlHalf).toFixed(1)} days</span></label>
          <input type="range" min="0" max="4" step="0.05" value="${hlT}" oninput="setHlT(this.value)">
        </div>
        <div class="readout" id="hlReadout">${curveReadoutHtml()}</div>
      </div>`;
    pedEl.innerHTML=`<strong>Reading half-life graphs:</strong> find where the curve crosses one half; that time is T½ regardless of where you start, which is the defining property of exponential decay. Activity (counts per second) follows the same curve as the number of nuclei, so the same halving logic answers both kinds of question.`;
  }
}

render();
</script>
</body>
</html>
