<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transverse Wave: Snapshot vs History</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0b1a12;--panel:#11291d;--border:#204933;--text:#ddf0e5;--muted:#8fbaa3;--bright:#f0fbf5;--wave:#34d399;--particle:#fbbf24;--vel:#f59e0b;--correct:#34d399;--incorrect:#f87171;--accent:#10b981;--accentBg:#0a3d2a;--accentTxt:#6ee7b7}
  body{font-family:'IBM Plex Sans','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:22px 18px;min-height:100vh}
  .container{max-width:1150px;margin:0 auto}
  .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.05em;padding:3px 10px;border-radius:6px;background:var(--accentBg);color:var(--accentTxt);margin-bottom:8px}
  h2{font-size:22px;font-weight:700;color:var(--bright);margin-bottom:4px}
  .subtitle{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .subtitle strong,.subtitle em{color:var(--text)}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .tab.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .tab:hover{border-color:#2f6a4a}
  .main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
  .controls{background:var(--panel);border-radius:12px;padding:16px;border:1px solid var(--border)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
  .btn-group{display:flex;flex-wrap:wrap;gap:4px}
  .dir-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .dir-btn.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .dir-btn:hover{border-color:#2f6a4a}
  .quiz-info{font-size:14px;margin-bottom:6px}
  .quiz-prompt{font-size:14px;font-weight:600;margin-bottom:10px}
  .quiz-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .opt-btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;min-width:100px;text-align:center;transition:all .15s}
  .opt-btn.selected{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .opt-btn.correct{border-color:var(--correct);background:#064e3b;color:var(--correct);font-weight:700}
  .opt-btn.wrong{border-color:var(--incorrect);background:#7f1d1d;color:var(--incorrect);font-weight:700}
  .opt-btn.locked{cursor:default}
  .check-btn{padding:8px 24px;border-radius:8px;border:none;background:var(--accent);color:#02271a;font-weight:700;font-size:14px;cursor:pointer}
  .check-btn:disabled{background:#204933;color:#5c8a72;cursor:default}
  .result-text{font-size:15px;font-weight:700;margin-bottom:6px}
  .result-text.correct{color:var(--correct)}
  .result-text.wrong{color:var(--incorrect)}
  .hint-text{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .next-row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .score{font-size:13px;color:var(--muted)}
  .score strong{color:var(--correct)}
  .pedagogy{margin-top:16px;padding:14px 16px;background:#0e2216;border-radius:10px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.65}
  .pedagogy strong{color:var(--bright)}
  .section-title{font-size:15px;font-weight:700;color:var(--bright);margin-bottom:8px}
  .section-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .slider-wrap{margin-top:8px}
  .slider-wrap input[type=range]{width:100%;margin-top:6px;accent-color:var(--accent)}
  .readout{margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.8}
  .readout .m{color:var(--muted)}
  .eq{display:block;white-space:nowrap}
  svg{display:block;border-radius:12px;width:100%;height:auto}
</style>
</head>
<body>
<div class="container">
  <span class="chip">THEME C · WAVE BEHAVIOUR · C2 WAVE MODEL</span>
  <h2>Transverse Wave: Snapshot vs History</h2>
  <p class="subtitle">The wave pattern travels; each particle only moves up and down. &nbsp;|&nbsp; <strong>v</strong> = <em>f</em>λ = λ/<em>T</em></p>

  <div class="tabs">
    <button class="tab active" id="tabExplore" onclick="switchMode('explore')">Watch the Wave</button>
    <button class="tab" id="tabQuiz" onclick="switchMode('quiz')">Quiz Me</button>
    <button class="tab" id="tabTwo" onclick="switchMode('two')">Snapshot vs History</button>
  </div>

  <div class="main">
    <div id="svgContainer"></div>
    <div id="controlsContainer"></div>
  </div>
  <div class="pedagogy" id="pedagogy"></div>
</div>

<script>
// ============================================================
// Travelling wave y(x,t) = A sin(kx -/+ wt), rightward = minus.
// Particle velocity: vy = dy/dt = -v_wave * (dy/dx) for rightward.
// Snapshot: y against x at fixed t. History: y against t at fixed x.
// ============================================================

const W=800,H=420;
const TWO_PI=2*Math.PI;

let mode="explore";
let dirn=1;            // +1 wave moves right, -1 left
let paused=false;
let simT=0,lastTs=null,rafId=null;
let quizQ=null,quizGuess=null,quizResult=null;
let score={correct:0,total:0};
let twoT=0.6;          // time in the snapshot-vs-history tab (in periods-ish seconds)

// explore wave parameters (fixed): lambda 4 m, T 2 s, v 2 m/s
const LAM=4,PER=2,AMP=1;
const PX_PER_M=85,X0=40,YMID=190,YSCALE=95;
const xToPx=x=>X0+x*PX_PER_M;
const yToPx=y=>YMID-y*YSCALE;
function yWave(x,t,d){return AMP*Math.sin(TWO_PI*(x/LAM-(d===undefined?dirn:d)*t/PER));}
function vyWave(x,t,d){ // numeric dy/dt
  const dd=(d===undefined?dirn:d);
  return(yWave(x,t+0.001,dd)-yWave(x,t-0.001,dd))/0.002;
}

function switchMode(m){
  mode=m;
  document.getElementById("tabExplore").className="tab"+(m==="explore"?" active":"");
  document.getElementById("tabQuiz").className="tab"+(m==="quiz"?" active":"");
  document.getElementById("tabTwo").className="tab"+(m==="two"?" active":"");
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  lastTs=null;
  if(m==="quiz"){score={correct:0,total:0};generateQuiz();}
  render();
  if(m==="explore")rafId=requestAnimationFrame(tick);
}
function setDirn(d){dirn=d;render();}
function togglePause(){paused=!paused;renderExploreControls();}

function tick(ts){
  if(mode!=="explore"){rafId=null;return;}
  if(lastTs===null)lastTs=ts;
  const dt=Math.min(0.05,(ts-lastTs)/1000);
  lastTs=ts;
  if(!paused)simT+=dt;
  document.getElementById("svgContainer").innerHTML=renderExploreScene(simT);
  rafId=requestAnimationFrame(tick);
}

// ---- svg helpers ----
function arrow(x1,y1,x2,y2,color,sw,op){
  sw=sw||2.5;op=op===undefined?1:op;
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
  if(len<2)return"";
  const ux=dx/len,uy=dy/len,h=Math.min(12,len*0.45),hw=h*0.45;
  const bx=x2-ux*h,by=y2-uy*h;
  return`<g opacity="${op}"><line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${color}" stroke-width="${sw}"/><polygon points="${x2},${y2} ${bx-uy*hw},${by+ux*hw} ${bx+uy*hw},${by-ux*hw}" fill="${color}"/></g>`;
}
function wavePath(t,d,x0px,x1px,ymid,ysc,color,sw,op){
  op=op===undefined?1:op;
  let path="";
  for(let px=x0px;px<=x1px;px+=4){
    const x=(px-X0)/PX_PER_M;
    const y=ymid-yWave(x,t,d)*ysc;
    path+=(px===x0px?"M":"L")+px+","+y.toFixed(1);
  }
  return`<path d="${path}" fill="none" stroke="${color}" stroke-width="${sw}" opacity="${op}"/>`;
}

// ---- explore scene ----
const PX=4.0; // marked particle P at x = 4 m
function renderExploreScene(t){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#08130d;border-radius:12px;display:block">`;
  // axis and metre grid
  svg+=`<line x1="${X0}" y1="${YMID}" x2="${W-30}" y2="${YMID}" stroke="#2a5b40" stroke-width="1" opacity="0.7"/>`;
  for(let x=0;x<=8;x++){
    svg+=`<line x1="${xToPx(x)}" y1="${YMID-4}" x2="${xToPx(x)}" y2="${YMID+4}" stroke="#2a5b40" stroke-width="1"/>`;
    svg+=`<text x="${xToPx(x)}" y="${YMID+20}" fill="#5c8a72" text-anchor="middle" font-size="10">${x}</text>`;
  }
  svg+=`<text x="${W-28}" y="${YMID+20}" fill="#5c8a72" font-size="10">x (m)</text>`;
  // faint ghost of the wave a moment ago, to show the pattern sliding
  svg+=wavePath(t-0.18,dirn,X0,W-30,YMID,YSCALE,"#34d399",2,0.18);
  svg+=wavePath(t,dirn,X0,W-30,YMID,YSCALE,"#34d399",3,0.95);
  // wave direction arrow
  const ax=dirn>0?W/2-60:W/2+60;
  svg+=arrow(ax,46,ax+dirn*120,46,"#6ee7b7",3);
  svg+=`<text x="${W/2}" y="${30}" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">wave moves ${dirn>0?"→":"←"} at v = λ/T = 2 m s⁻¹</text>`;
  // marked particle P with velocity arrow
  const py=yToPx(yWave(PX,t));
  const vy=vyWave(PX,t);
  svg+=`<line x1="${xToPx(PX)}" y1="${YMID-YSCALE-14}" x2="${xToPx(PX)}" y2="${YMID+YSCALE+14}" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,4" opacity="0.4"/>`;
  if(Math.abs(vy)>0.25)svg+=arrow(xToPx(PX),py,xToPx(PX),py-vy*26,"#f59e0b",3);
  svg+=`<circle cx="${xToPx(PX)}" cy="${py}" r="8" fill="#fbbf24"/>`;
  svg+=`<text x="${xToPx(PX)+14}" y="${py+4}" fill="#fbbf24" font-size="13" font-weight="700">P</text>`;
  svg+=`<text x="${X0}" y="${H-18}" fill="#8fbaa3" font-size="11">P never travels along x: it oscillates on its dashed line while the pattern slides past.</text>`;
  svg+=`</svg>`;
  return svg;
}
function renderExploreControls(){
  document.getElementById("controlsContainer").innerHTML=`
    <div class="controls">
      <p class="section-desc">The green curve is the wave <em>pattern</em>, travelling at steady speed. The gold dot P is one particle of the medium. Watch what P actually does; pause the wave mid-flight and predict P's next move before releasing it.</p>
      <div class="grid2">
        <div>
          <label class="label">Wave direction</label>
          <div class="btn-group">
            <button class="dir-btn${dirn>0?' active':''}" onclick="setDirn(1)">→ right</button>
            <button class="dir-btn${dirn<0?' active':''}" onclick="setDirn(-1)">← left</button>
          </div>
        </div>
        <div>
          <label class="label">Motion</label>
          <div class="btn-group">
            <button class="dir-btn${paused?' active':''}" onclick="togglePause()">${paused?"▶ play":"⏸ pause"}</button>
          </div>
        </div>
      </div>
      <div class="readout">
        <span class="eq"><span class="m">λ =</span> <strong>4 m</strong> <span class="m" style="margin-left:10px">T =</span> <strong>2 s</strong> <span class="m" style="margin-left:10px">v = λ/T =</span> <strong>2 m s⁻¹</strong></span>
        <span class="eq"><span class="m">The orange arrow is P's velocity: vertical, always.</span></span>
      </div>
    </div>`;
}

// ---- quiz ----
function fmtNum(x){return Number.isInteger(x)?String(x):String(Number(x.toFixed(2)));}
function generateQuiz(){
  if(Math.random()<0.5){
    // which way does P move next
    const d=Math.random()<0.5?1:-1;
    const phaseIdx=Math.floor(Math.random()*16);
    const t0=phaseIdx/16*PER;
    const vy=vyWave(PX,t0,d);
    let ans;
    if(Math.abs(vy)<0.15)ans="momentarily at rest";
    else ans=vy>0?"upwards":"downwards";
    quizQ={type:"motion",d,t0,answer:ans,options:["upwards","downwards","momentarily at rest"],
      prompt:"The snapshot shows a wave moving "+(d>0?"to the right":"to the left")+". Which way does particle P move next?",
      hint:"Slide the whole pattern a little in the wave's direction and see where P's piece of curve goes. P at a crest or trough is momentarily at rest. Equivalently: for a rightward wave, P copies what its left-hand neighbour is doing now."};
  }else{
    // read the right graph
    const lams=[2,4,6,8],pers=[0.5,1,2,4];
    const lam=lams[Math.floor(Math.random()*lams.length)];
    let per;
    do{per=pers[Math.floor(Math.random()*pers.length)];}while(per===lam);
    const kind=["wavelength","period","speed"][Math.floor(Math.random()*3)];
    let answer,options,prompt,hint;
    if(kind==="wavelength"){
      answer=lam+" m";
      options=[...new Set([lam,per,lam/2,2*lam])].slice(0,4).map(x=>fmtNum(x)+" m");
      prompt="Using the two graphs, what is the wavelength of the wave?";
      hint="Wavelength lives on the snapshot: it is the repeat distance on the x axis, in metres. The repeat on the time axis is the period, "+fmtNum(per)+" s: reading it as wavelength is the classic graph swap.";
    }else if(kind==="period"){
      answer=fmtNum(per)+" s";
      options=[...new Set([per,lam,per/2,2*per])].slice(0,4).map(x=>fmtNum(x)+" s");
      prompt="Using the two graphs, what is the period of the wave?";
      hint="Period lives on the history graph: the repeat time on the t axis, in seconds. The repeat on the position axis is the wavelength, "+fmtNum(lam)+" m: reading it as period is the classic graph swap.";
    }else{
      const v=lam/per;
      answer=fmtNum(v)+" m s⁻¹";
      options=[...new Set([v,per/lam,lam*per,lam])].slice(0,4).map(x=>fmtNum(x)+" m s⁻¹");
      prompt="Using the two graphs, what is the speed of the wave?";
      hint="v = λ/T. Read λ = "+fmtNum(lam)+" m from the snapshot and T = "+fmtNum(per)+" s from the history, then divide that way round: T/λ gives the upside-down ratio.";
    }
    for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]];}
    quizQ={type:"graphs",lam,per,answer,options,prompt,hint};
  }
  quizGuess=null;quizResult=null;
}
function selectGuess(k){if(!quizResult){quizGuess=k;render();}}
function checkAnswer(){
  if(!quizGuess||!quizQ)return;
  const ok=quizGuess===quizQ.answer;
  quizResult=ok?"correct":"incorrect";
  score.total++;if(ok)score.correct++;
  render();
}
function nextQuestion(){generateQuiz();render();}

function renderQuizScene(){
  if(quizQ.type==="motion"){
    let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#08130d;border-radius:12px;display:block">`;
    svg+=`<line x1="${X0}" y1="${YMID}" x2="${W-30}" y2="${YMID}" stroke="#2a5b40" stroke-width="1" opacity="0.7"/>`;
    svg+=wavePath(quizQ.t0,quizQ.d,X0,W-30,YMID,YSCALE,"#34d399",3,0.95);
    const ax=quizQ.d>0?W/2-60:W/2+60;
    svg+=arrow(ax,46,ax+quizQ.d*120,46,"#6ee7b7",3);
    svg+=`<text x="${W/2}" y="30" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">wave moves ${quizQ.d>0?"→":"←"}</text>`;
    const py=yToPx(yWave(PX,quizQ.t0,quizQ.d));
    svg+=`<circle cx="${xToPx(PX)}" cy="${py}" r="8" fill="#fbbf24"/>`;
    svg+=`<text x="${xToPx(PX)+14}" y="${py+4}" fill="#fbbf24" font-size="13" font-weight="700">P</text>`;
    if(quizResult){
      const vy=vyWave(PX,quizQ.t0,quizQ.d);
      if(Math.abs(vy)>=0.15)svg+=arrow(xToPx(PX),py,xToPx(PX),py-Math.sign(vy)*46,"#f59e0b",3.5);
      svg+=wavePath(quizQ.t0+0.16,quizQ.d,X0,W-30,YMID,YSCALE,"#6ee7b7",2,0.35);
      svg+=`<text x="${X0}" y="${H-18}" fill="#8fbaa3" font-size="11">Pale curve: the wave a moment later. P rides its dashed vertical line onto it.</text>`;
    }
    svg+=`</svg>`;
    return svg;
  }
  // two labelled graphs, numbers on axes
  const lam=quizQ.lam,per=quizQ.per;
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#08130d;border-radius:12px;display:block">`;
  function panel(x0,title,axis,repeat,maxAx,color){
    const w=330,h=230,y0=110;
    let s=`<text x="${x0+w/2}" y="60" fill="#ddf0e5" font-size="13" font-weight="700" text-anchor="middle">${title}</text>`;
    s+=`<text x="${x0+w/2}" y="80" fill="#8fbaa3" font-size="11" text-anchor="middle">${axis==="x"?"displacement against position, one instant":"displacement against time, one particle"}</text>`;
    s+=`<line x1="${x0}" y1="${y0+h/2}" x2="${x0+w}" y2="${y0+h/2}" stroke="#2a5b40" stroke-width="1"/>`;
    s+=`<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0+h}" stroke="#2a5b40" stroke-width="1"/>`;
    let path="";
    for(let i=0;i<=200;i++){
      const u=i/200*maxAx;
      const yv=Math.sin(TWO_PI*u/repeat);
      path+=(i===0?"M":"L")+(x0+i/200*w)+","+(y0+h/2-yv*h*0.42).toFixed(1);
    }
    s+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
    for(let u=0;u<=maxAx;u+=(maxAx>4?2:1)){
      const px=x0+u/maxAx*w;
      s+=`<line x1="${px}" y1="${y0+h/2-4}" x2="${px}" y2="${y0+h/2+4}" stroke="#2a5b40"/>`;
      s+=`<text x="${px}" y="${y0+h/2+18}" fill="#5c8a72" text-anchor="middle" font-size="10">${fmtNum(u)}</text>`;
    }
    s+=`<text x="${x0+w+4}" y="${y0+h/2+18}" fill="#5c8a72" font-size="10">${axis==="x"?"x (m)":"t (s)"}</text>`;
    return s;
  }
  const maxX=Math.max(2*lam,8),maxT=Math.max(2*per,2);
  svg+=panel(60,"SNAPSHOT","x",lam,maxX,"#34d399");
  svg+=panel(440,"HISTORY of particle P","t",per,maxT,"#fbbf24");
  svg+=`</svg>`;
  return svg;
}

// ---- snapshot vs history tab ----
function renderTwoScene(t){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#08130d;border-radius:12px;display:block">`;
  const w=330,h=240,y0=100,gL=60,gR=440;
  // left: snapshot at time t
  svg+=`<text x="${gL+w/2}" y="52" fill="#ddf0e5" font-size="13" font-weight="700" text-anchor="middle">SNAPSHOT at t = ${t.toFixed(2)} s</text>`;
  svg+=`<text x="${gL+w/2}" y="72" fill="#8fbaa3" font-size="11" text-anchor="middle">y against x: the whole string, one instant</text>`;
  svg+=`<line x1="${gL}" y1="${y0+h/2}" x2="${gL+w}" y2="${y0+h/2}" stroke="#2a5b40" stroke-width="1"/>`;
  let path="";
  for(let i=0;i<=200;i++){
    const x=i/200*8;
    path+=(i===0?"M":"L")+(gL+i/200*w)+","+(y0+h/2-yWave(x,t)*h*0.4).toFixed(1);
  }
  svg+=`<path d="${path}" fill="none" stroke="#34d399" stroke-width="2.5"/>`;
  const pPx=gL+PX/8*w,pPy=y0+h/2-yWave(PX,t)*h*0.4;
  svg+=`<line x1="${pPx}" y1="${y0}" x2="${pPx}" y2="${y0+h}" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,4" opacity="0.4"/>`;
  svg+=`<circle cx="${pPx}" cy="${pPy}" r="7" fill="#fbbf24"/>`;
  svg+=`<text x="${pPx+12}" y="${pPy+4}" fill="#fbbf24" font-size="12" font-weight="700">P</text>`;
  svg+=`<text x="${gL+w+4}" y="${y0+h/2+16}" fill="#5c8a72" font-size="10">x (m)</text>`;
  // right: history of P up to time t
  const TMAX=4;
  svg+=`<text x="${gR+w/2}" y="52" fill="#ddf0e5" font-size="13" font-weight="700" text-anchor="middle">HISTORY of P up to t = ${t.toFixed(2)} s</text>`;
  svg+=`<text x="${gR+w/2}" y="72" fill="#8fbaa3" font-size="11" text-anchor="middle">y against t: one particle, all times so far</text>`;
  svg+=`<line x1="${gR}" y1="${y0+h/2}" x2="${gR+w}" y2="${y0+h/2}" stroke="#2a5b40" stroke-width="1"/>`;
  path="";
  const steps=Math.max(2,Math.floor(200*t/TMAX));
  for(let i=0;i<=steps;i++){
    const tt=i/200*TMAX;
    path+=(i===0?"M":"L")+(gR+i/200*w)+","+(y0+h/2-yWave(PX,tt)*h*0.4).toFixed(1);
  }
  svg+=`<path d="${path}" fill="none" stroke="#fbbf24" stroke-width="2.5"/>`;
  const hPx=gR+t/TMAX*w,hPy=y0+h/2-yWave(PX,t)*h*0.4;
  svg+=`<circle cx="${hPx}" cy="${hPy}" r="7" fill="#fbbf24"/>`;
  svg+=`<text x="${gR+w+4}" y="${y0+h/2+16}" fill="#5c8a72" font-size="10">t (s)</text>`;
  for(let u=0;u<=TMAX;u++){
    const px=gR+u/TMAX*w;
    svg+=`<line x1="${px}" y1="${y0+h/2-4}" x2="${px}" y2="${y0+h/2+4}" stroke="#2a5b40"/>`;
    svg+=`<text x="${px}" y="${y0+h/2+18}" fill="#5c8a72" text-anchor="middle" font-size="10">${u}</text>`;
  }
  svg+=`<text x="${W/2}" y="${H-16}" fill="#8fbaa3" font-size="11" text-anchor="middle">Same wave, two completely different graphs: repeat distance λ on the left, repeat time T on the right.</text>`;
  svg+=`</svg>`;
  return svg;
}
function setTwoT(v){
  twoT=Number(v);
  document.getElementById("svgContainer").innerHTML=renderTwoScene(twoT);
  document.getElementById("twoLabel").textContent=twoT.toFixed(2)+" s";
}

// ---- main render ----
function render(){
  const svgEl=document.getElementById("svgContainer");
  const ctrlEl=document.getElementById("controlsContainer");
  const pedEl=document.getElementById("pedagogy");

  if(mode==="explore"){
    svgEl.innerHTML=renderExploreScene(simT);
    renderExploreControls();
    pedEl.innerHTML=`<strong>The one idea this sim exists for:</strong> the wave moves; the particles do not travel with it. Energy and pattern go sideways, each bit of the medium only oscillates across the motion. When a question asks about "the speed of the wave" it means the pattern speed v = fλ; when it asks how a <em>point on the string</em> moves, the answer is always up and down.
    <br><br><strong>Reading trick for exams:</strong> to find which way a particle moves next, nudge the whole pattern slightly in the wave's direction of travel and see where the particle's position on the curve goes.`;

  } else if(mode==="quiz"){
    if(!quizQ)generateQuiz();
    svgEl.innerHTML=renderQuizScene();
    let optsHtml=quizQ.options.map(k=>{
      let cls="opt-btn";
      if(quizResult)cls+=" locked";
      if(quizGuess===k&&!quizResult)cls+=" selected";
      if(quizGuess===k&&quizResult==="correct")cls+=" correct";
      if(quizGuess===k&&quizResult==="incorrect")cls+=" wrong";
      return`<button class="${cls}" onclick="selectGuess('${k}')">${k}</button>`;
    }).join("");
    let resultHtml="";
    if(quizResult){
      if(quizResult==="correct")resultHtml=`<div class="result-text correct">Correct!</div>`;
      else resultHtml=`<div class="result-text wrong">Not quite — the answer is ${quizQ.answer}</div><p class="hint-text">${quizQ.hint}</p>`;
      resultHtml+=`<div class="next-row">
        <button class="check-btn" onclick="nextQuestion()">Next Question</button>
        <span class="score">Score: <strong>${score.correct}</strong> / ${score.total}</span>
      </div>`;
    }
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="quiz-prompt">${quizQ.prompt}</p>
        <div class="quiz-opts">${optsHtml}</div>
        ${!quizResult?`<button class="check-btn" ${!quizGuess?'disabled':''} onclick="checkAnswer()">Check Answer</button>`:''}
        ${resultHtml}
      </div>`;
    pedEl.innerHTML=`<strong>Two trap families live here.</strong> Particle-motion questions: the pattern-slide trick answers them all, and crest or trough means momentarily at rest. Graph questions: check the axis label before reading anything; the snapshot's repeat is λ in metres, the history's repeat is T in seconds, and swapping them is the single most common wave error. Then v = λ/T, that way round.`;

  } else {
    svgEl.innerHTML=renderTwoScene(twoT);
    ctrlEl.innerHTML=`
      <div class="controls">
        <div class="section-title">Two graphs of the same wave</div>
        <p class="section-desc">Drag time forward. The snapshot (left) shows the whole string at the instant t; the history (right) grows as particle P traces out its own past. P appears in both: same dot, two different stories.</p>
        <div class="slider-wrap">
          <label class="label">time t: <span id="twoLabel" style="color:var(--bright);font-size:15px">${twoT.toFixed(2)} s</span></label>
          <input type="range" min="0.05" max="4" step="0.05" value="${twoT}" oninput="setTwoT(this.value)">
        </div>
        <div class="readout">
          <span class="eq"><span class="m">Snapshot repeat:</span> <strong>λ = 4 m</strong> <span class="m">(read along x)</span></span>
          <span class="eq"><span class="m">History repeat:</span> <strong>T = 2 s</strong> <span class="m">(read along t)</span></span>
          <span class="eq"><span class="m">v = λ/T = 4/2 =</span> <strong>2 m s⁻¹</strong></span>
        </div>
      </div>`;
    pedEl.innerHTML=`<strong>Why examiners love this:</strong> the two graphs look identical, a sine curve is a sine curve, and only the axis label tells you which physics to read off. Before answering any wave-graph question, say out loud what the horizontal axis is. Position axis: distances, wavelength. Time axis: times, period, frequency. Only after that, v = fλ connects the two worlds.`;
  }
}

render();
if(mode==="explore")rafId=requestAnimationFrame(tick);
</script>
