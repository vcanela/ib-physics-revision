<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Level Transitions</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#131022;--panel:#1d1735;--border:#372a5e;--text:#e6e1f5;--muted:#a79fc7;--bright:#f6f3ff;--level:#fbbf24;--electron:#38bdf8;--correct:#34d399;--incorrect:#f87171;--accent:#8b5cf6;--accentBg:#2a1c54;--accentTxt:#c4b5fd}
  body{font-family:'IBM Plex Sans','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:22px 18px;min-height:100vh}
  .container{max-width:1150px;margin:0 auto}
  .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.05em;padding:3px 10px;border-radius:6px;background:var(--accentBg);color:var(--accentTxt);margin-bottom:8px}
  h2{font-size:22px;font-weight:700;color:var(--bright);margin-bottom:4px}
  .subtitle{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .subtitle strong,.subtitle em{color:var(--text)}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .tab.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .tab:hover{border-color:#4c3b80}
  .main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
  .controls{background:var(--panel);border-radius:12px;padding:16px;border:1px solid var(--border)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
  .btn-group{display:flex;flex-wrap:wrap;gap:4px}
  .dir-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .dir-btn.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .dir-btn:hover{border-color:#4c3b80}
  .quiz-prompt{font-size:14px;font-weight:600;margin-bottom:10px}
  .quiz-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .opt-btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;min-width:80px;text-align:center;transition:all .15s}
  .opt-btn.selected{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .opt-btn.correct{border-color:var(--correct);background:#064e3b;color:var(--correct);font-weight:700}
  .opt-btn.wrong{border-color:var(--incorrect);background:#7f1d1d;color:var(--incorrect);font-weight:700}
  .opt-btn.locked{cursor:default}
  .check-btn{padding:8px 24px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  .check-btn:disabled{background:#372a5e;color:#6d639a;cursor:default}
  .result-text{font-size:15px;font-weight:700;margin-bottom:6px}
  .result-text.correct{color:var(--correct)}
  .result-text.wrong{color:var(--incorrect)}
  .hint-text{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .next-row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .score{font-size:13px;color:var(--muted)}
  .score strong{color:var(--correct)}
  .pedagogy{margin-top:16px;padding:14px 16px;background:#181330;border-radius:10px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.65}
  .pedagogy strong{color:var(--bright)}
  .section-title{font-size:15px;font-weight:700;color:var(--bright);margin-bottom:8px}
  .section-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .slider-wrap{margin-top:8px}
  .slider-wrap input[type=range]{width:100%;margin-top:6px;accent-color:var(--accent)}
  .readout{margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.8}
  .readout .m{color:var(--muted)}
  .eq{display:block;white-space:nowrap}
  .swatch{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
  .kit{margin-top:12px;padding:12px;background:var(--accentBg);border:1px solid var(--accent);border-radius:8px;font-size:13px;line-height:1.8}
  .kit .kit-title{font-weight:700;color:var(--accentTxt);font-size:12px;letter-spacing:0.04em;margin-bottom:4px}
  svg{display:block;border-radius:12px;width:100%;height:auto}
</style>
</head>
<body>
<div class="container">
  <span class="chip">THEME E · NUCLEAR &amp; QUANTUM · E1 STRUCTURE OF THE ATOM</span>
  <h2>Energy Level Transitions</h2>
  <p class="subtitle">Photon energy: <strong>E</strong> = <em>E</em><sub>upper</sub> − <em>E</em><sub>lower</sub> = <em>hf</em> = <em>hc</em>/λ &nbsp;|&nbsp; Hydrogen: <em>E<sub>n</sub></em> = −13.6/<em>n</em>² eV</p>

  <div class="tabs">
    <button class="tab active" id="tabExplore" onclick="switchMode('explore')">Explore Transitions</button>
    <button class="tab" id="tabQuiz" onclick="switchMode('quiz')">Quiz Me</button>
    <button class="tab" id="tabRel" onclick="switchMode('rel')">Energy &amp; Wavelength</button>
  </div>

  <div class="main">
    <div id="svgContainer"></div>
    <div id="controlsContainer"></div>
  </div>
  <div class="pedagogy" id="pedagogy"></div>
</div>

<script>
// ============================================================
// Hydrogen levels: E_n = -13.6 / n^2 eV, n = 1..6
// Photon: E = hf = hc/lambda ; hc = 1240 eV nm
// Transitions between N levels: N(N-1)/2 distinct energies
// ============================================================

const NMAX=6;
const HC=1240;               // eV nm
const EV_HZ=2.418e14;        // 1 eV as frequency, Hz
const En=n=>-13.6/(n*n);

const W=800,H=420;
// main diagram (true energy scale)
const X_L=90,X_R=390,Y_TOP=50,Y_BOT=385;
const yOf=E=>Y_TOP+(E/-13.6)*(Y_BOT-Y_TOP);
// zoom inset for n = 3..6 (E from 0 down to -1.7 eV)
const IX0=485,IX1=770,IY0=42,IY1=390,EMIN_INS=-1.7;
const yIns=E=>IY0+12+(E/EMIN_INS)*(IY1-IY0-24);

const SERIES={1:{name:"Lyman series",note:"ends on n = 1"},2:{name:"Balmer series",note:"ends on n = 2"},3:{name:"Paschen series",note:"ends on n = 3"}};

let mode="explore";
let fromN=3,toN=2;
let quizQ=null,quizGuess=null,quizResult=null;
let score={correct:0,total:0};
let relE=1.9;
let rafId=null,animT0=null;

function switchMode(m){
  mode=m;
  document.getElementById("tabExplore").className="tab"+(m==="explore"?" active":"");
  document.getElementById("tabQuiz").className="tab"+(m==="quiz"?" active":"");
  document.getElementById("tabRel").className="tab"+(m==="rel"?" active":"");
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  animT0=null;
  if(m==="quiz"){score={correct:0,total:0};generateQuiz();}
  render();
  if(m==="explore"&&fromN!==toN)rafId=requestAnimationFrame(tick);
}
function setFrom(n){fromN=n;restartAnim();render();}
function setTo(n){toN=n;restartAnim();render();}
function restartAnim(){
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  animT0=null;
  if(mode==="explore"&&fromN!==toN)rafId=requestAnimationFrame(tick);
}

// ---- physics helpers ----
function photonOf(a,b){
  const dE=Math.abs(En(a)-En(b));
  return{dE,lambda:HC/dE,f:EV_HZ*dE};
}
function regionOf(lambda){
  if(lambda<380)return{name:"ultraviolet",color:"#a78bfa"};
  if(lambda<=750)return{name:"visible",color:visColor(lambda)};
  return{name:"infrared",color:"#b91c1c"};
}
function visColor(l){
  if(l<450)return"#7c3aed";if(l<495)return"#3b82f6";if(l<570)return"#22c55e";
  if(l<590)return"#eab308";if(l<620)return"#f97316";return"#ef4444";
}
function fmt(x,d){return Number(x).toFixed(d===undefined?2:d);}
function fmtF(f){return(f/1e14).toFixed(2)+" × 10¹⁴ Hz";}

// ---- diagram pieces ----
function levelLine(x1,x2,y,n,hl){
  let s="";
  if(hl)s+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#fde68a" stroke-width="7" opacity="0.22"/>`;
  s+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${hl?'#fde68a':'#fbbf24'}" stroke-width="${hl?3.2:(n===1?3:2)}" opacity="${hl?1:0.8}"/>`;
  return s;
}
function mainLevels(hlSet){
  let s="";
  s+=`<line x1="${X_L}" y1="${Y_TOP}" x2="${X_R}" y2="${Y_TOP}" stroke="#4c3b80" stroke-width="1.5" stroke-dasharray="6,4"/>`;
  s+=`<text x="${X_L}" y="${Y_TOP-8}" fill="#6d639a" font-size="11">E = 0 (ionisation)</text>`;
  for(let n=1;n<=NMAX;n++){
    const y=yOf(En(n));
    s+=levelLine(X_L,X_R,y,n,hlSet.has(n));
    if(n<=3){
      s+=`<text x="${X_L-12}" y="${y+4}" fill="#fbbf24" text-anchor="end" font-size="12" font-weight="600">n=${n}</text>`;
      s+=`<text x="${X_R+10}" y="${y+4}" fill="#a79fc7" font-size="10.5">${fmt(En(n),2)} eV</text>`;
    }
  }
  return s;
}
function insetLevels(hlSet){
  let s=`<rect x="${IX0-38}" y="${IY0-14}" width="${IX1-IX0+80}" height="${IY1-IY0+34}" rx="10" fill="#161129" stroke="#372a5e"/>`;
  s+=`<text x="${IX0-24}" y="${IY0}" fill="#8b7fc0" font-size="11" font-weight="600">zoom: n = 3 to 6</text>`;
  // wedge lines linking zoomed region on the main diagram to the inset
  const yz=yOf(EMIN_INS);
  s+=`<line x1="${X_R+14}" y1="${Y_TOP}" x2="${IX0-38}" y2="${IY0-14}" stroke="#4c3b80" stroke-width="1" opacity="0.5"/>`;
  s+=`<line x1="${X_R+14}" y1="${yz}" x2="${IX0-38}" y2="${IY1+20}" stroke="#4c3b80" stroke-width="1" opacity="0.5"/>`;
  s+=`<line x1="${IX0-28}" y1="${yIns(0)}" x2="${IX1}" y2="${yIns(0)}" stroke="#4c3b80" stroke-width="1.5" stroke-dasharray="6,4"/>`;
  s+=`<text x="${IX1}" y="${yIns(0)-6}" fill="#6d639a" font-size="10" text-anchor="end">E = 0</text>`;
  for(let n=3;n<=NMAX;n++){
    const y=yIns(En(n));
    s+=levelLine(IX0-28,IX1-52,y,n,hlSet.has(n));
    s+=`<text x="${IX0-34}" y="${y+4}" fill="#fbbf24" text-anchor="end" font-size="12" font-weight="600">n=${n}</text>`;
    s+=`<text x="${IX1-44}" y="${y+4}" fill="#a79fc7" font-size="10.5">${fmt(En(n),2)} eV</text>`;
  }
  return s;
}
function transArrow(x,y1,y2,color,label){
  const up=y2<y1,hd=10,hw=5;
  let s=`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2+(up?hd:-hd)}" stroke="${color}" stroke-width="2.5"/>`;
  s+=`<polygon points="${x},${y2} ${x-hw},${y2+(up?hd:-hd)} ${x+hw},${y2+(up?hd:-hd)}" fill="${color}"/>`;
  if(label)s+=`<text x="${x+14}" y="${(y1+y2)/2+4}" fill="${color}" font-size="13" font-weight="700">${label}</text>`;
  return s;
}
// Feynman-style photon: wavy line whose arrowhead shows the direction of travel
function photonWave(x,y,color,movingRight,op){
  op=op===undefined?1:op;
  const len=58,amp=5,n=3;
  let d="M "+x+" "+y;
  for(let i=1;i<=36;i++){
    const t=i/36;
    d+=" L "+(x+t*len)+" "+(y-Math.sin(t*n*2*Math.PI)*amp);
  }
  let s=`<g opacity="${op}"><path d="${d}" fill="none" stroke="${color}" stroke-width="2"/>`;
  if(movingRight)s+=`<polygon points="${x+len+9},${y} ${x+len},${y-4.5} ${x+len},${y+4.5}" fill="${color}"/>`;
  else s+=`<polygon points="${x-9},${y} ${x},${y-4.5} ${x},${y+4.5}" fill="${color}"/>`;
  s+=`</g>`;
  return s;
}
function electron(x,y,op){
  op=op===undefined?1:op;
  return`<g opacity="${op}"><circle cx="${x}" cy="${y}" r="9" fill="#38bdf8" opacity="0.25"/><circle cx="${x}" cy="${y}" r="5.5" fill="#38bdf8"/><text x="${x}" y="${y+3}" fill="#0c2436" font-size="8" font-weight="700" text-anchor="middle">e</text></g>`;
}

// arrows: [{a,b,color,label}] ; extras: raw svg appended on top
function renderDiagram(arrows,hlLevels,extras){
  const hlSet=new Set(hlLevels||[]);
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#0e0b1c;border-radius:12px;display:block">`;
  svg+=mainLevels(hlSet);
  svg+=insetLevels(hlSet);
  const xs=arrows.length===1?[230]:arrows.length===2?[190,280]:[170,240,310];
  const ixs=arrows.length===1?[600]:arrows.length===2?[570,660]:[550,615,680];
  arrows.forEach((ar,i)=>{
    svg+=transArrow(xs[i],yOf(En(ar.a)),yOf(En(ar.b)),ar.color,ar.label);
    if(ar.a>=3&&ar.b>=3)svg+=transArrow(ixs[i],yIns(En(ar.a)),yIns(En(ar.b)),ar.color,ar.label);
  });
  if(extras)svg+=extras;
  svg+=`</svg>`;
  return svg;
}

// ---- explore animation (electron jump + photon, looping) ----
const CYCLE=2.4;
function exploreExtras(t){
  if(fromN===toN)return"";
  const down=fromN>toN;
  const p=photonOf(fromN,toN);
  const col=regionOf(p.lambda).color;
  const yFrom=yOf(En(fromN)),yTo=yOf(En(toN));
  const midY=(yFrom+yTo)/2;
  const ease=u=>u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
  let eY,photonSvg="",label="";
  const phX=408; // photon zone between main diagram and inset
  if(down){ // emission: electron drops, photon leaves to the right
    if(t<0.5){eY=yFrom;}
    else if(t<0.9){eY=yFrom+(yTo-yFrom)*ease((t-0.5)/0.4);}
    else{eY=yTo;}
    if(t>=0.85&&t<2.15){
      const u=(t-0.85)/1.3;
      const op=u>0.75?1-(u-0.75)/0.25:1;
      photonSvg=photonWave(phX+u*22,midY,col,true,op);
      label=`<text x="${phX+28}" y="${midY-16}" fill="${col}" font-size="11" font-weight="600" opacity="${op}">photon emitted →</text>`;
    }
  }else{ // absorption: photon arrives from the right moving left, then electron jumps up
    if(t<1.0){
      const u=t/1.0;
      photonSvg=photonWave(phX+26-u*26,midY,col,false,1);
      label=`<text x="${phX+28}" y="${midY-16}" fill="${col}" font-size="11" font-weight="600">← photon absorbed</text>`;
    }
    if(t<1.0)eY=yFrom;
    else if(t<1.4)eY=yFrom+(yTo-yFrom)*ease((t-1.0)/0.4);
    else eY=yTo;
  }
  let s=photonSvg+label+electron(160,eY);
  // mirror the electron in the inset when the whole jump lives there
  if(fromN>=3&&toN>=3){
    const iFrom=yIns(En(fromN)),iTo=yIns(En(toN));
    const frac=(eY-yFrom)/((yTo-yFrom)||1);
    s+=electron(530,iFrom+(iTo-iFrom)*frac,0.9);
  }
  return s;
}
function tick(ts){
  if(mode!=="explore"||fromN===toN){rafId=null;return;}
  if(animT0===null)animT0=ts;
  const t=((ts-animT0)/1000)%CYCLE;
  const down=fromN>toN;
  const p=photonOf(fromN,toN);
  const col=regionOf(p.lambda).color;
  document.getElementById("svgContainer").innerHTML=
    renderDiagram([{a:fromN,b:toN,color:col,label:""}],[fromN,toN],exploreExtras(t));
  rafId=requestAnimationFrame(tick);
}

// ---- quiz ----
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function randTransDown(){
  const hi=randInt(2,NMAX);const lo=randInt(1,hi-1);return[hi,lo];
}
function generateQuiz(){
  const types=["count","longer","highest","kind"];
  const t=types[Math.floor(Math.random()*types.length)];
  if(t==="count"){
    const N=randInt(3,6);
    const correct=N*(N-1)/2;
    const cands=[correct,N-1,N,N*(N+1)/2,(N-1)*(N-1)];
    const opts=[...new Set(cands)].slice(0,4);
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
    quizQ={type:"count",N,answer:String(correct),options:opts.map(String),
      prompt:`An electron can occupy any of the levels n = 1 to ${N} (highlighted). How many photons of different energy can atoms in this sample emit?`,
      hint:`Count the pairs of levels: every pair gives one distinct energy, so N(N−1)/2 = ${N}×${N-1}/2 = ${correct}. Listing arrows level by level catches the count-errors.`,
      arrows:[],hl:Array.from({length:N},(_,i)=>i+1)};
  }else if(t==="longer"){
    let A,B;
    do{A=randTransDown();B=randTransDown();}
    while(Math.abs(photonOf(A[0],A[1]).dE-photonOf(B[0],B[1]).dE)<0.05);
    const ans=photonOf(A[0],A[1]).dE<photonOf(B[0],B[1]).dE?"A":"B";
    quizQ={type:"longer",answer:ans,options:["A","B"],
      prompt:"Which transition emits the photon with the longer wavelength?",
      hint:"Longer wavelength means smaller photon energy: λ = hc/E. The smaller energy gap wins. Watch the inversion: big gap, short wavelength.",
      arrows:[{a:A[0],b:A[1],color:"#f43f5e",label:"A"},{a:B[0],b:B[1],color:"#3b82f6",label:"B"}],hl:[]};
  }else if(t==="highest"){
    let arr=[],tries=0;
    while(arr.length<3&&tries<60){
      tries++;const c=randTransDown();
      if(!arr.some(x=>Math.abs(photonOf(x[0],x[1]).dE-photonOf(c[0],c[1]).dE)<0.05))arr.push(c);
    }
    while(arr.length<3)arr.push(randTransDown());
    let best=0;
    for(let i=1;i<3;i++)if(photonOf(arr[i][0],arr[i][1]).dE>photonOf(arr[best][0],arr[best][1]).dE)best=i;
    const letters=["A","B","C"],colors=["#f43f5e","#3b82f6","#34d399"];
    quizQ={type:"highest",answer:letters[best],options:letters,
      prompt:"Which transition emits the photon with the highest frequency?",
      hint:"Highest frequency means biggest energy gap: E = hf, direct relation. Compare the gaps, not the level numbers.",
      arrows:arr.map((x,i)=>({a:x[0],b:x[1],color:colors[i],label:letters[i]})),hl:[]};
  }else{
    const down=Math.random()<0.5;
    const[hi,lo]=randTransDown();
    const a=down?hi:lo,b=down?lo:hi;
    quizQ={type:"kind",answer:down?"emitted":"absorbed",options:["emitted","absorbed"],
      prompt:"In the transition shown, a photon is...",
      hint:"Electron falls to a lower level: energy leaves as an emitted photon. Electron jumps up: a photon of exactly the gap energy is absorbed.",
      arrows:[{a,b,color:"#cbd5e1",label:""}],hl:[]};
  }
  quizGuess=null;quizResult=null;
}
function selectGuess(k){if(!quizResult){quizGuess=k;render();}}
function checkAnswer(){
  if(!quizGuess||!quizQ)return;
  const ok=quizGuess===quizQ.answer;
  quizResult=ok?"correct":"incorrect";
  score.total++;if(ok)score.correct++;
  render();
}
function nextQuestion(){generateQuiz();render();}

// ---- relationship graph ----
function renderRelScene(E){
  const l=HC/E;
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#0e0b1c;border-radius:12px;display:block">`;
  const gx=85,gy=42,gw=640,gh=300;
  const E0=1.0,E1=13.6,LMAX=1300;
  const px=e=>gx+(e-E0)/(E1-E0)*gw;
  const py=lam=>gy+gh-Math.min(lam,LMAX)/LMAX*gh;
  svg+=`<defs><linearGradient id="visgrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ef4444"/><stop offset="35%" stop-color="#22c55e"/><stop offset="100%" stop-color="#7c3aed"/>
  </linearGradient></defs>`;
  svg+=`<rect x="${gx}" y="${py(750)}" width="${gw}" height="${py(380)-py(750)}" fill="url(#visgrad)" opacity="0.22"/>`;
  svg+=`<text x="${gx+gw-8}" y="${(py(380)+py(750))/2+4}" fill="#a79fc7" font-size="11" text-anchor="end">visible band: 380 to 750 nm</text>`;
  svg+=`<line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy+gh}" stroke="#4c3b80" stroke-width="1.5"/>`;
  svg+=`<line x1="${gx}" y1="${gy+gh}" x2="${gx+gw}" y2="${gy+gh}" stroke="#4c3b80" stroke-width="1.5"/>`;
  svg+=`<text x="${gx+gw/2}" y="${gy+gh+36}" fill="#a79fc7" text-anchor="middle" font-size="12">photon energy E (eV)</text>`;
  svg+=`<text x="${gx-50}" y="${gy-14}" fill="#a79fc7" font-size="12">λ (nm)</text>`;
  for(let e=2;e<=13;e+=1){
    svg+=`<line x1="${px(e)}" y1="${gy+gh}" x2="${px(e)}" y2="${gy+gh+5}" stroke="#4c3b80"/>`;
    if(e%2===0)svg+=`<text x="${px(e)}" y="${gy+gh+19}" fill="#6d639a" text-anchor="middle" font-size="10">${e}</text>`;
  }
  for(let lam=0;lam<=1300;lam+=260){
    svg+=`<line x1="${gx-4}" y1="${py(lam)}" x2="${gx}" y2="${py(lam)}" stroke="#4c3b80"/>`;
    svg+=`<text x="${gx-8}" y="${py(lam)+3}" fill="#6d639a" text-anchor="end" font-size="10">${lam}</text>`;
  }
  let d="";
  for(let i=0;i<=200;i++){
    const e=E0+i/200*(E1-E0);
    d+=(i===0?"M":"L")+px(e).toFixed(1)+","+py(HC/e).toFixed(1);
  }
  svg+=`<path d="${d}" fill="none" stroke="#8b5cf6" stroke-width="2.5" opacity="0.85"/>`;
  const mcol=regionOf(l).color;
  svg+=`<line x1="${px(E)}" y1="${gy+gh}" x2="${px(E)}" y2="${py(l)}" stroke="${mcol}" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>`;
  svg+=`<line x1="${gx}" y1="${py(l)}" x2="${px(E)}" y2="${py(l)}" stroke="${mcol}" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>`;
  svg+=`<circle cx="${px(E)}" cy="${py(l)}" r="6" fill="${mcol}"/>`;
  svg+=`</svg>`;
  return svg;
}
function setRelE(v){
  relE=Number(v);
  document.getElementById("svgContainer").innerHTML=renderRelScene(relE);
  document.getElementById("relLabel").textContent=fmt(relE,1)+" eV";
  document.getElementById("relReadout").innerHTML=relReadoutHtml(relE);
}
function relReadoutHtml(E){
  const l=HC/E,r=regionOf(l);
  return`<span class="eq"><span class="m">E =</span> <strong>${fmt(E,1)} eV</strong></span>
  <span class="eq"><span class="m">λ = hc/E = 1240/${fmt(E,1)} =</span> <strong>${fmt(l,0)} nm</strong></span>
  <span class="eq"><span class="m">f = E/h =</span> <strong>${fmtF(EV_HZ*E)}</strong></span>
  <span class="eq"><span class="m">Region:</span> <span class="swatch" style="background:${r.color}"></span><strong style="color:${r.color}">${r.name}</strong></span>`;
}
const KIT=`<div class="kit"><div class="kit-title">BACK-OF-ENVELOPE KIT</div>
<span class="eq">λ (nm) = 1240 / E (eV)</span>
<span class="eq">f = E (eV) × 2.42 × 10¹⁴ Hz</span>
<span class="eq">visible light: 380 to 750 nm ↔ 3.3 to 1.7 eV</span></div>`;

// ---- main render ----
function render(){
  const svgEl=document.getElementById("svgContainer");
  const ctrlEl=document.getElementById("controlsContainer");
  const pedEl=document.getElementById("pedagogy");

  if(mode==="explore"){
    const same=fromN===toN;
    let readout;
    if(same){
      svgEl.innerHTML=renderDiagram([],[fromN],"");
      readout=`<div><span class="m">Pick two different levels to make a transition.</span></div>`;
    }else{
      const down=fromN>toN;
      const p=photonOf(fromN,toN);
      const r=regionOf(p.lambda);
      const up=Math.max(fromN,toN),lo=Math.min(fromN,toN);
      const ser=SERIES[lo];
      svgEl.innerHTML=renderDiagram([{a:fromN,b:toN,color:r.color,label:""}],[fromN,toN],exploreExtras(0));
      readout=`<span class="eq"><span class="m">${down?"Emission":"Absorption"}:</span> <strong>n = ${fromN} → n = ${toN}</strong></span>
      <span class="eq"><span class="m">E = E<sub>${up}</sub> − E<sub>${lo}</sub> = (${fmt(En(up),2)}) − (${fmt(En(lo),2)}) =</span> <strong>${fmt(p.dE,2)} eV</strong></span>
      <span class="eq"><span class="m">λ = hc/E = 1240/${fmt(p.dE,2)} =</span> <strong>${fmt(p.lambda,0)} nm</strong></span>
      <span class="eq"><span class="m">f = E/h =</span> <strong>${fmtF(p.f)}</strong></span>
      <span class="eq"><span class="m">Region:</span> <span class="swatch" style="background:${r.color}"></span><strong style="color:${r.color}">${r.name}</strong>${ser?`<span class="m"> · ${ser.name} (${ser.note})</span>`:""}</span>`;
    }
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="section-desc">Choose a starting and finishing level; the selected levels light up and the electron replays the jump. Downward transitions emit a photon; upward ones absorb one. The colour of arrow and photon matches the spectral region.</p>
        <div class="grid2">
          <div>
            <label class="label">From level</label>
            <div class="btn-group">${[1,2,3,4,5,6].map(n=>`<button class="dir-btn${n===fromN?' active':''}" onclick="setFrom(${n})">n=${n}</button>`).join("")}</div>
          </div>
          <div>
            <label class="label">To level</label>
            <div class="btn-group">${[1,2,3,4,5,6].map(n=>`<button class="dir-btn${n===toN?' active':''}" onclick="setTo(${n})">n=${n}</button>`).join("")}</div>
          </div>
        </div>
        <div class="readout">${readout}</div>
      </div>`;
    pedEl.innerHTML=`<strong>Key idea:</strong> energy levels are negative because the electron is bound; E = 0 is the ionisation limit. A photon is emitted or absorbed only if its energy exactly matches a gap: E = E<sub>upper</sub> − E<sub>lower</sub> = hf = hc/λ. The photon's wavy arrow shows its direction of travel: leaving the atom when emitted, arriving when absorbed.
    <br><br><strong>Series and colour:</strong> every emission ending on n = 2 (the Balmer series) lands in or near the visible; drops to n = 1 (Lyman) are all ultraviolet; drops to n = 3 (Paschen) are infrared. That is why the arrow colours change as you move the lower level.
    <br><strong>Watch the inversion:</strong> a bigger gap means higher frequency but <em>shorter</em> wavelength.`;

  } else if(mode==="quiz"){
    if(!quizQ)generateQuiz();
    svgEl.innerHTML=renderDiagram(quizQ.arrows,quizQ.hl,"");
    let optsHtml=quizQ.options.map(k=>{
      let cls="opt-btn";
      if(quizResult)cls+=" locked";
      if(quizGuess===k&&!quizResult)cls+=" selected";
      if(quizGuess===k&&quizResult==="correct")cls+=" correct";
      if(quizGuess===k&&quizResult==="incorrect")cls+=" wrong";
      return`<button class="${cls}" onclick="selectGuess('${k}')">${k}</button>`;
    }).join("");
    let resultHtml="";
    if(quizResult){
      if(quizResult==="correct"){
        resultHtml=`<div class="result-text correct">Correct!</div>`;
      }else{
        resultHtml=`<div class="result-text wrong">Not quite — the answer is ${quizQ.answer}</div>
          <p class="hint-text">${quizQ.hint}</p>`;
      }
      resultHtml+=`<div class="next-row">
        <button class="check-btn" onclick="nextQuestion()">Next Question</button>
        <span class="score">Score: <strong>${score.correct}</strong> / ${score.total}</span>
      </div>`;
    }
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="quiz-prompt">${quizQ.prompt}</p>
        <div class="quiz-opts">${optsHtml}</div>
        ${!quizResult?`<button class="check-btn" ${!quizGuess?'disabled':''} onclick="checkAnswer()">Check Answer</button>`:''}
        ${resultHtml}
      </div>`;
    pedEl.innerHTML=`<strong>Method:</strong> for counting, list pairs of levels: N levels give N(N−1)/2 distinct photon energies. For comparing photons, always compare the <em>energy gaps</em> first: frequency follows the gap directly, wavelength inversely. Use the zoom panel to read transitions among the crowded upper levels.`;

  } else {
    svgEl.innerHTML=renderRelScene(relE);
    ctrlEl.innerHTML=`
      <div class="controls">
        <div class="section-title">Energy against wavelength</div>
        <p class="section-desc">λ = hc/E with hc = 1240 eV nm. Drag the slider and watch the marker ride the curve; the shaded band is visible light.</p>
        <div class="slider-wrap">
          <label class="label">Photon energy E: <span id="relLabel" style="color:var(--bright);font-size:15px">${fmt(relE,1)} eV</span></label>
          <input type="range" min="1" max="13.6" step="0.1" value="${relE}" oninput="setRelE(this.value)">
        </div>
        <div class="readout" id="relReadout">${relReadoutHtml(relE)}</div>
        ${KIT}
      </div>`;
    pedEl.innerHTML=`<strong>Key idea:</strong> E and f are directly proportional (E = hf); E and λ are inversely proportional (E = hc/λ). The curve is a hyperbola: doubling the photon energy halves the wavelength. The kit numbers are worth memorising: with λ = 1240/E you can place any photon in the spectrum in your head. Hydrogen's n = 3 → 2 gap of 1.89 eV gives 656 nm, the famous red Balmer line; n = 2 → 1 at 10.2 eV gives 122 nm, deep ultraviolet.`;
  }
}

render();
if(mode==="explore"&&fromN!==toN)rafId=requestAnimationFrame(tick);
</script>
</body>
</html>
