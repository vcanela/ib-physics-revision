<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackbody Curves: Stefan-Boltzmann and Wien</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#1c1208;--panel:#2d1e10;--border:#553c1e;--text:#f5ead9;--muted:#c9a878;--bright:#fdf6ec;--curve:#fb923c;--correct:#34d399;--incorrect:#f87171;--accent:#f97316;--accentBg:#4a2708;--accentTxt:#fdba74}
  body{font-family:'IBM Plex Sans','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:22px 18px;min-height:100vh}
  .container{max-width:1150px;margin:0 auto}
  .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.05em;padding:3px 10px;border-radius:6px;background:var(--accentBg);color:var(--accentTxt);margin-bottom:8px}
  h2{font-size:22px;font-weight:700;color:var(--bright);margin-bottom:4px}
  .subtitle{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .subtitle strong,.subtitle em{color:var(--text)}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .tab.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .tab:hover{border-color:#7a5c30}
  .main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
  .controls{background:var(--panel);border-radius:12px;padding:16px;border:1px solid var(--border)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
  .btn-group{display:flex;flex-wrap:wrap;gap:4px}
  .dir-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .dir-btn.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .dir-btn:hover{border-color:#7a5c30}
  .quiz-prompt{font-size:14px;font-weight:600;margin-bottom:10px}
  .quiz-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .opt-btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;min-width:88px;text-align:center;transition:all .15s}
  .opt-btn.selected{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .opt-btn.correct{border-color:var(--correct);background:#064e3b;color:var(--correct);font-weight:700}
  .opt-btn.wrong{border-color:var(--incorrect);background:#7f1d1d;color:var(--incorrect);font-weight:700}
  .opt-btn.locked{cursor:default}
  .check-btn{padding:8px 24px;border-radius:8px;border:none;background:var(--accent);color:#2e1503;font-weight:700;font-size:14px;cursor:pointer}
  .check-btn:disabled{background:#553c1e;color:#8f7448;cursor:default}
  .result-text{font-size:15px;font-weight:700;margin-bottom:6px}
  .result-text.correct{color:var(--correct)}
  .result-text.wrong{color:var(--incorrect)}
  .hint-text{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .next-row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .score{font-size:13px;color:var(--muted)}
  .score strong{color:var(--correct)}
  .pedagogy{margin-top:16px;padding:14px 16px;background:#241708;border-radius:10px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.65}
  .pedagogy strong{color:var(--bright)}
  .section-title{font-size:15px;font-weight:700;color:var(--bright);margin-bottom:8px}
  .section-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .slider-wrap{margin-top:8px}
  .slider-wrap input[type=range]{width:100%;margin-top:6px;accent-color:var(--accent)}
  .readout{margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.8}
  .readout .m{color:var(--muted)}
  .eq{display:block;white-space:nowrap}
  .swatch{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px}
  svg{display:block;border-radius:12px;width:100%;height:auto}
</style>
</head>
<body>
<div class="container">
  <span class="chip">THEME B · MATTER · B1 THERMAL ENERGY TRANSFERS</span>
  <h2>Blackbody Curves: Stefan-Boltzmann and Wien</h2>
  <p class="subtitle"><strong>P</strong> = σA<em>T</em>⁴ &nbsp;|&nbsp; λ<sub>peak</sub> = 2.90 × 10⁻³ / <em>T</em> (m K) &nbsp;|&nbsp; hotter: much brighter, peak shifts blue</p>

  <div class="tabs">
    <button class="tab active" id="tabExplore" onclick="switchMode('explore')">Explore the Curve</button>
    <button class="tab" id="tabQuiz" onclick="switchMode('quiz')">Quiz Me</button>
    <button class="tab" id="tabLum" onclick="switchMode('lum')">Luminosity L ∝ r²T⁴</button>
  </div>

  <div class="main">
    <div id="svgContainer"></div>
    <div id="controlsContainer"></div>
  </div>
  <div class="pedagogy" id="pedagogy"></div>
</div>

<script>
// ============================================================
// Planck spectral shape: B(l,T) ~ 1 / ( l^5 (exp(hc/(l kT)) - 1) )
// with hc/k = 0.0144 m K. Wien: l_peak = 2.90e-3 / T.
// Stefan-Boltzmann: power per area ~ T^4. L = sigma 4 pi r^2 T^4.
// ============================================================

const W=800,H=420;
const HCK=0.0144;           // hc/k in m K
const WIEN=2.90e-3;         // m K
function planck(l,T){return 1/(Math.pow(l,5)*(Math.exp(HCK/(l*T))-1));}

let mode="explore";
let temp=5800,ghost=true;
let quizQ=null,quizGuess=null,quizResult=null;
let score={correct:0,total:0};
let lum={r:2,T:2};

const ANCHORS=[[1000,[255,58,0]],[2000,[255,106,0]],[3000,[255,160,64]],[4000,[255,207,148]],[5000,[255,233,207]],[5800,[255,245,236]],[7000,[232,238,255]],[8000,[207,220,255]]];
function starColor(T){
  T=Math.max(1000,Math.min(8000,T));
  for(let i=0;i<ANCHORS.length-1;i++){
    const[a,ca]=ANCHORS[i],[b,cb]=ANCHORS[i+1];
    if(T>=a&&T<=b){
      const u=(T-a)/(b-a);
      const c=ca.map((v,k)=>Math.round(v+(cb[k]-v)*u));
      return`rgb(${c[0]},${c[1]},${c[2]})`;
    }
  }
  return"rgb(255,245,236)";
}

function switchMode(m){
  mode=m;
  document.getElementById("tabExplore").className="tab"+(m==="explore"?" active":"");
  document.getElementById("tabQuiz").className="tab"+(m==="quiz"?" active":"");
  document.getElementById("tabLum").className="tab"+(m==="lum"?" active":"");
  if(m==="quiz"){score={correct:0,total:0};generateQuiz();}
  render();
}
function setTemp(v){
  temp=Number(v);
  document.getElementById("svgContainer").innerHTML=renderCurveScene(temp);
  const tl=document.getElementById("tempLabel");
  if(tl)tl.textContent=temp+" K";
  const ro=document.getElementById("curveReadout");
  if(ro)ro.innerHTML=curveReadoutHtml(temp);
}
function setPreset(v){temp=v;render();}
function toggleGhost(){ghost=!ghost;render();}

// ---- curve scene ----
function renderCurveScene(T){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#160e05;border-radius:12px;display:block">`;
  const gx=70,gy=40,gw=660,gh=310;
  const L0=2e-8,L1=3e-6; // metres
  const px=l=>gx+(l-L0)/(L1-L0)*gw;
  // visible band
  svg+=`<defs><linearGradient id="visg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7c3aed"/><stop offset="45%" stop-color="#22c55e"/><stop offset="100%" stop-color="#ef4444"/>
  </linearGradient></defs>`;
  svg+=`<rect x="${px(380e-9)}" y="${gy}" width="${px(750e-9)-px(380e-9)}" height="${gh}" fill="url(#visg)" opacity="0.16"/>`;
  svg+=`<text x="${(px(380e-9)+px(750e-9))/2}" y="${gy+14}" fill="#c9a878" font-size="10" text-anchor="middle">visible</text>`;
  // axes
  svg+=`<line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy+gh}" stroke="#553c1e" stroke-width="1.5"/>`;
  svg+=`<line x1="${gx}" y1="${gy+gh}" x2="${gx+gw}" y2="${gy+gh}" stroke="#553c1e" stroke-width="1.5"/>`;
  svg+=`<text x="${gx+gw/2}" y="${gy+gh+38}" fill="#c9a878" text-anchor="middle" font-size="12">wavelength λ (nm)</text>`;
  svg+=`<text x="${gx-8}" y="${gy-12}" fill="#c9a878" font-size="12">intensity per wavelength</text>`;
  for(let nm=0;nm<=3000;nm+=500){
    const p=px(nm*1e-9);
    svg+=`<line x1="${p}" y1="${gy+gh}" x2="${p}" y2="${gy+gh+5}" stroke="#553c1e"/>`;
    svg+=`<text x="${p}" y="${gy+gh+19}" fill="#8f7448" text-anchor="middle" font-size="10">${nm}</text>`;
  }
  // scale to current curve max
  let maxB=0;
  for(let i=1;i<=300;i++){const l=L0+i/300*(L1-L0);maxB=Math.max(maxB,planck(l,T));}
  const py=b=>Math.max(gy,gy+gh-b/maxB*(gh-14));
  // ghost 3000 K curve, same absolute scale
  if(ghost&&T!==3000){
    let d="";
    for(let i=1;i<=300;i++){
      const l=L0+i/300*(L1-L0);
      d+=(i===1?"M":"L")+px(l).toFixed(1)+","+py(planck(l,3000)).toFixed(1);
    }
    svg+=`<path d="${d}" fill="none" stroke="#8f7448" stroke-width="1.8" stroke-dasharray="6,4" opacity="0.8"/>`;
    svg+=`<text x="${gx+gw-6}" y="${gy+gh-10}" fill="#8f7448" font-size="10" text-anchor="end">dashed: 3000 K at the same scale</text>`;
  }
  // current curve
  let d="";
  for(let i=1;i<=300;i++){
    const l=L0+i/300*(L1-L0);
    d+=(i===1?"M":"L")+px(l).toFixed(1)+","+py(planck(l,T)).toFixed(1);
  }
  svg+=`<path d="${d}" fill="none" stroke="${starColor(T)}" stroke-width="3"/>`;
  // peak marker
  const lpk=WIEN/T;
  if(lpk>L0&&lpk<L1){
    svg+=`<line x1="${px(lpk)}" y1="${gy+gh}" x2="${px(lpk)}" y2="${py(planck(lpk,T))}" stroke="#fdba74" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>`;
    svg+=`<circle cx="${px(lpk)}" cy="${py(planck(lpk,T))}" r="6" fill="#fdba74"/>`;
    svg+=`<text x="${px(lpk)+10}" y="${py(planck(lpk,T))-10}" fill="#fdba74" font-size="11" font-weight="600">λ_peak = ${Math.round(lpk*1e9)} nm</text>`;
  }
  // star swatch
  svg+=`<circle cx="${gx+gw-40}" cy="${gy+34}" r="16" fill="${starColor(T)}"/>`;
  svg+=`<text x="${gx+gw-40}" y="${gy+66}" fill="#c9a878" font-size="10" text-anchor="middle">${T} K</text>`;
  svg+=`</svg>`;
  return svg;
}
function curveReadoutHtml(T){
  const lpk=WIEN/T*1e9;
  const region=lpk<380?"ultraviolet":lpk<=750?"visible":"infrared";
  const pRatio=Math.pow(T/3000,4);
  return`<span class="eq"><span class="m">λ_peak = 2.90 × 10⁻³ / ${T} =</span> <strong>${Math.round(lpk)} nm</strong> <span class="m">(${region})</span></span>
  <span class="eq"><span class="m">Power per area ∝ T⁴ =</span> <strong>${pRatio>=10?Math.round(pRatio):pRatio.toFixed(2)} ×</strong> <span class="m">that of a 3000 K surface</span></span>
  <span class="eq"><span class="m">Glow colour:</span> <span class="swatch" style="background:${starColor(T)}"></span><strong>${T<3500?"reddish":T<6000?"white-ish":"blue-white"}</strong></span>`;
}

// ---- quiz ----
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const QUIZ_ITEMS=[
  {q:"The absolute temperature of a blackbody doubles. Its total radiated power becomes...",ans:"× 16",opts:["× 16","× 8","× 4","× 2"],hint:"P ∝ T⁴, so T ×2 gives ×2⁴ = ×16. Stopping at ×4 (squaring) or ×8 (cubing) are the classic exponent slips."},
  {q:"The absolute temperature of a blackbody triples. Its total radiated power becomes...",ans:"× 81",opts:["× 81","× 27","× 9","× 3"],hint:"P ∝ T⁴: 3⁴ = 81. The ×9 answer is T² and ×27 is T³, both exponent-errors."},
  {q:"A star's radiated power increases by a factor of 16 with no change in size. Its absolute temperature has become...",ans:"× 2",opts:["× 2","× 4","× 8","× 16"],hint:"Invert P ∝ T⁴: T ∝ P^(1/4), and 16^(1/4) = 2. Taking a square root instead of a fourth root gives the ×4 trap."},
  {q:"A star's radiated power increases by a factor of 81 with no change in size. Its absolute temperature has become...",ans:"× 3",opts:["× 3","× 9","× 27","× 81"],hint:"T ∝ P^(1/4): 81^(1/4) = 3. The ×9 answer is the square root taken too early."},
  {q:"The absolute temperature of a blackbody doubles. Its peak wavelength becomes...",ans:"× 1/2",opts:["× 1/2","× 2","× 1/4","unchanged"],hint:"Wien: λ_peak = 2.90 × 10⁻³/T, an inverse law. Hotter body, shorter peak wavelength: T ×2 halves λ_peak."},
  {q:"A blackbody's peak wavelength is observed to halve. Its absolute temperature has become...",ans:"× 2",opts:["× 2","× 1/2","× 4","× 16"],hint:"λ_peak ∝ 1/T, so halving λ_peak means doubling T. No fourth powers here: Wien is a simple inverse."},
  {q:"Star A has twice the radius of star B and the same surface temperature. L_A / L_B is...",ans:"4",opts:["4","2","8","16"],hint:"L ∝ r²T⁴; with equal T only the r² matters: 2² = 4."},
  {q:"Star A has the same radius as star B but twice its surface temperature. L_A / L_B is...",ans:"16",opts:["16","2","4","8"],hint:"L ∝ r²T⁴; equal radii, so 2⁴ = 16."},
  {q:"Star A has twice the radius and twice the surface temperature of star B. L_A / L_B is...",ans:"64",opts:["64","32","16","8"],hint:"L ∝ r²T⁴ = 2² × 2⁴ = 4 × 16 = 64. Most wrong answers come from dropping one of the two factors."},
  {q:"Star A has three times the radius of star B and the same temperature. L_A / L_B is...",ans:"9",opts:["9","3","6","27"],hint:"L ∝ r²: 3² = 9. The temperature term is a red herring here since T is equal."}
];
function generateQuiz(){
  const item=pick(QUIZ_ITEMS);
  quizQ={prompt:item.q,answer:item.ans,options:shuffle(item.opts.slice()),hint:item.hint};
  quizGuess=null;quizResult=null;
}
function selectGuess(k){if(!quizResult){quizGuess=k;render();}}
function checkAnswer(){
  if(!quizGuess||!quizQ)return;
  const ok=quizGuess===quizQ.answer;
  quizResult=ok?"correct":"incorrect";
  score.total++;if(ok)score.correct++;
  render();
}
function nextQuestion(){generateQuiz();render();}

// ---- luminosity tab ----
function setLum(k,v){lum[k]=v;render();}
function renderLumScene(){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#160e05;border-radius:12px;display:block">`;
  const baseT=3000;
  const y=210;
  svg+=`<circle cx="200" cy="${y}" r="26" fill="${starColor(baseT)}"/>`;
  svg+=`<text x="200" y="${y+64}" fill="#c9a878" font-size="12" text-anchor="middle">reference star</text>`;
  svg+=`<text x="200" y="${y+82}" fill="#8f7448" font-size="11" text-anchor="middle">radius r, temperature T (3000 K)</text>`;
  const r2=26*lum.r,T2=baseT*lum.T;
  svg+=`<circle cx="560" cy="${y}" r="${r2}" fill="${starColor(T2)}"/>`;
  svg+=`<text x="560" y="${y+r2+34}" fill="#c9a878" font-size="12" text-anchor="middle">your star</text>`;
  svg+=`<text x="560" y="${y+r2+52}" fill="#8f7448" font-size="11" text-anchor="middle">radius ${lum.r}r, temperature ${lum.T}T (${T2} K)</text>`;
  const L=lum.r*lum.r*Math.pow(lum.T,4);
  svg+=`<text x="${W/2}" y="70" fill="#fdba74" font-size="16" font-weight="700" text-anchor="middle">L = ${lum.r}² × ${lum.T}⁴ = ${lum.r*lum.r} × ${Math.pow(lum.T,4)} = ${L} × the reference</text>`;
  svg+=`</svg>`;
  return svg;
}
function lumBtns(key){
  return[1,2,3].map(v=>`<button class="dir-btn${lum[key]===v?' active':''}" onclick="setLum('${key}',${v})">×${v}</button>`).join("");
}

// ---- main render ----
function render(){
  const svgEl=document.getElementById("svgContainer");
  const ctrlEl=document.getElementById("controlsContainer");
  const pedEl=document.getElementById("pedagogy");

  if(mode==="explore"){
    svgEl.innerHTML=renderCurveScene(temp);
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="section-desc">Slide the temperature. Two things happen at once, and exam questions test both: the peak slides to shorter wavelengths (Wien) and the whole curve grows enormously (Stefan-Boltzmann; note how tiny the dashed 3000 K curve looks from 6000 K).</p>
        <div class="label">Presets</div>
        <div class="btn-group" style="margin-bottom:10px">
          <button class="dir-btn${temp===1500?' active':''}" onclick="setPreset(1500)">1500 K ember</button>
          <button class="dir-btn${temp===3000?' active':''}" onclick="setPreset(3000)">3000 K red star</button>
          <button class="dir-btn${temp===5800?' active':''}" onclick="setPreset(5800)">5800 K Sun</button>
          <button class="dir-btn${temp===8000?' active':''}" onclick="setPreset(8000)">8000 K hot star</button>
        </div>
        <div class="slider-wrap">
          <label class="label">temperature T: <span id="tempLabel" style="color:var(--bright);font-size:15px">${temp} K</span></label>
          <input type="range" min="1000" max="8000" step="50" value="${temp}" oninput="setTemp(this.value)">
        </div>
        <div class="btn-group" style="margin-top:10px">
          <button class="dir-btn${ghost?' active':''}" onclick="toggleGhost()">${ghost?"hide":"show"} 3000 K comparison</button>
        </div>
        <div class="readout" id="curveReadout">${curveReadoutHtml(temp)}</div>
      </div>`;
    pedEl.innerHTML=`<strong>Two laws, one curve:</strong> Wien's law reads the peak position, λ_peak = 2.90 × 10⁻³/T, an inverse law; Stefan-Boltzmann reads the area under the curve, P = σAT⁴, a fourth-power law. Candidates lose marks by mixing the two: wavelength questions never involve fourth powers, power questions always do.
    <br><br><strong>Star colour is temperature:</strong> reddish means cool, blue-white means hot: the opposite of tap-label intuition, and a favourite one-marker.`;

  } else if(mode==="quiz"){
    if(!quizQ)generateQuiz();
    svgEl.innerHTML=renderCurveScene(temp);
    let optsHtml=quizQ.options.map(k=>{
      let cls="opt-btn";
      if(quizResult)cls+=" locked";
      if(quizGuess===k&&!quizResult)cls+=" selected";
      if(quizGuess===k&&quizResult==="correct")cls+=" correct";
      if(quizGuess===k&&quizResult==="incorrect")cls+=" wrong";
      return`<button class="${cls}" onclick="selectGuess('${k}')">${k}</button>`;
    }).join("");
    let resultHtml="";
    if(quizResult){
      if(quizResult==="correct")resultHtml=`<div class="result-text correct">Correct!</div>`;
      else resultHtml=`<div class="result-text wrong">Not quite — the answer is ${quizQ.answer}</div><p class="hint-text">${quizQ.hint}</p>`;
      resultHtml+=`<div class="next-row">
        <button class="check-btn" onclick="nextQuestion()">Next Question</button>
        <span class="score">Score: <strong>${score.correct}</strong> / ${score.total}</span>
      </div>`;
    }
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="quiz-prompt">${quizQ.prompt}</p>
        <div class="quiz-opts">${optsHtml}</div>
        ${!quizResult?`<button class="check-btn" ${!quizGuess?'disabled':''} onclick="checkAnswer()">Check Answer</button>`:''}
        ${resultHtml}
      </div>`;
    pedEl.innerHTML=`<strong>This quiz is pure scaling drill,</strong> because that is how this topic is examined: T⁴ going forward, fourth roots coming back, the inverse Wien law, and r²T⁴ for luminosity. Write the proportionality first, substitute the factor second; never juggle the numbers in your head.`;

  } else {
    svgEl.innerHTML=renderLumScene();
    ctrlEl.innerHTML=`
      <div class="controls">
        <div class="section-title">Build a star</div>
        <p class="section-desc">L = σ4πr²T⁴, so relative to the reference star, L = (r factor)² × (T factor)⁴. Set the two factors and read the arithmetic off the top of the picture.</p>
        <div class="grid2">
          <div><label class="label">radius factor</label><div class="btn-group">${lumBtns('r')}</div></div>
          <div><label class="label">temperature factor</label><div class="btn-group">${lumBtns('T')}</div></div>
        </div>
        <div class="readout">
          <span class="eq"><span class="m">L/L₀ = r² T⁴ = ${lum.r}² × ${lum.T}⁴ =</span> <strong>${lum.r*lum.r*Math.pow(lum.T,4)}</strong></span>
          <span class="eq"><span class="m">λ_peak becomes</span> <strong>${lum.T===1?"unchanged":"× 1/"+lum.T}</strong> <span class="m">(Wien, from the T factor only)</span></span>
        </div>
      </div>`;
    pedEl.innerHTML=`<strong>Why T wins:</strong> the temperature factor enters four times, the radius only twice, so a modest temperature rise beats a large size increase: ×3 in T is ×81 in luminosity, while ×3 in r is only ×9. This asymmetry is the entire content of most "compare two stars" questions, including the white-dwarf-versus-red-giant classics.`;
  }
}

render();
</script>
</body>
</html>
