<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion Graph Translator</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0c1220;--panel:#16203a;--border:#2b3a63;--text:#e3e9f7;--muted:#93a5cc;--bright:#f4f7ff;--x:#38bdf8;--v:#f59e0b;--a:#f472b6;--correct:#34d399;--incorrect:#f87171;--accent:#0ea5e9;--accentBg:#0b3352;--accentTxt:#7dd3fc}
  body{font-family:'IBM Plex Sans','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:22px 18px;min-height:100vh}
  .container{max-width:1150px;margin:0 auto}
  .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.05em;padding:3px 10px;border-radius:6px;background:var(--accentBg);color:var(--accentTxt);margin-bottom:8px}
  h2{font-size:22px;font-weight:700;color:var(--bright);margin-bottom:4px}
  .subtitle{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .tab.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
  .controls{background:var(--panel);border-radius:12px;padding:16px;border:1px solid var(--border)}
  .label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
  .btn-group{display:flex;flex-wrap:wrap;gap:4px}
  .dir-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .dir-btn.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .quiz-prompt{font-size:14px;font-weight:600;margin-bottom:10px}
  .quiz-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .opt-btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;min-width:88px;text-align:center;transition:all .15s}
  .opt-btn.selected{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .opt-btn.correct{border-color:var(--correct);background:#064e3b;color:var(--correct);font-weight:700}
  .opt-btn.wrong{border-color:var(--incorrect);background:#7f1d1d;color:var(--incorrect);font-weight:700}
  .opt-btn.locked{cursor:default}
  .check-btn{padding:8px 24px;border-radius:8px;border:none;background:var(--accent);color:#04283f;font-weight:700;font-size:14px;cursor:pointer}
  .check-btn:disabled{background:#2b3a63;color:#6d7ea8;cursor:default}
  .result-text{font-size:15px;font-weight:700;margin-bottom:6px}
  .result-text.correct{color:var(--correct)}
  .result-text.wrong{color:var(--incorrect)}
  .hint-text{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .next-row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .score{font-size:13px;color:var(--muted)}
  .score strong{color:var(--correct)}
  .pedagogy{margin-top:16px;padding:14px 16px;background:#111a30;border-radius:10px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.65}
  .pedagogy strong{color:var(--bright)}
  .section-title{font-size:15px;font-weight:700;color:var(--bright);margin-bottom:8px}
  .section-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .slider-wrap{margin-top:8px}
  .slider-wrap input[type=range]{width:100%;margin-top:6px;accent-color:var(--accent)}
  .readout{margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.8}
  .readout .m{color:var(--muted)}
  .eq{display:block;white-space:nowrap}
  svg{display:block;border-radius:12px;width:100%;height:auto}
</style>
</head>
<body>
<div class="container">
  <span class="chip">THEME A · SPACE, TIME AND MOTION · A1 KINEMATICS</span>
  <h2>Motion Graph Translator</h2>
  <p class="subtitle">One motion, three graphs. Gradient of x-t is v; gradient of v-t is a; area under v-t is displacement.</p>

  <div class="tabs">
    <button class="tab active" id="tabExplore" onclick="switchMode('explore')">Watch a Motion</button>
    <button class="tab" id="tabQuiz" onclick="switchMode('quiz')">Quiz Me</button>
    <button class="tab" id="tabArea" onclick="switchMode('area')">Gradient &amp; Area Machine</button>
  </div>

  <div class="main">
    <div id="svgContainer"></div>
    <div id="controlsContainer"></div>
  </div>
  <div class="pedagogy" id="pedagogy"></div>
</div>

<script>
// ============================================================
// Motion profiles over 0..8 s, each with exact x(t), v(t), a(t).
// The three graphs and the moving dot all come from the same profile.
// ============================================================

const W=800,H=420,TMAX=8;

const PROFILES={
  uniform:{name:"steady velocity",
    x:t=>1.2*t, v:t=>1.2, a:t=>0,
    desc:"constant v: straight sloping x-t, flat v-t, zero a-t"},
  accel:{name:"speeding up from rest",
    x:t=>0.175*t*t, v:t=>0.35*t, a:t=>0.35,
    desc:"constant positive a: curving-up x-t, straight rising v-t, flat positive a-t"},
  decel:{name:"slowing to a stop",
    x:t=>2.4*t-0.15*t*t, v:t=>2.4-0.3*t, a:t=>-0.3,
    desc:"constant negative a: x-t levels off, straight falling v-t, flat negative a-t"},
  outback:{name:"out, turn round, come back",
    x:t=>t<3?1.5*t:t<5?4.5+1.5*(t-3)-0.75*(t-3)*(t-3):4.5-1.5*(t-5),
    v:t=>t<3?1.5:t<5?1.5-1.5*(t-3):-1.5,
    a:t=>t<3?0:t<5?-1.5:0,
    desc:"turnaround: v passes through zero exactly where x peaks"},
  rest:{name:"at rest",
    x:t=>3, v:t=>0, a:t=>0,
    desc:"flat x-t at a nonzero value; v and a both zero"}
};
const PKEYS=Object.keys(PROFILES);

let mode="explore";
let prof="outback";
let simT=0,lastTs=null,rafId=null;
let quizQ=null,quizGuess=null,quizResult=null;
let score={correct:0,total:0};
let areaT=3.0,areaProf="decel";

function switchMode(m){
  mode=m;
  document.getElementById("tabExplore").className="tab"+(m==="explore"?" active":"");
  document.getElementById("tabQuiz").className="tab"+(m==="quiz"?" active":"");
  document.getElementById("tabArea").className="tab"+(m==="area"?" active":"");
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  lastTs=null;
  if(m==="quiz"){score={correct:0,total:0};generateQuiz();}
  render();
  if(m==="explore")rafId=requestAnimationFrame(tick);
}
function setProf(p){prof=p;simT=0;render();}
function tick(ts){
  if(mode!=="explore"){rafId=null;return;}
  if(lastTs===null)lastTs=ts;
  const dt=Math.min(0.05,(ts-lastTs)/1000);
  lastTs=ts;
  simT=(simT+dt)%TMAX;
  document.getElementById("svgContainer").innerHTML=renderExploreScene(simT);
  rafId=requestAnimationFrame(tick);
}

// ---- graph drawing ----
function rangeOf(fn){
  let lo=0,hi=0;
  for(let i=0;i<=160;i++){const y=fn(i/160*TMAX);lo=Math.min(lo,y);hi=Math.max(hi,y);}
  if(hi-lo<0.5){hi+=0.5;lo-=0.5;}
  const pad=(hi-lo)*0.15;return[lo-pad,hi+pad];
}
function graph(gx,gy,gw,gh,fn,color,label,tMark){
  const[lo,hi]=rangeOf(fn);
  const py=y=>gy+gh-(y-lo)/(hi-lo)*gh;
  let s=`<line x1="${gx}" y1="${py(0)}" x2="${gx+gw}" y2="${py(0)}" stroke="#2b3a63" stroke-width="1"/>`;
  s+=`<line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy+gh}" stroke="#2b3a63" stroke-width="1"/>`;
  s+=`<text x="${gx-8}" y="${gy+10}" fill="${color}" font-size="12" font-weight="700" text-anchor="end">${label}</text>`;
  let d="";
  for(let i=0;i<=160;i++){
    const t=i/160*TMAX;
    d+=(i===0?"M":"L")+(gx+i/160*gw).toFixed(1)+","+py(fn(t)).toFixed(1);
  }
  s+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2"/>`;
  if(tMark!==undefined){
    const mx=gx+tMark/TMAX*gw;
    s+=`<line x1="${mx}" y1="${gy}" x2="${mx}" y2="${gy+gh}" stroke="#6d7ea8" stroke-width="1" opacity="0.5"/>`;
    s+=`<circle cx="${mx}" cy="${py(fn(tMark))}" r="5" fill="${color}"/>`;
  }
  return s;
}

// ---- explore ----
function renderExploreScene(t){
  const P=PROFILES[prof];
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#0a0f1c;border-radius:12px;display:block">`;
  // track
  const[xlo,xhi]=rangeOf(P.x);
  const tx=x=>70+(x-xlo)/(xhi-xlo)*660;
  svg+=`<line x1="70" y1="46" x2="730" y2="46" stroke="#2b3a63" stroke-width="2"/>`;
  svg+=`<circle cx="${tx(P.x(t))}" cy="46" r="10" fill="#38bdf8"/>`;
  svg+=`<text x="740" y="50" fill="#6d7ea8" font-size="10">x</text>`;
  // three graphs
  svg+=graph(70,86,660,92,P.x,"#38bdf8","x",t);
  svg+=graph(70,196,660,92,P.v,"#f59e0b","v",t);
  svg+=graph(70,306,660,92,P.a,"#f472b6","a",t);
  svg+=`<text x="730" y="412" fill="#6d7ea8" font-size="10" text-anchor="end">t (s)</text>`;
  return svg+"</svg>";
}

// ---- quiz ----
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const DEF_ITEMS=[
  {q:"The gradient of a displacement-time graph gives...",ans:"velocity",opts:["velocity","acceleration","distance travelled","force"],hint:"Gradient of x-t is Δx/Δt: that is the definition of velocity. Gradient of v-t is the one that gives acceleration."},
  {q:"The gradient of a velocity-time graph gives...",ans:"acceleration",opts:["acceleration","velocity","displacement","distance travelled"],hint:"Gradient of v-t is Δv/Δt = a. The area under v-t is the one that gives displacement."},
  {q:"The area under a velocity-time graph gives...",ans:"change in displacement",opts:["change in displacement","acceleration","average speed","change in kinetic energy"],hint:"Area = Σ v·Δt = displacement. Areas below the axis count as negative displacement."},
  {q:"The area under an acceleration-time graph gives...",ans:"change in velocity",opts:["change in velocity","displacement","average acceleration","final velocity"],hint:"Area = Σ a·Δt = Δv. It gives the change, not the final value: you still need the starting velocity."},
  {q:"On an x-t graph, a curve getting steeper means the object is...",ans:"speeding up",opts:["speeding up","slowing down","moving backwards","at constant velocity"],hint:"Steepness of x-t is speed. Getting steeper means the magnitude of the velocity is growing."},
  {q:"On a v-t graph, the line crosses the time axis. At that moment the object...",ans:"is momentarily at rest and reverses",opts:["is momentarily at rest and reverses","returns to its starting point","has zero acceleration","stops permanently"],hint:"v = 0 means at rest for an instant; the sign change of v means the direction reverses. It says nothing about being back at the start: that is an x-t question."}
];
function generateQuiz(){
  if(Math.random()<0.5){
    // match the x-t graph to a shown v-t graph
    const correct=pick(PKEYS);
    let others=PKEYS.filter(k=>k!==correct);
    shuffle(others);
    const letters=["A","B","C"];
    const cands=shuffle([correct,others[0],others[1]]);
    quizQ={type:"match",given:correct,cands,
      answer:letters[cands.indexOf(correct)],options:letters,
      prompt:"The top graph is velocity against time. Which displacement-time graph (A, B or C) shows the same motion?",
      hint:"Read the v-t graph in words first ("+PROFILES[correct].desc+"), then find the x-t graph whose gradient tells that same story."};
  }else{
    const item=pick(DEF_ITEMS);
    quizQ={type:"def",prompt:item.q,answer:item.ans,options:shuffle(item.opts.slice()),hint:item.hint};
  }
  quizGuess=null;quizResult=null;
}
function selectGuess(k){if(!quizResult){quizGuess=k;render();}}
function checkAnswer(){
  if(!quizGuess||!quizQ)return;
  const ok=quizGuess===quizQ.answer;
  quizResult=ok?"correct":"incorrect";
  score.total++;if(ok)score.correct++;
  render();
}
function nextQuestion(){generateQuiz();render();}
function renderQuizScene(){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#0a0f1c;border-radius:12px;display:block">`;
  if(quizQ.type==="match"){
    svg+=`<text x="70" y="34" fill="#f59e0b" font-size="12" font-weight="700">GIVEN: velocity-time</text>`;
    svg+=graph(70,44,660,120,PROFILES[quizQ.given].v,"#f59e0b","v");
    const letters=["A","B","C"];
    quizQ.cands.forEach((k,i)=>{
      const gx=70+i*230;
      svg+=`<text x="${gx}" y="${218}" fill="#38bdf8" font-size="12" font-weight="700">${letters[i]}: displacement-time</text>`;
      svg+=graph(gx,228,190,150,PROFILES[k].x,"#38bdf8","x");
    });
  }else{
    // decorative trio for definition questions
    svg+=graph(70,60,660,90,PROFILES.outback.x,"#38bdf8","x");
    svg+=graph(70,170,660,90,PROFILES.outback.v,"#f59e0b","v");
    svg+=graph(70,280,660,90,PROFILES.outback.a,"#f472b6","a");
  }
  return svg+"</svg>";
}

// ---- gradient & area machine ----
function areaOf(P,t){ // numeric integral of v from 0..t
  let s=0;const n=200;
  for(let i=0;i<n;i++){const u=t*(i+0.5)/n;s+=P.v(u);}
  return s*t/n;
}
function renderAreaScene(t){
  const P=PROFILES[areaProf];
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#0a0f1c;border-radius:12px;display:block">`;
  // v-t with shaded area
  const gx=70,gy=50,gw=660,gh=170;
  const[lo,hi]=rangeOf(P.v);
  const py=y=>gy+gh-(y-lo)/(hi-lo)*gh;
  svg+=`<text x="${gx}" y="${gy-12}" fill="#f59e0b" font-size="12" font-weight="700">velocity-time: shaded area = displacement so far</text>`;
  // shaded area
  let dA="M "+gx+" "+py(0);
  const steps=Math.max(2,Math.floor(160*t/TMAX));
  for(let i=0;i<=steps;i++){const u=i/160*TMAX;dA+=" L "+(gx+i/160*gw).toFixed(1)+" "+py(P.v(u)).toFixed(1);}
  dA+=" L "+(gx+t/TMAX*gw).toFixed(1)+" "+py(0)+" Z";
  svg+=`<path d="${dA}" fill="#f59e0b" opacity="0.18"/>`;
  svg+=graph(gx,gy,gw,gh,P.v,"#f59e0b","v",t);
  // gradient callout
  svg+=`<text x="${gx+gw-6}" y="${gy+16}" fill="#f472b6" font-size="11" text-anchor="end">gradient here = a = ${P.a(t).toFixed(2)} m s⁻²</text>`;
  // x-t below, marker shows the accumulated area landing on the curve
  svg+=`<text x="${gx}" y="258" fill="#38bdf8" font-size="12" font-weight="700">displacement-time: the area lands here</text>`;
  svg+=graph(gx,268,gw,120,P.x,"#38bdf8","x",t);
  return svg+"</svg>";
}
function areaReadoutHtml(t){
  const P=PROFILES[areaProf];
  return`<span class="eq"><span class="m">t =</span> <strong>${t.toFixed(1)} s</strong></span>
  <span class="eq"><span class="m">area under v-t so far =</span> <strong>${areaOf(P,t).toFixed(2)} m</strong></span>
  <span class="eq"><span class="m">x(t) from the graph below =</span> <strong>${(P.x(t)-P.x(0)).toFixed(2)} m</strong> <span class="m">: same number, always</span></span>
  <span class="eq"><span class="m">gradient of v-t = a =</span> <strong>${P.a(t).toFixed(2)} m s⁻²</strong></span>`;
}
function setAreaT(v){
  areaT=Number(v);
  document.getElementById("svgContainer").innerHTML=renderAreaScene(areaT);
  document.getElementById("areaLabel").textContent=areaT.toFixed(1)+" s";
  document.getElementById("areaReadout").innerHTML=areaReadoutHtml(areaT);
}
function setAreaProf(p){areaProf=p;render();}

// ---- main render ----
function render(){
  const svgEl=document.getElementById("svgContainer");
  const ctrlEl=document.getElementById("controlsContainer");
  const pedEl=document.getElementById("pedagogy");

  if(mode==="explore"){
    svgEl.innerHTML=renderExploreScene(simT);
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="section-desc">Pick a motion. The dot and all three graphs run from the same equations; watch how one story looks completely different in each representation.</p>
        <div class="label">Motion</div>
        <div class="btn-group">${PKEYS.map(k=>`<button class="dir-btn${k===prof?' active':''}" onclick="setProf('${k}')">${PROFILES[k].name}</button>`).join("")}</div>
        <div class="readout">
          <span class="eq"><strong>${PROFILES[prof].name}:</strong></span>
          <span class="eq"><span class="m">${PROFILES[prof].desc}</span></span>
        </div>
      </div>`;
    pedEl.innerHTML=`<strong>Translate, don't memorise:</strong> every kinematics graph question is a translation exercise between three languages describing one motion. The dictionary has only two entries: gradient (x-t → v, v-t → a) and area (a-t → Δv, v-t → Δx). The turnaround motion is the best teacher: at the moment x peaks, v crosses zero, and a does not care at all.`;

  } else if(mode==="quiz"){
    if(!quizQ)generateQuiz();
    svgEl.innerHTML=renderQuizScene();
    let optsHtml=quizQ.options.map(k=>{
      let cls="opt-btn";
      if(quizResult)cls+=" locked";
      if(quizGuess===k&&!quizResult)cls+=" selected";
      if(quizGuess===k&&quizResult==="correct")cls+=" correct";
      if(quizGuess===k&&quizResult==="incorrect")cls+=" wrong";
      return`<button class="${cls}" onclick="selectGuess('${k}')">${k}</button>`;
    }).join("");
    let resultHtml="";
    if(quizResult){
      if(quizResult==="correct")resultHtml=`<div class="result-text correct">Correct!</div>`;
      else resultHtml=`<div class="result-text wrong">Not quite — the answer is ${quizQ.answer}</div><p class="hint-text">${quizQ.hint}</p>`;
      resultHtml+=`<div class="next-row">
        <button class="check-btn" onclick="nextQuestion()">Next Question</button>
        <span class="score">Score: <strong>${score.correct}</strong> / ${score.total}</span>
      </div>`;
    }
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="quiz-prompt">${quizQ.prompt}</p>
        <div class="quiz-opts">${optsHtml}</div>
        ${!quizResult?`<button class="check-btn" ${!quizGuess?'disabled':''} onclick="checkAnswer()">Check Answer</button>`:''}
        ${resultHtml}
      </div>`;
    pedEl.innerHTML=`<strong>Method for matching graphs:</strong> put the given graph into words first ("starts fast, slows, reverses"), then test each candidate against the story. Never match by shape: an x-t parabola and a v-t straight line describe the same motion, and shape-matching is exactly the trap being set.`;

  } else {
    svgEl.innerHTML=renderAreaScene(areaT);
    ctrlEl.innerHTML=`
      <div class="controls">
        <div class="section-title">Gradient and area, live</div>
        <p class="section-desc">Drag time. The shaded area under the v-t graph accumulates, and its value is always exactly the displacement on the x-t graph below.</p>
        <div class="label">Motion</div>
        <div class="btn-group" style="margin-bottom:8px">${["accel","decel","outback"].map(k=>`<button class="dir-btn${k===areaProf?' active':''}" onclick="setAreaProf('${k}')">${PROFILES[k].name}</button>`).join("")}</div>
        <div class="slider-wrap">
          <label class="label">time t: <span id="areaLabel" style="color:var(--bright);font-size:15px">${areaT.toFixed(1)} s</span></label>
          <input type="range" min="0.1" max="8" step="0.1" value="${areaT}" oninput="setAreaT(this.value)">
        </div>
        <div class="readout" id="areaReadout">${areaReadoutHtml(areaT)}</div>
      </div>`;
    pedEl.innerHTML=`<strong>Why area works:</strong> displacement is velocity summed over time, Δx = Σ v Δt, and that sum is literally the area between the v-t curve and the axis. In the turnaround motion, watch the area start shrinking once v goes negative: area below the axis is negative displacement, which is how the object gets home.`;
  }
}

render();
if(mode==="explore")rafId=requestAnimationFrame(tick);
</script>
</body>
</html>
