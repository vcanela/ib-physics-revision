<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Scaling Dojo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#161314;--panel:#242021;--border:#4a3f41;--text:#f2eceb;--muted:#bda9a5;--bright:#fcf8f7;--belt:#ef4444;--correct:#34d399;--incorrect:#f87171;--accent:#dc2626;--accentBg:#450e0e;--accentTxt:#fca5a5}
  body{font-family:'IBM Plex Sans','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:22px 18px;min-height:100vh}
  .container{max-width:1150px;margin:0 auto}
  .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.05em;padding:3px 10px;border-radius:6px;background:var(--accentBg);color:var(--accentTxt);margin-bottom:8px}
  h2{font-size:22px;font-weight:700;color:var(--bright);margin-bottom:4px}
  .subtitle{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .tab.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
  .controls{background:var(--panel);border-radius:12px;padding:16px;border:1px solid var(--border)}
  .label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
  .quiz-prompt{font-size:15px;font-weight:600;margin-bottom:10px;line-height:1.5}
  .quiz-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .opt-btn{padding:8px 16px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:14px;font-weight:600;min-width:96px;text-align:center;transition:all .15s}
  .opt-btn.selected{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .opt-btn.correct{border-color:var(--correct);background:#064e3b;color:var(--correct);font-weight:700}
  .opt-btn.wrong{border-color:var(--incorrect);background:#7f1d1d;color:var(--incorrect);font-weight:700}
  .opt-btn.locked{cursor:default}
  .check-btn{padding:8px 24px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  .check-btn:disabled{background:#4a3f41;color:#8f7d79;cursor:default}
  .result-text{font-size:15px;font-weight:700;margin-bottom:6px}
  .result-text.correct{color:var(--correct)}
  .result-text.wrong{color:var(--incorrect)}
  .hint-text{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .next-row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .score{font-size:13px;color:var(--muted)}
  .score strong{color:var(--correct)}
  .streak{font-size:13px;color:var(--accentTxt);font-weight:700}
  .pedagogy{margin-top:16px;padding:14px 16px;background:#1d191a;border-radius:10px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.65}
  .pedagogy strong{color:var(--bright)}
  .section-title{font-size:15px;font-weight:700;color:var(--bright);margin-bottom:8px}
  .section-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .readout{margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.8}
  .readout .m{color:var(--muted)}
  .eq{display:block;white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;padding:6px 8px;border-bottom:1px solid var(--border)}
  td{padding:7px 8px;border-bottom:1px solid #322b2c;line-height:1.4}
  td.rel{color:var(--accentTxt);font-weight:600;white-space:nowrap}
  td.theme{color:var(--muted);white-space:nowrap}
  svg{display:block;border-radius:12px;width:100%;height:auto}
</style>
</head>
<body>
<div class="container">
  <span class="chip">CROSS-THEME · THE SCALING DOJO</span>
  <h2>The Scaling Dojo</h2>
  <p class="subtitle">Factor-errors and exponent-errors are the exam's second army. Drill the one move that defeats them: write the proportionality, then apply the factor.</p>

  <div class="tabs">
    <button class="tab active" id="tabDrill" onclick="switchMode('drill')">Drill</button>
    <button class="tab" id="tabBank" onclick="switchMode('bank')">The Relations</button>
    <button class="tab" id="tabShapes" onclick="switchMode('shapes')">Shapes of Power Laws</button>
  </div>

  <div class="main">
    <div id="svgContainer"></div>
    <div id="controlsContainer"></div>
  </div>
  <div class="pedagogy" id="pedagogy"></div>
</div>

<script>
// ============================================================
// Relation bank: Y ∝ X^pow. Forward: X ×k gives Y ×k^pow.
// Reverse: Y ×n gives X ×n^(1/pow).
// Exact symbolic option formatting for k in {2,3,4} and
// pow in {-2,-1,-0.5,0.5,1,2,3,4}.
// ============================================================

const W=800,H=420;
const RELS=[
  {y:"period T",x:"length l",rel:"T ∝ √l",pow:0.5,note:"simple pendulum",theme:"C1"},
  {y:"period T",x:"mass m",rel:"T ∝ √m",pow:0.5,note:"mass-spring oscillator",theme:"C1"},
  {y:"kinetic energy E_k",x:"speed v",rel:"E_k ∝ v²",pow:2,note:"E_k = ½mv²",theme:"A3"},
  {y:"stopping distance (uniform braking)",x:"initial speed v",rel:"d ∝ v²",pow:2,note:"v² = 2ad",theme:"A1"},
  {y:"gravitational force F",x:"separation r",rel:"F ∝ 1/r²",pow:-2,note:"Newton's law of gravitation",theme:"D1"},
  {y:"electrostatic force F",x:"separation r",rel:"F ∝ 1/r²",pow:-2,note:"Coulomb's law",theme:"D2"},
  {y:"intensity I",x:"distance r from a point source",rel:"I ∝ 1/r²",pow:-2,note:"inverse square spreading",theme:"C2"},
  {y:"radiated power P",x:"absolute temperature T",rel:"P ∝ T⁴",pow:4,note:"Stefan-Boltzmann",theme:"B1"},
  {y:"peak wavelength λ_max",x:"absolute temperature T",rel:"λ_max ∝ 1/T",pow:-1,note:"Wien's law",theme:"B1"},
  {y:"photon energy E",x:"wavelength λ",rel:"E ∝ 1/λ",pow:-1,note:"E = hc/λ",theme:"E1"},
  {y:"fundamental frequency f₁",x:"string length L",rel:"f₁ ∝ 1/L",pow:-1,note:"f₁ = v/2L",theme:"C4"},
  {y:"centripetal acceleration a",x:"speed v (fixed radius)",rel:"a ∝ v²",pow:2,note:"a = v²/r",theme:"A2"},
  {y:"orbital speed v",x:"orbital radius r",rel:"v ∝ 1/√r",pow:-0.5,note:"v = √(GM/r)",theme:"D1"},
  {y:"resistance R",x:"wire length L",rel:"R ∝ L",pow:1,note:"R = ρL/A",theme:"B5"},
  {y:"resistance R",x:"wire diameter d",rel:"R ∝ 1/d²",pow:-2,note:"area goes as d²",theme:"B5"},
  {y:"electrical power P",x:"current I (fixed R)",rel:"P ∝ I²",pow:2,note:"P = I²R",theme:"B5"},
  {y:"pressure p (fixed T, fixed n)",x:"volume V",rel:"p ∝ 1/V",pow:-1,note:"Boyle's law",theme:"B3"},
  {y:"drag-free projectile range",x:"launch speed v (same angle)",rel:"range ∝ v²",pow:2,note:"R = v²sin2θ/g",theme:"A1"}
];

let mode="drill";
let quizQ=null,quizGuess=null,quizResult=null;
let score={correct:0,total:0},streak=0,best=0;
let shapePow=2;

function switchMode(m){
  mode=m;
  document.getElementById("tabDrill").className="tab"+(m==="drill"?" active":"");
  document.getElementById("tabBank").className="tab"+(m==="bank"?" active":"");
  document.getElementById("tabShapes").className="tab"+(m==="shapes"?" active":"");
  if(m==="drill"&&!quizQ)generateQuiz();
  render();
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// symbolic factor formatting: k^pow as an exact string
function facStr(k,pow){
  if(pow===0)return"unchanged";
  const neg=pow<0,p=Math.abs(pow);
  let core;
  if(p===0.5){
    const r=Math.sqrt(k);
    core=Number.isInteger(r)?String(r):"√"+k;
  }else if(Number.isInteger(p)){
    core=String(Math.pow(k,p));
  }else{
    core=k+"^"+p;
  }
  if(core==="1")return"unchanged";
  return neg?"× 1/"+core:"× "+core;
}
function facVal(k,pow){return Math.pow(k,pow);}

function generateQuiz(){
  const rel=pick(RELS);
  const k=pick([2,3,4]);
  const reverse=Math.random()<0.3&&Number.isInteger(rel.pow)&&rel.pow>0;
  let prompt,answer,cands;
  if(!reverse){
    answer=facStr(k,rel.pow);
    // distractors: common exponent slips
    const powSlips=[1,2,0.5,-1,rel.pow*2,rel.pow/2,-rel.pow].filter(p=>p!==rel.pow);
    cands=[answer];
    for(const p of powSlips){
      const s=facStr(k,p);
      if(!cands.includes(s))cands.push(s);
      if(cands.length>=4)break;
    }
    prompt="For "+rel.note+", "+rel.rel+". The "+rel.x+" is multiplied by "+k+". What happens to the "+rel.y+"?";
  }else{
    // Y multiplied by k^pow, ask for X factor (fourth/square roots)
    const n=Math.pow(k,rel.pow);
    answer="× "+k;
    cands=[answer];
    for(const kk of[Math.pow(k,2),Math.sqrt(n),n,k*2]){
      const s="× "+(Number.isInteger(kk)?kk:kk.toFixed(2));
      if(!cands.includes(s))cands.push(s);
      if(cands.length>=4)break;
    }
    prompt="For "+rel.note+", "+rel.rel+". The "+rel.y+" is observed to increase by a factor of "+n+". By what factor did the "+rel.x+" change?";
  }
  quizQ={rel,k,reverse,prompt,answer,options:shuffle(cands.slice(0,4)),
    hint:reverse?"Invert the power: X ∝ Y^(1/"+rel.pow+"), and "+Math.pow(k,rel.pow)+"^(1/"+rel.pow+") = "+k+". Taking a square root where a higher root belongs is the sqrt-mishandled trap."
    :"Write it as Y ∝ X^"+rel.pow+", then substitute the factor: "+k+"^"+rel.pow+" gives "+facStr(k,rel.pow)+". Most wrong answers come from using the wrong exponent, not wrong arithmetic."};
  quizGuess=null;quizResult=null;
}
function selectGuess(k){if(!quizResult){quizGuess=k;render();}}
function checkAnswer(){
  if(!quizGuess||!quizQ)return;
  const ok=quizGuess===quizQ.answer;
  quizResult=ok?"correct":"incorrect";
  score.total++;
  if(ok){score.correct++;streak++;best=Math.max(best,streak);}
  else streak=0;
  render();
}
function nextQuestion(){generateQuiz();render();}

// ---- drill scene: the relation drawn as a curve ----
function renderDrillScene(){
  const rel=quizQ.rel;
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#110e0f;border-radius:12px;display:block">`;
  const gx=110,gy=50,gw=580,gh=290;
  svg+=`<text x="${W/2}" y="30" fill="#fca5a5" font-size="15" font-weight="700" text-anchor="middle">${rel.rel}</text>`;
  svg+=`<line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy+gh}" stroke="#4a3f41" stroke-width="1.5"/>`;
  svg+=`<line x1="${gx}" y1="${gy+gh}" x2="${gx+gw}" y2="${gy+gh}" stroke="#4a3f41" stroke-width="1.5"/>`;
  svg+=`<text x="${gx+gw/2}" y="${gy+gh+30}" fill="#bda9a5" text-anchor="middle" font-size="12">${rel.x}</text>`;
  svg+=`<text x="${gx-12}" y="${gy-14}" fill="#bda9a5" font-size="12">${rel.y}</text>`;
  const X0=0.45,X1=3.4;
  let ymax=0;
  for(let i=0;i<=200;i++){const x=X0+i/200*(X1-X0);ymax=Math.max(ymax,Math.pow(x,quizQ.rel.pow));}
  let d="";
  for(let i=0;i<=200;i++){
    const x=X0+i/200*(X1-X0);
    const y=Math.pow(x,rel.pow)/ymax;
    d+=(i===0?"M":"L")+(gx+i/200*(gw)).toFixed(1)+","+(gy+gh-y*(gh-10)).toFixed(1);
  }
  svg+=`<path d="${d}" fill="none" stroke="#ef4444" stroke-width="2.5"/>`;
  // marks at x=1 and x=k (relative)
  [[1,"#bda9a5"],[Math.min(quizQ.k,3.3),"#fca5a5"]].forEach(([xv,c])=>{
    const px=gx+(xv-X0)/(X1-X0)*gw;
    const py=gy+gh-Math.pow(xv,rel.pow)/ymax*(gh-10);
    svg+=`<circle cx="${px}" cy="${py}" r="6" fill="${c}"/>`;
    svg+=`<line x1="${px}" y1="${gy+gh}" x2="${px}" y2="${py}" stroke="${c}" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>`;
  });
  svg+=`<text x="${gx+gw-8}" y="${gy+gh-8}" fill="#8f7d79" font-size="10" text-anchor="end">${rel.note} · topic ${rel.theme}</text>`;
  return svg+"</svg>";
}

// ---- bank tab ----
function renderBankControls(){
  const rows=RELS.map(r=>`<tr><td class="rel">${r.rel}</td><td>${r.y} vs ${r.x}: ${r.note}</td><td class="theme">${r.theme}</td></tr>`).join("");
  document.getElementById("controlsContainer").innerHTML=`
    <div class="controls">
      <div class="section-title">The relation bank</div>
      <p class="section-desc">Every drill question comes from this table. It is worth reading once slowly: these are the proportionalities Paper 1 actually scales.</p>
    </div>`;
  document.getElementById("svgContainer").innerHTML=`
    <div class="controls" style="max-height:460px;overflow-y:auto">
      <table><tr><th>relation</th><th>where it lives</th><th>topic</th></tr>${rows}</table>
    </div>`;
}

// ---- shapes tab ----
function renderShapesScene(){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#110e0f;border-radius:12px;display:block">`;
  const gx=110,gy=44,gw=580,gh=300;
  svg+=`<line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy+gh}" stroke="#4a3f41" stroke-width="1.5"/>`;
  svg+=`<line x1="${gx}" y1="${gy+gh}" x2="${gx+gw}" y2="${gy+gh}" stroke="#4a3f41" stroke-width="1.5"/>`;
  const pows=[[4,"#ef4444"],[2,"#fb923c"],[1,"#facc15"],[0.5,"#34d399"],[-1,"#38bdf8"],[-2,"#a78bfa"]];
  const X0=0.35,X1=3;
  pows.forEach(([p,c])=>{
    const sel=p===shapePow;
    let d="";
    for(let i=0;i<=220;i++){
      const x=X0+i/220*(X1-X0);
      const y=Math.pow(x,p);
      if(y>3.4){d="";continue;}
      const px=gx+(x-X0)/(X1-X0)*gw,py=gy+gh-y/3.4*gh;
      d+=(d===""?"M":"L")+px.toFixed(1)+","+py.toFixed(1);
    }
    svg+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${sel?3.5:1.6}" opacity="${sel?1:0.6}"/>`;
  });
  // reference point (1,1)
  const px1=gx+(1-X0)/(X1-X0)*gw,py1=gy+gh-1/3.4*gh;
  svg+=`<circle cx="${px1}" cy="${py1}" r="5" fill="#fcf8f7"/>`;
  svg+=`<text x="${px1+10}" y="${py1+16}" fill="#8f7d79" font-size="10">(1, 1): all curves pass here</text>`;
  let lg=gy+8;
  pows.forEach(([p,c])=>{
    svg+=`<text x="${gx+gw-8}" y="${lg}" fill="${c}" font-size="12" font-weight="${p===shapePow?700:400}" text-anchor="end">Y ∝ X${p===1?"":p===0.5?"^½":"^"+p}</text>`;
    lg+=18;
  });
  return svg+"</svg>";
}
function setShapePow(p){shapePow=p;render();}
function shapeReadoutHtml(){
  return`<span class="eq"><span class="m">Selected: Y ∝ X${shapePow===0.5?"^½":"^"+shapePow}.</span></span>
  <span class="eq"><span class="m">X ×2 →</span> <strong>${facStr(2,shapePow)}</strong> <span class="m" style="margin-left:10px">X ×3 →</span> <strong>${facStr(3,shapePow)}</strong></span>
  <span class="eq"><span class="m">X ×4 →</span> <strong>${facStr(4,shapePow)}</strong></span>`;
}

// ---- main render ----
function render(){
  const svgEl=document.getElementById("svgContainer");
  const ctrlEl=document.getElementById("controlsContainer");
  const pedEl=document.getElementById("pedagogy");

  if(mode==="drill"){
    if(!quizQ)generateQuiz();
    svgEl.innerHTML=renderDrillScene();
    let optsHtml=quizQ.options.map(k=>{
      let cls="opt-btn";
      if(quizResult)cls+=" locked";
      if(quizGuess===k&&!quizResult)cls+=" selected";
      if(quizGuess===k&&quizResult==="correct")cls+=" correct";
      if(quizGuess===k&&quizResult==="incorrect")cls+=" wrong";
      return`<button class="${cls}" onclick="selectGuess('${k}')">${k}</button>`;
    }).join("");
    let resultHtml="";
    if(quizResult){
      if(quizResult==="correct")resultHtml=`<div class="result-text correct">Correct!${streak>=3?" &nbsp;🔥":""}</div>`;
      else resultHtml=`<div class="result-text wrong">Not quite — the answer is ${quizQ.answer}</div><p class="hint-text">${quizQ.hint}</p>`;
      resultHtml+=`<div class="next-row">
        <button class="check-btn" onclick="nextQuestion()">Next Question</button>
        <span class="score">Score: <strong>${score.correct}</strong> / ${score.total}</span>
        <span class="streak">streak ${streak}${best>2?" · best "+best:""}</span>
      </div>`;
    }
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="quiz-prompt">${quizQ.prompt}</p>
        <div class="quiz-opts">${optsHtml}</div>
        ${!quizResult?`<button class="check-btn" ${!quizGuess?'disabled':''} onclick="checkAnswer()">Check Answer</button>`:''}
        ${resultHtml}
      </div>`;
    pedEl.innerHTML=`<strong>The move, every single time:</strong> write the proportionality with its exponent visible, substitute the factor, and only then reach for numbers. "T ∝ √l, l ×4, so T ×√4 = ×2." Ten seconds, no algebra, no slips. The distractors in this dojo are the real exam's: the forgotten square root, the square that should be a fourth power, the inverse read the wrong way.`;

  } else if(mode==="bank"){
    renderBankControls();
    pedEl.innerHTML=`<strong>Why one dojo serves five themes:</strong> the physics changes but the mathematics of scaling does not. Factor-errors and exponent-errors together make up roughly a fifth of all banked Paper 1 distractor tags, spread across every topic. Master the move once and it pays everywhere from pendulums to stars.`;

  } else {
    svgEl.innerHTML=renderShapesScene();
    ctrlEl.innerHTML=`
      <div class="controls">
        <div class="section-title">Know the shapes</div>
        <p class="section-desc">All six curves pass through (1, 1); the exponent decides how fast they leave it. Select one and read its doubling behaviour.</p>
        <div class="label">Exponent</div>
        <div class="quiz-opts" style="flex-direction:row">
          ${[[4,"4"],[2,"2"],[1,"1"],[0.5,"½"],[-1,"−1"],[-2,"−2"]].map(([p,l])=>`<button class="opt-btn${p===shapePow?' selected':''}" onclick="setShapePow(${p})">${l}</button>`).join("")}
        </div>
        <div class="readout">${shapeReadoutHtml()}</div>
      </div>`;
    pedEl.innerHTML=`<strong>Graph-spotting bonus:</strong> Paper 1 sometimes asks which curve could show a given relation. The tells: a straight line through the origin is exponent 1; a curve through the origin getting steeper is 2 or more; through the origin getting flatter is ½; never touching either axis is negative. Anchor on the point (1, 1) and the doubling factor and the shapes stop being guesswork.`;
  }
}

render();
</script>
</body>
</html>
