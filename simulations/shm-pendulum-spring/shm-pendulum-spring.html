<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHM: the Irrelevant Mass and the Phase Story</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#1c1017;--panel:#2b1a25;--border:#553346;--text:#f4e5ee;--muted:#c399ae;--bright:#fdf4f9;--pend:#fb7185;--spring:#38bdf8;--vel:#f59e0b;--acc:#60a5fa;--correct:#34d399;--incorrect:#f87171;--accent:#ec4899;--accentBg:#4a1533;--accentTxt:#f9a8d4}
  body{font-family:'IBM Plex Sans','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:22px 18px;min-height:100vh}
  .container{max-width:1150px;margin:0 auto}
  .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.05em;padding:3px 10px;border-radius:6px;background:var(--accentBg);color:var(--accentTxt);margin-bottom:8px}
  h2{font-size:22px;font-weight:700;color:var(--bright);margin-bottom:4px}
  .subtitle{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .subtitle strong,.subtitle em{color:var(--text)}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .tab.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .tab:hover{border-color:#7a4a64}
  .main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
  .controls{background:var(--panel);border-radius:12px;padding:16px;border:1px solid var(--border)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
  .label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
  .btn-group{display:flex;flex-wrap:wrap;gap:4px}
  .dir-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .dir-btn.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .dir-btn:hover{border-color:#7a4a64}
  .quiz-prompt{font-size:14px;font-weight:600;margin-bottom:10px}
  .quiz-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .opt-btn{padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;text-align:left;transition:all .15s}
  .opt-btn.selected{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .opt-btn.correct{border-color:var(--correct);background:#064e3b;color:var(--correct);font-weight:700}
  .opt-btn.wrong{border-color:var(--incorrect);background:#7f1d1d;color:var(--incorrect);font-weight:700}
  .opt-btn.locked{cursor:default}
  .check-btn{padding:8px 24px;border-radius:8px;border:none;background:var(--accent);color:#3b0620;font-weight:700;font-size:14px;cursor:pointer}
  .check-btn:disabled{background:#553346;color:#8f6a7e;cursor:default}
  .result-text{font-size:15px;font-weight:700;margin-bottom:6px}
  .result-text.correct{color:var(--correct)}
  .result-text.wrong{color:var(--incorrect)}
  .hint-text{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .next-row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .score{font-size:13px;color:var(--muted)}
  .score strong{color:var(--correct)}
  .pedagogy{margin-top:16px;padding:14px 16px;background:#241420;border-radius:10px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.65}
  .pedagogy strong{color:var(--bright)}
  .section-title{font-size:15px;font-weight:700;color:var(--bright);margin-bottom:8px}
  .section-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .slider-wrap{margin-top:8px}
  .slider-wrap input[type=range]{width:100%;margin-top:6px;accent-color:var(--accent)}
  .readout{margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.8}
  .readout .m{color:var(--muted)}
  .eq{display:block;white-space:nowrap}
  svg{display:block;border-radius:12px;width:100%;height:auto}
</style>
</head>
<body>
<div class="container">
  <span class="chip">THEME C · WAVE BEHAVIOUR · C1 SIMPLE HARMONIC MOTION</span>
  <h2>SHM: the Irrelevant Mass and the Phase Story</h2>
  <p class="subtitle">Pendulum: <strong>T = 2π√(l/g)</strong> &nbsp;|&nbsp; Mass-spring: <strong>T = 2π√(m/k)</strong> &nbsp;|&nbsp; Amplitude appears in neither</p>

  <div class="tabs">
    <button class="tab active" id="tabExplore" onclick="switchMode('explore')">Explore Periods</button>
    <button class="tab" id="tabQuiz" onclick="switchMode('quiz')">Quiz Me</button>
    <button class="tab" id="tabPhase" onclick="switchMode('phase')">x, v, a in Phase</button>
  </div>

  <div class="main">
    <div id="svgContainer"></div>
    <div id="controlsContainer"></div>
  </div>
  <div class="pedagogy" id="pedagogy"></div>
</div>

<script>
// ============================================================
// Pendulum: T = 2 pi sqrt(l/g)  -> depends on l only (small angles)
// Spring:   T = 2 pi sqrt(m/k)  -> depends on m and k only
// Baseline periods 2.0 s; factors m,l,k,A each x1 or x2.
// Phase: x = A cos(wt), v = -Aw sin(wt), a = -w^2 x.
// ============================================================

const W=800,H=420;
const TWO_PI=2*Math.PI;

let mode="explore";
let fac={m:1,l:1,k:1,A:1};
let simT=0,lastTs=null,rafId=null;
let quizQ=null,quizGuess=null,quizResult=null;
let score={correct:0,total:0};
let phaseT=0.35;

const TP=()=>2.0*Math.sqrt(fac.l);          // pendulum period, s
const TS=()=>2.0*Math.sqrt(fac.m/fac.k);    // spring period, s

function switchMode(m){
  mode=m;
  document.getElementById("tabExplore").className="tab"+(m==="explore"?" active":"");
  document.getElementById("tabQuiz").className="tab"+(m==="quiz"?" active":"");
  document.getElementById("tabPhase").className="tab"+(m==="phase"?" active":"");
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  lastTs=null;
  if(m==="quiz"){score={correct:0,total:0};generateQuiz();}
  render();
  if(m==="explore")rafId=requestAnimationFrame(tick);
}
function setFac(k,v){fac[k]=v;renderExploreControls();}

function tick(ts){
  if(mode!=="explore"){rafId=null;return;}
  if(lastTs===null)lastTs=ts;
  const dt=Math.min(0.05,(ts-lastTs)/1000);
  lastTs=ts;
  simT+=dt;
  document.getElementById("svgContainer").innerHTML=renderExploreScene(simT);
  rafId=requestAnimationFrame(tick);
}

// ---- explore scene ----
function springPath(x1,y,x2,coils,amp){
  const n=coils*2;
  let d="M "+x1+" "+y;
  const seg=(x2-x1)/(n+2);
  d+=" L "+(x1+seg)+" "+y;
  for(let i=1;i<=n;i++){
    const px=x1+seg*(i+0.5);
    d+=" L "+px+" "+(y+(i%2?-amp:amp));
  }
  d+=" L "+(x2-seg*0.5)+" "+y+" L "+x2+" "+y;
  return d;
}
function renderExploreScene(t){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#160c12;border-radius:12px;display:block">`;
  // ------- pendulum (left) -------
  const pvx=200,pvy=52;
  const Lpx=100*fac.l;
  const th0=0.26*fac.A;
  const th=th0*Math.cos(TWO_PI*t/TP());
  const bx=pvx+ (Lpx+14)*Math.sin(th), by=pvy+(Lpx+14)*Math.cos(th);
  svg+=`<line x1="${pvx-46}" y1="${pvy}" x2="${pvx+46}" y2="${pvy}" stroke="#553346" stroke-width="4"/>`;
  svg+=`<line x1="${pvx}" y1="${pvy}" x2="${pvx}" y2="${pvy+Lpx+30}" stroke="#553346" stroke-width="1" stroke-dasharray="3,5" opacity="0.6"/>`;
  // amplitude guides
  svg+=`<line x1="${pvx}" y1="${pvy}" x2="${pvx+(Lpx+14)*Math.sin(th0)}" y2="${pvy+(Lpx+14)*Math.cos(th0)}" stroke="#7a4a64" stroke-width="1" stroke-dasharray="2,4" opacity="0.5"/>`;
  svg+=`<line x1="${pvx}" y1="${pvy}" x2="${pvx-(Lpx+14)*Math.sin(th0)}" y2="${pvy+(Lpx+14)*Math.cos(th0)}" stroke="#7a4a64" stroke-width="1" stroke-dasharray="2,4" opacity="0.5"/>`;
  svg+=`<line x1="${pvx}" y1="${pvy}" x2="${bx}" y2="${by}" stroke="#c399ae" stroke-width="2"/>`;
  const bobR=9*Math.sqrt(fac.m);
  svg+=`<circle cx="${bx}" cy="${by}" r="${bobR}" fill="#fb7185"/>`;
  svg+=`<text x="200" y="${pvy+Lpx+66}" fill="#fb7185" font-size="13" font-weight="700" text-anchor="middle">pendulum</text>`;
  svg+=`<text x="200" y="${pvy+Lpx+84}" fill="#c399ae" font-size="12" text-anchor="middle">T = ${TP().toFixed(2)} s</text>`;
  // ------- mass-spring (right) -------
  const wallX=440,eqX=610,sy=170;
  const disp=52*fac.A*Math.cos(TWO_PI*t/TS());
  const blk=15*Math.sqrt(fac.m);
  const blockL=eqX+disp-blk;
  svg+=`<line x1="${wallX}" y1="${sy-70}" x2="${wallX}" y2="${sy+70}" stroke="#553346" stroke-width="6"/>`;
  svg+=`<line x1="${wallX}" y1="${sy+70}" x2="770" y2="${sy+70}" stroke="#553346" stroke-width="2"/>`;
  svg+=`<path d="${springPath(wallX+3,sy,blockL,5+3*fac.k,13)}" fill="none" stroke="#38bdf8" stroke-width="${1.5+fac.k}"/>`;
  svg+=`<rect x="${blockL}" y="${sy-blk}" width="${blk*2}" height="${blk*2}" rx="4" fill="#38bdf8"/>`;
  svg+=`<line x1="${eqX}" y1="${sy-52}" x2="${eqX}" y2="${sy+68}" stroke="#7a4a64" stroke-width="1" stroke-dasharray="3,4" opacity="0.7"/>`;
  svg+=`<text x="${eqX}" y="${sy-58}" fill="#8f6a7e" font-size="10" text-anchor="middle">equilibrium</text>`;
  svg+=`<text x="${eqX}" y="${sy+100}" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">mass-spring</text>`;
  svg+=`<text x="${eqX}" y="${sy+118}" fill="#c399ae" font-size="12" text-anchor="middle">T = ${TS().toFixed(2)} s</text>`;
  svg+=`<text x="40" y="${H-18}" fill="#c399ae" font-size="11">Both started together at t = 0. If their periods differ they drift out of step; watch who cares about which knob.</text>`;
  svg+=`</svg>`;
  return svg;
}
function facBtns(key){
  return[1,2].map(v=>`<button class="dir-btn${fac[key]===v?' active':''}" onclick="setFac('${key}',${v})">×${v}</button>`).join("");
}
function renderExploreControls(){
  const tp=TP(),ts=TS();
  document.getElementById("controlsContainer").innerHTML=`
    <div class="controls">
      <p class="section-desc">Four knobs, two oscillators. Before touching one, predict which period changes. The mass knob is the famous trap: it moves the spring block's period and does precisely nothing to the pendulum.</p>
      <div class="grid4" style="margin-bottom:4px">
        <div><label class="label">mass m</label><div class="btn-group">${facBtns('m')}</div></div>
        <div><label class="label">length l</label><div class="btn-group">${facBtns('l')}</div></div>
        <div><label class="label">constant k</label><div class="btn-group">${facBtns('k')}</div></div>
        <div><label class="label">amplitude A</label><div class="btn-group">${facBtns('A')}</div></div>
      </div>
      <div class="readout">
        <span class="eq"><span class="m">Pendulum: T = 2π√(l/g) ∝ √l →</span> <strong>${tp.toFixed(2)} s</strong> <span class="m">(m and A absent)</span></span>
        <span class="eq"><span class="m">Spring: T = 2π√(m/k) →</span> <strong>${ts.toFixed(2)} s</strong> <span class="m">(A absent)</span></span>
        <span class="eq"><span class="m">Current knobs: m ×${fac.m}, l ×${fac.l}, k ×${fac.k}, A ×${fac.A}</span></span>
      </div>
    </div>`;
}

// ---- quiz ----
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const SCALE_ITEMS=[
  {q:"The length of a simple pendulum is made 4 times longer. Its period becomes...",ans:"×2",opts:["×2","×4","×16","unchanged"],hint:"T ∝ √l, so l ×4 gives T ×√4 = ×2. Answering ×4 is the classic square-root slip."},
  {q:"The mass of a simple pendulum's bob is made 4 times bigger. Its period becomes...",ans:"unchanged",opts:["unchanged","×2","×4","×½"],hint:"T = 2π√(l/g). The mass is not in the formula: it is stated only to tempt you. This is the mass red herring."},
  {q:"The mass on a spring oscillator is made 4 times bigger. Its period becomes...",ans:"×2",opts:["×2","×4","×16","unchanged"],hint:"T ∝ √m for the spring system, so m ×4 gives T ×2. The pendulum ignores mass; the spring does not."},
  {q:"The spring constant of a mass-spring oscillator is made 4 times bigger. Its period becomes...",ans:"×½",opts:["×½","×2","×¼","unchanged"],hint:"T ∝ 1/√k: a stiffer spring means a shorter period. k ×4 gives T ×½."},
  {q:"The length of a simple pendulum is doubled. Its period becomes...",ans:"×√2",opts:["×√2","×2","×4","unchanged"],hint:"T ∝ √l, so l ×2 gives T ×√2 ≈ ×1.41. Doubling l does not double T."},
  {q:"The amplitude of a simple pendulum's swing is doubled (still a small angle). Its period becomes...",ans:"unchanged",opts:["unchanged","×2","×√2","×4"],hint:"For SHM the period is independent of amplitude: a bigger swing travels further but moves faster. That is what isochronous means."}
];
const CHANGE_ITEMS=[
  {q:"Which change increases the period of a simple pendulum?",ans:"double its length",opts:["double its length","double the bob's mass","double the amplitude","move it somewhere with stronger gravity"],hint:"Only l and g appear in T = 2π√(l/g). More length: longer period. Stronger g: shorter. Mass and amplitude: nothing."},
  {q:"Which change increases the period of a mass-spring oscillator?",ans:"double the mass",opts:["double the mass","double the spring constant","double the amplitude","halve the mass"],hint:"T = 2π√(m/k): more mass, longer period; stiffer spring, shorter; amplitude, nothing."},
  {q:"Which change leaves the period of a simple pendulum unchanged?",ans:"double the bob's mass",opts:["double the bob's mass","double its length","halve its length","move it to the Moon"],hint:"The mass red herring, from the trap side: mass is not in T = 2π√(l/g). Length and gravity both matter."},
  {q:"Which change leaves the period of a mass-spring oscillator unchanged?",ans:"double the amplitude",opts:["double the amplitude","double the mass","double the spring constant","halve the mass"],hint:"Amplitude never appears in an SHM period formula: that independence is the defining surprise of SHM."}
];
const PHASE_ITEMS=[
  {q:"At maximum displacement, the oscillating object has...",ans:"v = 0 and a = maximum",opts:["v = 0 and a = maximum","v = maximum and a = 0","v = maximum and a = maximum","v = 0 and a = 0"],hint:"At the extremes it is momentarily at rest (v = 0) while the restoring force, and so a = −ω²x, is at its biggest."},
  {q:"As the object passes through equilibrium, it has...",ans:"v = maximum and a = 0",opts:["v = maximum and a = 0","v = 0 and a = maximum","v = maximum and a = maximum","v = 0 and a = 0"],hint:"At x = 0 the restoring force vanishes (a = −ω²x = 0) and all the energy is kinetic: speed is at its peak."},
  {q:"The acceleration of an object in SHM is...",ans:"always directed towards equilibrium",opts:["always directed towards equilibrium","always directed away from equilibrium","in the direction of the velocity","constant in magnitude"],hint:"a = −ω²x: the minus sign is the physics. Acceleration always points back at equilibrium, whatever the velocity is doing."}
];
function generateQuiz(){
  const r=Math.random();
  const item=r<0.4?pick(SCALE_ITEMS):r<0.75?pick(CHANGE_ITEMS):pick(PHASE_ITEMS);
  quizQ={prompt:item.q,answer:item.ans,options:shuffle(item.opts.slice()),hint:item.hint};
  quizGuess=null;quizResult=null;
}
function selectGuess(k){if(!quizResult){quizGuess=k;render();}}
function checkAnswer(){
  if(!quizGuess||!quizQ)return;
  const ok=quizGuess===quizQ.answer;
  quizResult=ok?"correct":"incorrect";
  score.total++;if(ok)score.correct++;
  render();
}
function nextQuestion(){generateQuiz();render();}

// ---- phase tab ----
function renderPhaseScene(t){
  const T=2.0,w=TWO_PI/T;
  const x=Math.cos(w*t),v=-Math.sin(w*t),a=-Math.cos(w*t);
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#160c12;border-radius:12px;display:block">`;
  // oscillator strip at top
  const oy=44,ox0=140,ox1=660,oxm=(ox0+ox1)/2;
  svg+=`<line x1="${ox0}" y1="${oy}" x2="${ox1}" y2="${oy}" stroke="#553346" stroke-width="2"/>`;
  svg+=`<line x1="${oxm}" y1="${oy-14}" x2="${oxm}" y2="${oy+14}" stroke="#7a4a64" stroke-width="1" stroke-dasharray="3,3"/>`;
  svg+=`<text x="${oxm}" y="${oy+30}" fill="#8f6a7e" font-size="10" text-anchor="middle">x = 0</text>`;
  svg+=`<circle cx="${oxm+x*230}" cy="${oy}" r="11" fill="#fb7185"/>`;
  // three stacked graphs
  const specs=[["x","#fb7185",u=>Math.cos(w*u)],["v","#f59e0b",u=>-Math.sin(w*u)],["a","#60a5fa",u=>-Math.cos(w*u)]];
  const gx=90,gw=640,gh=86;
  specs.forEach((sp,i)=>{
    const gy=92+i*106,mid=gy+gh/2;
    svg+=`<line x1="${gx}" y1="${mid}" x2="${gx+gw}" y2="${mid}" stroke="#553346" stroke-width="1"/>`;
    svg+=`<text x="${gx-16}" y="${mid+5}" fill="${sp[1]}" font-size="14" font-weight="700" text-anchor="end">${sp[0]}</text>`;
    let path="";
    for(let j=0;j<=320;j++){
      const u=j/320*4;
      path+=(j===0?"M":"L")+(gx+j/320*gw)+","+(mid-sp[2](u)*gh*0.42).toFixed(1);
    }
    svg+=`<path d="${path}" fill="none" stroke="${sp[1]}" stroke-width="2.2" opacity="0.85"/>`;
    const mx2=gx+t/4*gw,my2=mid-sp[2](t)*gh*0.42;
    svg+=`<line x1="${mx2}" y1="${gy}" x2="${mx2}" y2="${gy+gh}" stroke="#7a4a64" stroke-width="1" opacity="0.5"/>`;
    svg+=`<circle cx="${mx2}" cy="${my2}" r="5.5" fill="${sp[1]}"/>`;
  });
  svg+=`<text x="${gx+gw}" y="${H-14}" fill="#8f6a7e" font-size="10" text-anchor="end">t (s), two full periods</text>`;
  svg+=`</svg>`;
  return svg;
}
function phaseReadoutHtml(t){
  const T=2.0,w=TWO_PI/T;
  const x=Math.cos(w*t),v=-Math.sin(w*t),a=-Math.cos(w*t);
  const sgn=q=>Math.abs(q)<0.04?"zero":(q>0?"positive":"negative")+(Math.abs(q)>0.96?", maximum":"");
  return`<span class="eq"><span class="m">x = A cos ωt:</span> <strong>${sgn(x)}</strong></span>
  <span class="eq"><span class="m">v = −Aω sin ωt:</span> <strong>${sgn(v)}</strong> <span class="m">(quarter cycle ahead of x)</span></span>
  <span class="eq"><span class="m">a = −ω²x:</span> <strong>${sgn(a)}</strong> <span class="m">(exactly opposite to x, always)</span></span>`;
}
function setPhaseT(v){
  phaseT=Number(v);
  document.getElementById("svgContainer").innerHTML=renderPhaseScene(phaseT);
  document.getElementById("phaseLabel").textContent=phaseT.toFixed(2)+" s";
  document.getElementById("phaseReadout").innerHTML=phaseReadoutHtml(phaseT);
}

// ---- main render ----
function render(){
  const svgEl=document.getElementById("svgContainer");
  const ctrlEl=document.getElementById("controlsContainer");
  const pedEl=document.getElementById("pedagogy");

  if(mode==="explore"){
    svgEl.innerHTML=renderExploreScene(simT);
    renderExploreControls();
    pedEl.innerHTML=`<strong>Why the mass slider defeats so many candidates:</strong> examiners state the bob's mass precisely because it does nothing; three of the four options are then built from using it. Watching the pendulum ignore m ×2 while the spring block slows down is the fastest cure. The same applies to amplitude: neither oscillator's period cares (for small pendulum swings).
    <br><br><strong>One caveat for honesty:</strong> the pendulum formula assumes small angles; at large amplitude the period does grow slightly. IB questions stay in the small-angle world.`;

  } else if(mode==="quiz"){
    if(!quizQ)generateQuiz();
    svgEl.innerHTML=renderExploreScene(0.35);
    let optsHtml=quizQ.options.map(k=>{
      let cls="opt-btn";
      if(quizResult)cls+=" locked";
      if(quizGuess===k&&!quizResult)cls+=" selected";
      if(quizGuess===k&&quizResult==="correct")cls+=" correct";
      if(quizGuess===k&&quizResult==="incorrect")cls+=" wrong";
      return`<button class="${cls}" onclick="selectGuess('${k}')">${k}</button>`;
    }).join("");
    let resultHtml="";
    if(quizResult){
      if(quizResult==="correct")resultHtml=`<div class="result-text correct">Correct!</div>`;
      else resultHtml=`<div class="result-text wrong">Not quite — the answer is: ${quizQ.answer}</div><p class="hint-text">${quizQ.hint}</p>`;
      resultHtml+=`<div class="next-row">
        <button class="check-btn" onclick="nextQuestion()">Next Question</button>
        <span class="score">Score: <strong>${score.correct}</strong> / ${score.total}</span>
      </div>`;
    }
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="quiz-prompt">${quizQ.prompt}</p>
        <div class="quiz-opts">${optsHtml}</div>
        ${!quizResult?`<button class="check-btn" ${!quizGuess?'disabled':''} onclick="checkAnswer()">Check Answer</button>`:''}
        ${resultHtml}
      </div>`;
    pedEl.innerHTML=`<strong>Three question families here:</strong> scaling (T ∝ √l and √m: watch for the missing square root); which-variable-matters (the mass and amplitude red herrings); and phase (v and a at the extremes and at equilibrium). Between them they cover most one-mark SHM questions ever set.`;

  } else {
    svgEl.innerHTML=renderPhaseScene(phaseT);
    ctrlEl.innerHTML=`
      <div class="controls">
        <div class="section-title">Three graphs, one motion</div>
        <p class="section-desc">Drag time and watch the dot ride all three curves at once. v peaks where x crosses zero; a is x flipped upside down, always pointing home.</p>
        <div class="slider-wrap">
          <label class="label">time t: <span id="phaseLabel" style="color:var(--bright);font-size:15px">${phaseT.toFixed(2)} s</span></label>
          <input type="range" min="0" max="4" step="0.02" value="${phaseT}" oninput="setPhaseT(this.value)">
        </div>
        <div class="readout" id="phaseReadout">${phaseReadoutHtml(phaseT)}</div>
      </div>`;
    pedEl.innerHTML=`<strong>The relations to carry into the exam:</strong> v is a quarter of a cycle (90°, π/2) ahead of x; a is half a cycle (180°, π) from x, which is just a = −ω²x drawn out in time. Graph questions nearly always reduce to: find where x is zero or maximum, then read the other two off these phase rules.`;
  }
}

render();
if(mode==="explore")rafId=requestAnimationFrame(tick);
</script>
</body>
</html>
