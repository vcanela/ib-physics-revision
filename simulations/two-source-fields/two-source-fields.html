<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field and Potential of Two Sources</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0a1228;--panel:#131f42;--border:#28407c;--text:#e2e9fb;--muted:#93a7d8;--bright:#f3f7ff;--field:#f43f5e;--pot:#34d399;--srcp:#fbbf24;--srcm:#60a5fa;--correct:#34d399;--incorrect:#f87171;--accent:#3b82f6;--accentBg:#16295e;--accentTxt:#93c5fd}
  body{font-family:'IBM Plex Sans','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:22px 18px;min-height:100vh}
  .container{max-width:1150px;margin:0 auto}
  .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.05em;padding:3px 10px;border-radius:6px;background:var(--accentBg);color:var(--accentTxt);margin-bottom:8px}
  h2{font-size:22px;font-weight:700;color:var(--bright);margin-bottom:4px}
  .subtitle{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .tab.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
  .controls{background:var(--panel);border-radius:12px;padding:16px;border:1px solid var(--border)}
  .label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
  .btn-group{display:flex;flex-wrap:wrap;gap:4px}
  .dir-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
  .dir-btn.active{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .quiz-prompt{font-size:14px;font-weight:600;margin-bottom:10px}
  .quiz-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .opt-btn{padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;text-align:left;transition:all .15s}
  .opt-btn.selected{border-color:var(--accent);background:var(--accentBg);color:var(--accentTxt);font-weight:700}
  .opt-btn.correct{border-color:var(--correct);background:#064e3b;color:var(--correct);font-weight:700}
  .opt-btn.wrong{border-color:var(--incorrect);background:#7f1d1d;color:var(--incorrect);font-weight:700}
  .opt-btn.locked{cursor:default}
  .check-btn{padding:8px 24px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  .check-btn:disabled{background:#28407c;color:#6a80b5;cursor:default}
  .result-text{font-size:15px;font-weight:700;margin-bottom:6px}
  .result-text.correct{color:var(--correct)}
  .result-text.wrong{color:var(--incorrect)}
  .hint-text{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .next-row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .score{font-size:13px;color:var(--muted)}
  .score strong{color:var(--correct)}
  .pedagogy{margin-top:16px;padding:14px 16px;background:#0f1834;border-radius:10px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.65}
  .pedagogy strong{color:var(--bright)}
  .section-title{font-size:15px;font-weight:700;color:var(--bright);margin-bottom:8px}
  .section-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .slider-wrap{margin-top:8px}
  .slider-wrap input[type=range]{width:100%;margin-top:6px;accent-color:var(--accent)}
  .readout{margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.8}
  .readout .m{color:var(--muted)}
  .eq{display:block;white-space:nowrap}
  svg{display:block;border-radius:12px;width:100%;height:auto}
</style>
</head>
<body>
<div class="container">
  <span class="chip">THEME D · FIELDS · D1 + D2 GRAVITATIONAL AND ELECTRIC</span>
  <h2>Field and Potential of Two Sources</h2>
  <p class="subtitle">Fields add as vectors; potentials add as numbers. &nbsp;|&nbsp; g = −ΔV<sub>g</sub>/Δr, E = −ΔV<sub>e</sub>/Δr</p>

  <div class="tabs">
    <button class="tab active" id="tabExplore" onclick="switchMode('explore')">Probe the Axis</button>
    <button class="tab" id="tabQuiz" onclick="switchMode('quiz')">Quiz Me</button>
    <button class="tab" id="tabInv" onclick="switchMode('inv')">1/r² vs 1/r</button>
  </div>

  <div class="main">
    <div id="svgContainer"></div>
    <div id="controlsContainer"></div>
  </div>
  <div class="pedagogy" id="pedagogy"></div>
</div>

<script>
// ============================================================
// Two sources on a line, separation d = 6 units.
// Signed field component along the axis and scalar potential:
//   charge s at p:  E_x(x) = s·sign(x−p)/(x−p)² ,  V(x) = s/|x−p|
//   mass  m at p:   E_x(x) = −m·sign(x−p)/(x−p)² , V(x) = −m/|x−p|
// Zero-field point (same-type sources sA, sB): x = d/(1+√(sB/sA)) from A.
// ============================================================

const W=800,H=420,D=6;

const MODES={
  masses:{name:"two masses",sA:1,sB:1,grav:true},
  plusplus:{name:"+q and +q",sA:1,sB:1,grav:false},
  plus4:{name:"+q and +4q",sA:1,sB:4,grav:false},
  plusminus:{name:"+q and −q",sA:1,sB:-1,grav:false}
};
let mode="explore";
let srcMode="plus4";
let probeX=2.0;
let quizQ=null,quizGuess=null,quizResult=null;
let score={correct:0,total:0};
let invR=1;

function fieldAt(x,m){
  const M=MODES[m];
  let E=0;
  [[0,M.sA],[D,M.sB]].forEach(([p,s])=>{
    const r=x-p;
    if(Math.abs(r)>0.05)E+=M.grav?-Math.abs(s)*Math.sign(r)/(r*r):s*Math.sign(r)/(r*r);
  });
  return E;
}
function potAt(x,m){
  const M=MODES[m];
  let V=0;
  [[0,M.sA],[D,M.sB]].forEach(([p,s])=>{
    const r=Math.abs(x-p);
    if(r>0.05)V+=M.grav?-Math.abs(s)/r:s/r;
  });
  return V;
}
function zeroPointText(m){
  const M=MODES[m];
  if(M.grav||M.sB>0){
    const ratio=Math.sqrt(Math.abs(M.sB)/Math.abs(M.sA));
    const x0=D/(1+ratio);
    return{x0,txt:"field is zero at "+(x0/D*3).toFixed(1)+" d/3... "};
  }
  return{x0:null,txt:""};
}

function switchMode(m){
  mode=m;
  document.getElementById("tabExplore").className="tab"+(m==="explore"?" active":"");
  document.getElementById("tabQuiz").className="tab"+(m==="quiz"?" active":"");
  document.getElementById("tabInv").className="tab"+(m==="inv"?" active":"");
  if(m==="quiz"){score={correct:0,total:0};generateQuiz();}
  render();
}
function setSrcMode(m){srcMode=m;render();}
function setInvR(r){invR=r;render();}

// ---- scene ----
function srcGlyph(px,py,s,grav){
  const r=10+6*Math.sqrt(Math.abs(s));
  if(grav)return`<circle cx="${px}" cy="${py}" r="${r}" fill="#93a7d8"/><text x="${px}" y="${py+4}" fill="#0a1228" font-size="11" font-weight="700" text-anchor="middle">m${s>1?"×"+s:""}</text>`;
  const col=s>0?"#f43f5e":"#60a5fa";
  return`<circle cx="${px}" cy="${py}" r="${r}" fill="${col}"/><text x="${px}" y="${py+4}" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">${s>0?"+":"−"}${Math.abs(s)>1?Math.abs(s):""}</text>`;
}
function renderExploreScene(x){
  const M=MODES[srcMode];
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#070d1f;border-radius:12px;display:block">`;
  const ax=v=>110+v/D*580;
  const ay=96;
  svg+=`<line x1="${ax(-0.6)}" y1="${ay}" x2="${ax(6.6)}" y2="${ay}" stroke="#28407c" stroke-width="1.5"/>`;
  svg+=srcGlyph(ax(0),ay,M.grav?M.sA:M.sA,M.grav);
  svg+=srcGlyph(ax(D),ay,M.grav?M.sB:M.sB,M.grav);
  // probe with net field arrow
  const E=fieldAt(x,srcMode);
  const len=Math.min(70,Math.abs(E)*38+8);
  svg+=`<circle cx="${ax(x)}" cy="${ay}" r="6" fill="#f3f7ff"/>`;
  svg+=`<text x="${ax(x)}" y="${ay-46}" fill="#f3f7ff" font-size="12" font-weight="700" text-anchor="middle">P</text>`;
  if(Math.abs(E)>0.004){
    const dir=E>0?1:-1;
    svg+=`<line x1="${ax(x)}" y1="${ay-28}" x2="${ax(x)+dir*len}" y2="${ay-28}" stroke="#f43f5e" stroke-width="3.5"/><polygon points="${ax(x)+dir*(len+10)},${ay-28} ${ax(x)+dir*len},${ay-33} ${ax(x)+dir*len},${ay-23}" fill="#f43f5e"/>`;
  }else{
    svg+=`<text x="${ax(x)}" y="${ay-26}" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">E ≈ 0</text>`;
  }
  // graphs: field and potential vs x
  function curveGraph(gy,gh,fn,color,label,zeroLine){
    let s=`<text x="96" y="${gy+12}" fill="${color}" font-size="12" font-weight="700" text-anchor="end">${label}</text>`;
    const mid=gy+gh/2;
    if(zeroLine)s+=`<line x1="110" y1="${mid}" x2="690" y2="${mid}" stroke="#28407c" stroke-width="1"/>`;
    let d="",pen=false;
    const CLIP=gh/2-6;
    for(let i=0;i<=400;i++){
      const xv=0.12+i/400*(D-0.24);
      if(Math.abs(xv)<0.3||Math.abs(xv-D)<0.3){pen=false;continue;}
      let yv=fn(xv)*26;
      if(Math.abs(yv)>CLIP){pen=false;continue;}
      d+=(pen?"L":"M")+ax(xv).toFixed(1)+","+(mid-yv).toFixed(1);
      pen=true;
    }
    s+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2"/>`;
    // marker
    const mv=fn(x)*26;
    if(Math.abs(mv)<=CLIP)s+=`<circle cx="${ax(x)}" cy="${mid-mv}" r="5" fill="${color}"/>`;
    s+=`<line x1="${ax(x)}" y1="${gy}" x2="${ax(x)}" y2="${gy+gh}" stroke="#6a80b5" stroke-width="1" opacity="0.35"/>`;
    return s;
  }
  svg+=curveGraph(150,120,v=>fieldAt(v,srcMode),"#f43f5e","E along axis",true);
  svg+=curveGraph(285,120,v=>potAt(v,srcMode),"#34d399","V",true);
  svg+=`<text x="690" y="412" fill="#6a80b5" font-size="10" text-anchor="end">position along the line joining the sources</text>`;
  return svg+"</svg>";
}
function exploreReadout(x){
  const M=MODES[srcMode];
  const E=fieldAt(x,srcMode),V=potAt(x,srcMode);
  let zeroLine;
  if(M.grav||M.sB>0){
    const ratio=Math.sqrt(Math.abs(M.sB)/Math.abs(M.sA));
    const frac=1/(1+ratio);
    zeroLine=`Field zero at ${(frac).toFixed(2)} d from the ${Math.abs(M.sB)>=Math.abs(M.sA)?"weaker (left)":"stronger"} source: closer to the weaker one.`;
  }else{
    zeroLine="Opposite sources: between them the two fields point the same way, so the field is never zero there. The zero lies outside, beyond the weaker source.";
  }
  return`<span class="eq"><span class="m">At P:</span> <span class="m">E ∝</span> <strong>${E.toFixed(3)}</strong> <span class="m" style="margin-left:10px">V ∝</span> <strong>${V.toFixed(3)}</strong></span>
  <span class="eq"><span class="m">${zeroLine}</span></span>
  <span class="eq"><span class="m">${M.grav?"Gravitational potential is negative everywhere; it climbs toward zero at infinity.":"Watch where E = 0 while V is not, and where V = 0 while E is not."}</span></span>`;
}
function setProbe(v){
  probeX=Number(v);
  document.getElementById("svgContainer").innerHTML=renderExploreScene(probeX);
  document.getElementById("probeReadout").innerHTML=exploreReadout(probeX);
}

// ---- quiz ----
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const BANK=[
  {q:"At the midpoint between two equal positive charges...",ans:"the field is zero but the potential is not",opts:["the field is zero but the potential is not","the potential is zero but the field is not","both are zero","neither is zero"],hint:"The two field vectors are equal and opposite: they cancel. The two potentials are equal positive numbers: they add. Fields are vectors, potentials are scalars.",scene:"plusplus"},
  {q:"At the midpoint between charges +q and −q...",ans:"the potential is zero but the field is not",opts:["the potential is zero but the field is not","the field is zero but the potential is not","both are zero","neither is zero"],hint:"The potentials +q/r and −q/r cancel exactly. The field vectors both point from + toward −: they add. The mirror image of the previous case.",scene:"plusminus"},
  {q:"Charges +q and +4q are separated by d. The field is zero...",ans:"at d/3 from the +q charge",opts:["at d/3 from the +q charge","at d/3 from the +4q charge","at the midpoint","nowhere on the line"],hint:"Zero lies closer to the weaker charge: q/x² = 4q/(d−x)² gives (d−x) = 2x, so x = d/3 from +q. Putting it nearer the big charge is the classic inversion.",scene:"plus4"},
  {q:"For charges +q and −4q, the point of zero field on their line is...",ans:"outside the pair, beyond the +q charge",opts:["outside the pair, beyond the +q charge","between them, nearer +q","at the midpoint","outside the pair, beyond the −4q charge"],hint:"Between opposite charges the fields point the same way and cannot cancel. Outside, they oppose; cancellation needs the weaker charge closer, so the zero sits beyond +q.",scene:"plusminus"},
  {q:"Gravitational potential is always negative because...",ans:"the zero is taken at infinity and gravity is attractive",opts:["the zero is taken at infinity and gravity is attractive","mass is always positive","fields point inwards","energy cannot be created"],hint:"V = −Gm/r with V(∞) = 0: pulling away from an attracting mass costs energy, so every finite point sits below the zero.",scene:"masses"},
  {q:"Along a line where the potential passes through a maximum, the field component along that line is...",ans:"zero at the maximum",opts:["zero at the maximum","maximum there too","negative everywhere","equal to the potential"],hint:"Field is the negative gradient of potential. Where V has zero slope, the field component vanishes: exactly what happens at the zero-field point between like charges.",scene:"plusplus"},
  {q:"Two equal masses are separated by d. At the midpoint...",ans:"g is zero; V is negative",opts:["g is zero; V is negative","g is zero; V is zero","g is maximum; V is zero","g and V are both maximum"],hint:"The attractions cancel at the midpoint, so g = 0. The potentials are both negative and add: V is decidedly nonzero.",scene:"masses"}
];
function generateQuiz(){
  const item=pick(BANK);
  quizQ={prompt:item.q,answer:item.ans,options:shuffle(item.opts.slice()),hint:item.hint,scene:item.scene};
  quizGuess=null;quizResult=null;
}
function selectGuess(k){if(!quizResult){quizGuess=k;render();}}
function checkAnswer(){
  if(!quizGuess||!quizQ)return;
  const ok=quizGuess===quizQ.answer;
  quizResult=ok?"correct":"incorrect";
  score.total++;if(ok)score.correct++;
  render();
}
function nextQuestion(){generateQuiz();render();}
function renderQuizScene(){
  const M=MODES[quizQ.scene];
  let svg=`<svg viewBox="0 0 ${W} 200" xmlns="http://www.w3.org/2000/svg" style="background:#070d1f;border-radius:12px;display:block">`;
  const ax=v=>110+v/D*580;
  svg+=`<line x1="${ax(-0.6)}" y1="100" x2="${ax(6.6)}" y2="100" stroke="#28407c" stroke-width="1.5"/>`;
  svg+=srcGlyph(ax(0),100,M.sA,M.grav);
  svg+=srcGlyph(ax(D),100,M.sB,M.grav);
  svg+=`<line x1="${ax(3)}" y1="88" x2="${ax(3)}" y2="112" stroke="#6a80b5" stroke-width="1" stroke-dasharray="3,3"/>`;
  svg+=`<text x="${ax(3)}" y="140" fill="#6a80b5" font-size="10" text-anchor="middle">midpoint</text>`;
  return svg+"</svg>";
}

// ---- 1/r² vs 1/r tab ----
function renderInvScene(){
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#070d1f;border-radius:12px;display:block">`;
  const gx=110,gy=50,gw=580,gh=300;
  const px=r=>gx+(r-0.5)/3*gw;
  const py=v=>gy+gh-v/4.2*gh;
  svg+=`<line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy+gh}" stroke="#28407c" stroke-width="1.5"/>`;
  svg+=`<line x1="${gx}" y1="${gy+gh}" x2="${gx+gw}" y2="${gy+gh}" stroke="#28407c" stroke-width="1.5"/>`;
  svg+=`<text x="${gx+gw/2}" y="${gy+gh+34}" fill="#93a7d8" text-anchor="middle" font-size="12">distance r from a single source</text>`;
  for(let r=1;r<=3;r++){
    svg+=`<line x1="${px(r)}" y1="${gy+gh}" x2="${px(r)}" y2="${gy+gh+5}" stroke="#28407c"/>`;
    svg+=`<text x="${px(r)}" y="${gy+gh+18}" fill="#6a80b5" text-anchor="middle" font-size="10">${r}r₀</text>`;
  }
  let d1="",d2="";
  for(let i=0;i<=300;i++){
    const r=0.52+i/300*2.98;
    d1+=(i===0?"M":"L")+px(r).toFixed(1)+","+py(Math.min(4.2,1/(r*r))).toFixed(1);
    d2+=(i===0?"M":"L")+px(r).toFixed(1)+","+py(Math.min(4.2,1/r)).toFixed(1);
  }
  svg+=`<path d="${d1}" fill="none" stroke="#f43f5e" stroke-width="2.5"/>`;
  svg+=`<path d="${d2}" fill="none" stroke="#34d399" stroke-width="2.5"/>`;
  svg+=`<text x="${gx+20}" y="${gy+16}" fill="#f43f5e" font-size="13" font-weight="700">field strength ∝ 1/r²</text>`;
  svg+=`<text x="${gx+20}" y="${gy+36}" fill="#34d399" font-size="13" font-weight="700">|potential| ∝ 1/r</text>`;
  // markers
  svg+=`<circle cx="${px(invR)}" cy="${py(1/(invR*invR))}" r="6" fill="#f43f5e"/>`;
  svg+=`<circle cx="${px(invR)}" cy="${py(1/invR)}" r="6" fill="#34d399"/>`;
  svg+=`<line x1="${px(invR)}" y1="${gy}" x2="${px(invR)}" y2="${gy+gh}" stroke="#6a80b5" stroke-width="1" opacity="0.4"/>`;
  return svg+"</svg>";
}

// ---- main render ----
function render(){
  const svgEl=document.getElementById("svgContainer");
  const ctrlEl=document.getElementById("controlsContainer");
  const pedEl=document.getElementById("pedagogy");

  if(mode==="explore"){
    svgEl.innerHTML=renderExploreScene(probeX);
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="section-desc">Slide the probe P along the line joining the sources and watch the field (vector, red) and potential (scalar, green) graphs together. Find the point where one is zero and the other very much is not.</p>
        <div class="label">Sources</div>
        <div class="btn-group" style="margin-bottom:8px">
          ${Object.keys(MODES).map(k=>`<button class="dir-btn${k===srcMode?' active':''}" onclick="setSrcMode('${k}')">${MODES[k].name}</button>`).join("")}
        </div>
        <div class="slider-wrap">
          <label class="label">probe position</label>
          <input type="range" min="0.4" max="5.6" step="0.02" value="${probeX}" oninput="setProbe(this.value)">
        </div>
        <div class="readout" id="probeReadout">${exploreReadout(probeX)}</div>
      </div>`;
    pedEl.innerHTML=`<strong>The one distinction this sim exists for:</strong> field is a vector, potential is a scalar. Two equal contributions can cancel as vectors while adding as numbers, and vice versa. Theme D's signature exam trap is precisely this: field vs force vs potential confusion, usually dressed as a "where is it zero?" question.
    <br><br><strong>Zero-point rule of thumb:</strong> like sources: zero between them, nearer the weaker one. Opposite sources: never between them; outside, beyond the weaker one.`;

  } else if(mode==="quiz"){
    if(!quizQ)generateQuiz();
    svgEl.innerHTML=renderQuizScene();
    let optsHtml=quizQ.options.map(k=>{
      let cls="opt-btn";
      if(quizResult)cls+=" locked";
      if(quizGuess===k&&!quizResult)cls+=" selected";
      if(quizGuess===k&&quizResult==="correct")cls+=" correct";
      if(quizGuess===k&&quizResult==="incorrect")cls+=" wrong";
      return`<button class="${cls}" onclick="selectGuess('${k}')">${k}</button>`;
    }).join("");
    let resultHtml="";
    if(quizResult){
      if(quizResult==="correct")resultHtml=`<div class="result-text correct">Correct!</div>`;
      else resultHtml=`<div class="result-text wrong">Not quite — the answer is: ${quizQ.answer}</div><p class="hint-text">${quizQ.hint}</p>`;
      resultHtml+=`<div class="next-row">
        <button class="check-btn" onclick="nextQuestion()">Next Question</button>
        <span class="score">Score: <strong>${score.correct}</strong> / ${score.total}</span>
      </div>`;
    }
    ctrlEl.innerHTML=`
      <div class="controls">
        <p class="quiz-prompt">${quizQ.prompt}</p>
        <div class="quiz-opts">${optsHtml}</div>
        ${!quizResult?`<button class="check-btn" ${!quizGuess?'disabled':''} onclick="checkAnswer()">Check Answer</button>`:''}
        ${resultHtml}
      </div>`;
    pedEl.innerHTML=`<strong>Before answering any of these:</strong> say which quantity is a vector and which is a scalar, then ask "can these two contributions cancel?". Every question in this quiz is that one move in different clothing, and so are the real Paper 1 versions.`;

  } else {
    svgEl.innerHTML=renderInvScene();
    ctrlEl.innerHTML=`
      <div class="controls">
        <div class="section-title">Two different falls</div>
        <p class="section-desc">One source, two laws. Field strength drops with the square; potential drops only with the first power. Step the distance and compare.</p>
        <div class="label">distance</div>
        <div class="btn-group">${[1,2,3].map(r=>`<button class="dir-btn${r===invR?' active':''}" onclick="setInvR(${r})">${r} r₀</button>`).join("")}</div>
        <div class="readout">
          <span class="eq"><span class="m">field: 1/${invR}² =</span> <strong>${(1/(invR*invR)).toFixed(2).replace(/\.00$/,"")} × the value at r₀</strong></span>
          <span class="eq"><span class="m">|potential|: 1/${invR} =</span> <strong>${(1/invR).toFixed(2).replace(/\.00$/,"")} × the value at r₀</strong></span>
          <span class="eq"><span class="m">Doubling r quarters the field but only halves the potential.</span></span>
        </div>
      </div>`;
    pedEl.innerHTML=`<strong>Exam payoff:</strong> "the field at the surface is g; what is it at height R?" (÷4, using 1/r² from the centre) versus "the potential at the surface is V; at height R?" (÷2). Mixing the two exponents is a standard distractor pair, and the graph shapes themselves get asked: the field curve hugs the axis much faster.`;
  }
}

render();
</script>
</body>
</html>
